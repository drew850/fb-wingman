  function buildEvalPrompt(ticket) {
    var scoreOptions=matrix.map(function(c){return c.levels.map(function(l){return l.points!==null?l.level+" ("+l.points+")":l.level;}).join("|");});
    var rubric=matrix.map(function(c,i){return c.label+" ["+scoreOptions[i]+"]: "+c.levels.map(function(l){return l.level+"="+l.definition;}).join(" | ");}).join("\n");
    var afLines=autofailList.map(function(a,i){return (i+1)+". "+a;}).join("\n");
    var scoresSchema=matrix.map(function(c,i){return '"'+c.id+'":"'+scoreOptions[i]+'"';}).join(",");
    var justSchema=matrix.map(function(c){return '"'+c.id+'":{"reason":"1-2 sentences","improve":"1 sentence or null"}';}).join(",");
    var cleanTranscript = (ticket.transcript||"")
      .slice(0,8000)
      .replace(/â€™/g,"'").replace(/â€˜/g,"'")
      .replace(/â€œ/g,'"').replace(/â€/g,'"')
      .replace(/â€"/g,"—").replace(/â€"/g,"–").replace(/â€¦/g,"...");
    return "You are a QA evaluator for Freedom Grooming customer support. Respond in English only.\n\n"
      +"ENCODING NOTE: The transcript may contain mojibake encoding artifacts (e.g. â€™ â€œ). "
      +"Interpret these as their intended characters (smart quotes, apostrophes) and evaluate normally.\n\n"
      +"IMPORTANT CONTEXT:\n"
      +"- Freedom Grooming uses Jamie as their AI customer service agent — Jamie IS the agent being evaluated\n"
      +"- Gorgias Bot sends only the auto-acknowledgment reply — do NOT evaluate Gorgias Bot\n"
      +"- Yuma is an escalation system — do NOT evaluate Yuma messages\n"
      +"- The AGENT to evaluate is: "+ticket.agentName+"\n"
      +"- If "+ticket.agentName+" has replied in the transcript, evaluate their response\n"
      +"- Score NA only when a category genuinely does not apply (e.g. no order cancellation = NA for that category)\n"
      +"- If the agent named above has NOT replied yet, score all categories NA except CTF\n"
      +"- Score based on what IS in the transcript\n"
+(scoringContext&&scoringContext.trim()?"- WORKFLOW & CONTEXT NOTES:\n"+scoringContext.trim()+"\n":"")
      +"CATEGORIES:\n"+rubric+"\n\n"
      +"AUTOFAILS:\n"+afLines+"\n\n"
      +"TICKET ID: "+ticket.ticketId+"\n"
      +"AGENT: "+ticket.agentName+"\n"
      +"SUBJECT: "+ticket.contactReason+"\n\n"
      +"TICKET FIELD VALUES (already tagged by agent — use these to evaluate CTF Accuracy):\n"
      +"  Contact Reason: "+(ticket.contactReason||"not tagged")+"\n"
      +"  Product: "+((ticket.productL1&&ticket.productL2&&ticket.productL2!=="N/A")?ticket.productL1+"::"+ticket.productL2:ticket.productL1||"not tagged")+"\n"
      +"  Ticket Resolution: "+((ticket.resolutionL1&&ticket.resolutionL2&&ticket.resolutionL2!=="N/A")?ticket.resolutionL1+"::"+ticket.resolutionL2:ticket.resolutionL1||"not tagged")+"\n"
      +"  Additional Resolution: "+((ticket.addResolutionL1&&ticket.addResolutionL2&&ticket.addResolutionL2!=="N/A")?ticket.addResolutionL1+"::"+ticket.addResolutionL2:ticket.addResolutionL1||"not tagged")+"\n\n"
      +"TRANSCRIPT:\n"+cleanTranscript+"\n\n"
      +'Respond ONLY with JSON: {"meta":{"contactReason":"...","product":"...","ticketResolution":"...","returnOrRefund":"..."},'
      +'"scores":{'+scoresSchema+'},'
      +'"justifications":{'+justSchema+'},'
      +'"autofails":[],'
      +'"comments":"+ [key strength observation]\\n- [key improvement observation]"}';
  }

  async function runBatchQA() {
    if(!batchTickets.length)return;
    setBatchRunning(true);batchStopRef.current=false;batchPausedRef.current=false;setBatchPaused(false);

    // Build set of already-evaluated ticket IDs (active tickets + deleted/archived + current batch results)
    var alreadyDone=new Set(
      tickets.map(function(t){return String(t.ticketId);})
        .concat(Array.from(deletedTicketIds))
        .concat(batchResults.filter(function(r){return !r.error;}).map(function(r){return String(r.ticketId);}))
    );

    var results=[...batchResults];
    var startIdx=results.length;
    var skipped=0;
    for(var i=startIdx;i<batchTickets.length;i++){
      if(batchStopRef.current){setBatchStatus("Stopped at ticket "+(i+1)+".");break;}
      while(batchPausedRef.current){await new Promise(function(r){setTimeout(r,500);});}
      var ticket=batchTickets[i];

      // Skip if already evaluated
      if(alreadyDone.has(String(ticket.ticketId))){
        skipped++;
        setBatchStatus("Skipping #"+ticket.ticketId+" — already evaluated ("+skipped+" skipped so far)");
        setBatchResults([...results]);
        continue;
      }
      alreadyDone.add(String(ticket.ticketId)); // prevent dupes within same batch

      var transcriptLen = (ticket.transcript||"").trim().length;
      setBatchStatus("Evaluating "+(i+1)+" of "+batchTickets.length+" — #"+ticket.ticketId+" ("+transcriptLen+" chars)"+(skipped?" · "+skipped+" skipped":""));
      if (!ticket.transcript || ticket.transcript.trim().length < 20) {
        results=[...results,{ticketId:ticket.ticketId,agentName:ticket.agentName,error:"No transcript found in CSV",finalScore:0,passed:false,autofail:false,week}];
        setBatchResults([...results]);
        continue;
      }
      var newResult=null;
      try {
        var rawTxt=await callClaudeWithRetry(buildEvalPrompt(ticket));
        var cleanTxt=rawTxt.replace(/```(?:json)?\s*/g,"").replace(/```/g,"").trim();
        var jsonMatch=cleanTxt.match(/\{[\s\S]+\}/);
        if(!jsonMatch)throw new Error("No JSON in response");
        var parsed=JSON.parse(jsonMatch[0]);
        var sc=calcScore(parsed.scores||{},matrix);
        var hasAF=(parsed.autofails||[]).length>0;
        newResult={
          id:Date.now()+i,week:ticketWeekLabel(ticket.createdDate)||week,auditWeek:week,
          reviewer:ticket.reviewer||activeAuditor||"Batch QA",
          agentName:ticket.agentName,ticketId:String(ticket.ticketId),ticketUrl:ticket.ticketUrl,
          createdDate:ticket.createdDate||"",
          contactReason:parsed.meta?.contactReason||ticket.contactReason,
          product:parsed.meta?.product||"",ticketResolution:parsed.meta?.ticketResolution||"",
          scores:parsed.scores||{},aiScores:parsed.scores||{},
          autofails:parsed.autofails||[],autofail:hasAF,
          comments:parsed.comments||"",
          totalPoints:sc?sc.pts:0,maxPoints:sc?sc.max:0,
          finalScore:sc?sc.pct:0,aiScore:sc?sc.pct:0,
          passed:!hasAF&&(sc?sc.pct:0)>=85,
          hasDisputes:false,disputes:{},
          justifications:parsed.justifications||{},
          customerEmail:ticket.customerEmail,
          savedAt:new Date().toISOString(),
          transcript:ticket.transcript||"",
          messageCount:ticket.messageCount||0,
          agentMessageCount:ticket.agentMessageCount||0,
          ctfAsScored:pickCtfTags(ticket),
        };
        // Save to the database immediately
        setBatchStatus("Saving #"+ticket.ticketId+"...");
        try {
          var savedA = await saveTicketToDb(newResult);
          if(savedA && savedA.id){ newResult.rowId = savedA.id; newResult.id = savedA.id; }
          setTickets(function(prev){return prev.concat([newResult]);});
        } catch(saveErr) {
          dbg("batch","save FAILED for #"+ticket.ticketId+": "+saveErr.message);
          console.error("Save failed for",ticket.ticketId,saveErr);
          newResult._saveError=saveErr.message;
        }
        results=[...results,newResult];
      } catch(err){
        results=[...results,{ticketId:ticket.ticketId,agentName:ticket.agentName,error:err.message,finalScore:0,passed:false,autofail:false,week}];
      }
      setBatchResults([...results]);
      // Paid tier: short delay between tickets to avoid bursts
      if(i < batchTickets.length-1 && !batchStopRef.current) {
        setBatchStatus("Processing next ticket...");
        await new Promise(function(r){setTimeout(r,2000);});
      }
    }
    setBatchRunning(false);
    if(!batchStopRef.current){
      var evalCount=results.filter(function(r){return !r.error&&!r._saveError;}).length;
      var saveErrors=results.filter(function(r){return r._saveError;}).length;
      var msg="Done! "+evalCount+" tickets evaluated and saved"+(skipped>0?" · "+skipped+" skipped":"")+(saveErrors>0?" · "+saveErrors+" save errors":"");
      setBatchStatus(msg);
      addToast(evalCount+" tickets saved"+(saveErrors>0?" ("+saveErrors+" save errors)":""));
      setTimeout(function(){
        setBatchTickets([]);setBatchResults([]);setBatchStatus("");
        setView("dashboard");
      },2000);
    }
  }

  async function saveBatchToDatabase() {
    var valid=batchResults.filter(function(r){return !r.error;});
    if(!valid.length){addToast("No valid results to save","error");return;}
    addToast("Saving "+valid.length+" tickets...");
    var saved=0, failed=0, firstError="";
    for(var i=0;i<valid.length;i++){
      try {
        var result = await saveTicketToDb(valid[i]);

        valid[i].rowId = result.id; valid[i].id = result.id;
        saved++;
        setBatchStatus("Saved "+(i+1)+" of "+valid.length+"...");

        console.error("Save failed for ticket", valid[i].ticketId, e);
        if(!firstError) firstError = e.message;

      setBatchTickets([]);setBatchResults([]);setBatchStatus("");
      setView("dashboard");
    }
  }

  async function buildAgentReportHTML(agentName, fromVal, toVal, onStatus) {
    var agentTickets = tickets.filter(function(t) {
      if(t.agentName !== agentName) return false;
      // Use createdDate if available, fall back to savedAt (many migrated tickets have blank createdDate)
      var created = ((t.createdDate||"").slice(0,10)) || ((t.savedAt||"").slice(0,10));
      if(fromVal && toVal) {
        if(!created) return false; // skip tickets with no date when filtering by range
        if(created < fromVal) return false;
        if(created > toVal) return false;
      }
      return true;
    });
    if(!agentTickets.length) return null;

    var avg = Math.round(agentTickets.reduce(function(s,t){return s+t.finalScore;},0)/agentTickets.length);
    var highest = Math.max.apply(null, agentTickets.map(function(t){return t.finalScore;}));
    var lowest = Math.min.apply(null, agentTickets.map(function(t){return t.finalScore;}));
    var passed = agentTickets.filter(function(t){return t.passed;}).length;
    var failed = agentTickets.filter(function(t){return !t.passed&&!t.autofail;}).length;
    var autofails = agentTickets.filter(function(t){return t.autofail||(t.autofails&&t.autofails.length>0);}).length;
    var dateLabel = fromVal && toVal ? fromVal+" - "+toVal : fromVal ? "From "+fromVal : toVal ? "Up to "+toVal : (agentTickets[agentTickets.length-1]&&agentTickets[agentTickets.length-1].week)||"All time";
    var firstName = agentName.split(" ")[0];

    function sc(pct){if(pct>=85)return{t:"#166534",bg:"#f0fdf4",b:"#bbf7d0"};if(pct>=70)return{t:"#92400e",bg:"#fffbeb",b:"#fde68a"};return{t:"#991b1b",bg:"#fee2e2",b:"#fecaca"};}
    function badge(lbl){if(lbl==="Pass")return "background:#e6f4ec;color:#166534;border:1px solid #bbf7d0;";if(lbl==="Partial")return "background:#fef9c3;color:#854d0e;border:1px solid #fde68a;";if(lbl==="Miss")return "background:#fee2e2;color:#991b1b;border:1px solid #fecaca;";return "background:#f3f4f6;color:#6b7280;border:1px solid #e5e7eb;";}
    function catLbl(val){if(!val||val==="NA")return null;var v=val.toUpperCase();if(v.startsWith("YES"))return "Pass";if(v.startsWith("PARTIAL"))return "Partial";if(v.startsWith("NO"))return "Miss";return null;}

    var tone=sc(avg);

    // Category performance bars
    var catSummary=matrix.map(function(c){
      var app=agentTickets.filter(function(t){var v=(t.scores&&t.scores[c.id])||"";return v&&v!=="NA";});
      if(!app.length)return null;
      var pass=app.filter(function(t){return catLbl((t.scores&&t.scores[c.id])||"")==="Pass";}).length;
      var pct=Math.round(pass/app.length*100);var tone2=sc(pct);
      return "<div class='cr'><div class='cr-hd'><span class='cr-nm'>"+c.label+"</span><span class='cr-pct' style='color:"+tone2.t+";'>"+pct+"%</span></div><div class='bar-bg'><div class='bar-fg' style='width:"+pct+"%;background:"+tone2.t+";'></div></div></div>";
    }).filter(Boolean).join("");

    // Build data summary for AI summary generation
    var catStats=matrix.map(function(c){
      var app=agentTickets.filter(function(t){var v=(t.scores&&t.scores[c.id])||"";return v&&v!=="NA";});
      if(!app.length)return null;
      var pass=app.filter(function(t){return catLbl((t.scores&&t.scores[c.id])||"")==="Pass";}).length;
      var partial=app.filter(function(t){return catLbl((t.scores&&t.scores[c.id])||"")==="Partial";}).length;
      var miss=app.filter(function(t){return catLbl((t.scores&&t.scores[c.id])||"")==="Miss";}).length;
      return c.label+": "+Math.round(pass/app.length*100)+"% pass ("+pass+" pass, "+partial+" partial, "+miss+" miss of "+app.length+" applicable)";
    }).filter(Boolean).join("\n");

    // Collect auditor comments + reviewer notes from all tickets
    var allComments=agentTickets.map(function(t){
      var parts=[];
      if(t.comments&&t.comments.trim()){parts.push("Ticket #"+t.ticketId+" ("+t.finalScore+"% "+( t.passed?"Pass":"Fail")+") AI comments: "+t.comments.trim());}
      if(t.reviewerNotes&&t.reviewerNotes.trim()){parts.push("Ticket #"+t.ticketId+" reviewer notes: "+t.reviewerNotes.trim());}
      return parts.join(" | ");

  async function generateAgentReport(agentName) {
    var fromVal=rptFrom.trim(),toVal=rptTo.trim();
    addToast("Generating report for "+agentName+"...");
    try {
      var html=await buildAgentReportHTML(agentName,fromVal,toVal,function(msg){setSyncStatus(msg);});
      if(!html){addToast("No tickets found for "+agentName+" in that date range","error");return;}
      var safeName=agentName.replace(/[^a-zA-Z0-9]/g,"_");
      var filename="QA_"+safeName+".doc";
      downloadBlob(html,filename,"application/msword");
      addToast("Downloaded: "+filename);
    } catch(e){addToast("Report failed: "+e.message,"error");}
    setSyncStatus("");
  }

  function exportAllCSV() {
    var rows=[["Week","Agent","Reviewer","Ticket ID","Contact Reason",
      "AI Score","AI Pass/Fail","Disputed Score","Disputed Pass/Fail",
      "Has Disputes","Autofail","Comments"]
      .concat(matrix.map(function(c){return c.label+" (AI)";}))
      .concat(matrix.map(function(c){return c.label+" (Final)";}))
    ];
    tickets.forEach(function(t){
      var dispSc=calcDisputedScore(t,matrix);
      var dispPassed=dispSc?(!t.autofail&&dispSc.pct>=85):false;
      var finalScores=matrix.map(function(c){
        var d=t.disputes&&t.disputes[c.id];
        return (d&&d.status==="approved")?d.finalScore:((t.aiScores&&t.aiScores[c.id])||"");
      });
      rows.push([t.week,t.agentName,t.reviewer,t.ticketId,t.contactReason,
        (t.aiScore||t.finalScore)+"%",t.passed?"PASS":"FAIL",
        dispSc?dispSc.pct+"%":"N/A",dispPassed?"PASS":"FAIL",
        t.hasDisputes?"YES":"NO",t.autofail?"YES":"NO",
        '"'+(t.comments||"").replace(/"/g,'""')+'"']
        .concat(matrix.map(function(c){return(t.aiScores&&t.aiScores[c.id])||"";}))
        .concat(finalScores)
      );
    });
    downloadBlob(rows.map(function(r){return r.join(",");}).join("\n"),"qa_export_"+Date.now()+".csv","text/csv;charset=utf-8;");
  }

  // ══════════════════════════════════════════════════════════════════════════
  // ONE-TIME CTF CORRECTION (remediates the v2.0.93 "not tagged" bug)
  // Re-scores CTF Accuracy ONLY, leaving all other categories untouched.
  // Deliberately conservative: only ever RAISES a score, never lowers one, and
  // skips any ticket where a human already made a call on a CTF dispute.
  // ══════════════════════════════════════════════════════════════════════════

  function buildCtfOnlyPrompt(ticket, tags) {
    var ctfCat = matrix.find(function(c){return c.id==="ctf";});
    if(!ctfCat) return null;
    var levels = ctfCat.levels.map(function(l){return l.level+(l.points!==null?" ("+l.points+")":"");}).join("|");
    var defs = ctfCat.levels.map(function(l){return l.level+"="+l.definition;}).join(" | ");
    function pair(a,b){ return (a&&b&&b!=="N/A") ? a+"::"+b : (a||"not tagged"); }
    var cleanTranscript = (ticket.transcript||"").slice(0,8000)
      .replace(/â€™/g,"'").replace(/â€˜/g,"'").replace(/â€œ/g,'"').replace(/â€/g,'"');
    return "You are a QA evaluator for Freedom Grooming customer support. Respond in English only.\n\n"
      +"Evaluate ONE category only: "+ctfCat.label+".\n\n"
      +"WHAT IT MEASURES: "+(ctfCat.whatItMeasures||"")+"\n\n"
      +"SCORE LEVELS ["+levels+"]: "+defs+"\n\n"
      +(scoringContext&&scoringContext.trim()?"WORKFLOW & CONTEXT NOTES:\n"+scoringContext.trim()+"\n\n":"")
      +"TICKET ID: "+ticket.ticketId+"\n"
      +"AGENT: "+ticket.agentName+"\n\n"
      +"TICKET FIELD VALUES (as currently tagged in Gorgias — evaluate these against the transcript):\n"
      +"  Contact Reason: "+pair(tags.contactReasonL1,tags.contactReasonL2)+"\n"
      +"  Product: "+pair(tags.productL1,tags.productL2)+"\n"
      +"  Ticket Resolution: "+pair(tags.resolutionL1,tags.resolutionL2)+"\n"
      +"  Additional Resolution: "+pair(tags.addResolutionL1,tags.addResolutionL2)+"\n\n"
      +"TRANSCRIPT:\n"+cleanTranscript+"\n\n"
      +'Respond ONLY with JSON, no markdown: {"score":"'+levels+'","reason":"1-2 sentences","improve":"1 sentence or null"}';
  }

  // Pass 1 — read-only. Scores every eligible ticket and buckets the outcome.
  // Writes NOTHING to the database; the result feeds a preview the user approves first.
  async function runCtfFixPreview() {
    if(!isFullAccess) return;
    if(!ctfFixWeek) { addToast("Pick a week first","error"); return; }
    var ctfCat = matrix.find(function(c){return c.id==="ctf";});
    if(!ctfCat) { addToast("No 'ctf' category found in the current rubric","error"); return; }

    var inWeek = tickets.filter(function(t){ return t.week===ctfFixWeek && t.rowId && !t.deleted; });
    if(!inWeek.length) { addToast("No saved tickets found for "+ctfFixWeek,"error"); return; }

    setCtfFixRunning(true); ctfFixStopRef.current=false;
    var out = {raise:[],lower:[],same:[],skipped:[],errors:[]};

    for(var i=0;i<inWeek.length;i++){
      if(ctfFixStopRef.current){ setCtfFixStatus("Stopped at "+i+" of "+inWeek.length); break; }
      var t = inWeek[i];
      setCtfFixStatus("Scanning "+(i+1)+" of "+inWeek.length+" — #"+t.ticketId);

      // Skip where a human already decided a CTF dispute (approved or rejected).
      var d = t.disputes && t.disputes.ctf;
      if(d && (d.status==="approved" || !d.status)) { out.skipped.push({t:t,why:"CTF dispute already approved"}); continue; }
      if(d && d.status==="rejected") { out.skipped.push({t:t,why:"CTF dispute already rejected"}); continue; }
      if(!t.transcript || t.transcript.trim().length<20) { out.skipped.push({t:t,why:"No transcript stored"}); continue; }

      try {
        // Audits scored before v3.0.0 have no stored tag values, so pull them fresh from Gorgias.
        var gt = await gorgiasAPI("/tickets/"+t.ticketId);
        if(!gt || gt.error) { out.errors.push({t:t,why:"Gorgias fetch failed"}); continue; }
        var cr=parseTicketField(gt,FIELD_CR), pr=parseTicketField(gt,FIELD_PROD),
            rs=parseTicketField(gt,FIELD_RES), ad=parseTicketField(gt,FIELD_ADDRES);
        var tags = { contactReasonL1:cr[0],contactReasonL2:cr[1], productL1:pr[0],productL2:pr[1],
                     resolutionL1:rs[0],resolutionL2:rs[1], addResolutionL1:ad[0],addResolutionL2:ad[1] };

        var raw = await callClaudeWithRetry(buildCtfOnlyPrompt(t,tags));
        var clean = raw.replace(/```(?:json)?\s*/g,"").replace(/```/g,"").trim();
        var jm = clean.match(/\{[\s\S]+\}/);
        if(!jm) { out.errors.push({t:t,why:"No JSON in response"}); continue; }
        var parsed = JSON.parse(jm[0]);
        var newLevel = parsed.score||"";
        var oldLevel = (t.aiScores&&t.aiScores.ctf)||"";
        var newPts = parseScoreVal(newLevel), oldPts = parseScoreVal(oldLevel);
        if(newPts===null) { out.errors.push({t:t,why:"Unparseable score: "+newLevel}); continue; }

        var rec = {t:t, oldLevel:oldLevel, newLevel:newLevel, oldPts:oldPts, newPts:newPts,
                   reason:parsed.reason||"", improve:parsed.improve||"", tags:tags, dispute:d||null};

        if(oldPts===null || newPts>oldPts) out.raise.push(rec);
        else if(newPts<oldPts) out.lower.push(rec);   // never applied — surfaced for manual review
        else out.same.push(rec);
      } catch(e){ out.errors.push({t:t,why:e.message}); }
      await new Promise(function(r){setTimeout(r,600);}); // be kind to Gorgias + Anthropic
    }

    setCtfFixPreview(out);
    setCtfFixStatus("");
    setCtfFixRunning(false);
    addToast("Scan complete — "+out.raise.length+" to raise, "+out.lower.length+" lower (skipped), "+out.same.length+" unchanged");
  }

  // Pass 2 — writes only the "raise" bucket. Ignores the Wednesday lock deliberately:
  // this is a Full-access repair of a system bug, and every change is logged to
  // Reaudit History marked as a system correction.
  async function applyCtfFix() {
    if(!isFullAccess || !ctfFixPreview) return;
    var toApply = ctfFixPreview.raise;
    if(!toApply.length) { addToast("Nothing to apply"); return; }
    if(!window.confirm("Apply "+toApply.length+" CTF correction"+(toApply.length!==1?"s":"")+"?\n\nThis overwrites the CTF score and recalculates the final score on each. It bypasses the Wednesday lock and cannot be undone in bulk.")) return;

    setCtfFixApplying(true); ctfFixStopRef.current=false;
    var done=0, failed=0, approved=0;
    var nowIso = new Date().toISOString();

    for(var i=0;i<toApply.length;i++){
      if(ctfFixStopRef.current){ setCtfFixStatus("Stopped after "+done); break; }
      var r = toApply[i], t = r.t;
      setCtfFixStatus("Applying "+(i+1)+" of "+toApply.length+" — #"+t.ticketId);
      try {
        var newScores = Object.assign({}, t.aiScores||{}, {ctf:r.newLevel});
        var sc = calcScore(newScores, matrix);
        var newPct = sc?sc.pct:0;
        var newPassed = !t.autofail && newPct>=85;

        // A pending CTF dispute the re-run now supports gets auto-approved.
        // If the re-run does NOT support it, it's left pending for a human — this tool
        // never auto-rejects, matching the "only raise" principle.
        var newDisputes = Object.assign({}, t.disputes||{});
        var pd = newDisputes.ctf;
        if(pd && pd.status==="pending"){
          var wanted = parseScoreVal(pd.finalScore);
          if(wanted!==null && r.newPts>=wanted){
            newDisputes.ctf = Object.assign({}, pd, {
              status:"approved", decidedBy:currentUser.name+" (CTF correction)", decidedAt:nowIso, rejectedReason:""
            });
            approved++;
          }
        }
        var disputedRes = calcDisputedScore(Object.assign({},t,{aiScores:newScores,disputes:newDisputes}), matrix);
        var disputedPct = disputedRes?disputedRes.pct:newPct;
        var disputedPassed = !t.autofail && disputedPct>=85;

        var prevHist = t.reauditHistory;
        if(typeof prevHist === "string"){ try { prevHist = JSON.parse(prevHist||"[]"); } catch(e2){ prevHist = []; } }
        if(!Array.isArray(prevHist)) prevHist = [];
        var hist = prevHist.concat([{
          version:prevHist.length+1,
          type:"system-ctf-correction",
          note:"CTF re-scored after v2.0.93 tag-visibility fix",
          ctfBefore:r.oldLevel, ctfAfter:r.newLevel,
          scoreBefore:t.finalScore, scoreAfter:disputedPct,
          by:currentUser.name, at:nowIso
        }]);

        var justif = Object.assign({}, t.justifications||{}, {ctf:{reason:r.reason,improve:r.improve}});

        await dbPatchTicketRetry(t.rowId, {
          scores:         newScores,
          disputes:       newDisputes,
          aiScore:        newPct,
          finalScore:     disputedPct,
          aiPassed:       !!newPassed,
          finalPassed:    !!disputedPassed,
          justifications: justif,
          reauditHistory: hist
        }, 3);

        var updated = Object.assign({}, t, {
          aiScores:newScores, disputes:newDisputes, justifications:justif,
          aiScore:newPct, finalScore:disputedPct, passed:newPassed,
          disputedPassed:disputedPassed, reauditHistory:hist
        });
        setTickets(function(ts){return ts.map(function(x){return x.rowId===t.rowId?updated:x;});});
        done++;
      } catch(e){ failed++; console.error("[CTF fix] #"+t.ticketId+" failed:",e.message); }
      await new Promise(function(r2){setTimeout(r2,350);});
    }

    setCtfFixApplying(false); setCtfFixStatus("");
    setCtfFixPreview(null);
    addToast("CTF correction complete — "+done+" updated"+(approved?", "+approved+" dispute"+(approved!==1?"s":"")+" approved":"")+(failed?", "+failed+" failed":""));
  }

  // ══════════════════════════════════════════════════════════════════════════
  // RE-SCORE WITH CURRENT MATRIX (v3.3.0)
  // Re-runs the FULL AI Audit prompt (buildEvalPrompt, same as AI Audit) on already-saved audits using the
  // matrix currently saved in the database. Built for audits scored while v2 was silently falling back to the
  // built-in default matrix. Two passes like the CTF correction: Preview (AI calls, writes nothing) -> Apply.
  // Human work is preserved:
  //   - approved / rejected / pending disputes are kept exactly; the final score is recomputed on top of them
  //   - a manually-set autofail (autofailManual) stays an autofail
  //   - justifications an auditor edited (edited:true) and comments an auditor edited are kept
  //   - CTF tags: the values stored at scoring time (ctf_as_scored) if present, otherwise the current Gorgias tags
  // Every change is logged to Reaudit History (type "system-matrix-rescore"). Bypasses the Wednesday lock.
  // ══════════════════════════════════════════════════════════════════════════
  function rsThisWeekRange(){
    var d = new Date(Date.now()+8*3600000);           // Manila date
    var dow = (d.getUTCDay()+6)%7;                    // Monday = 0
    var mon = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()-dow));
    var iso = function(x){ return x.toISOString().slice(0,10); };
    return {from: iso(mon), to: iso(d)};
  }
  function rsEligible(){
    var cur = matrixVersion;
    return (tickets||[]).filter(function(t){
      if(!t.rowId || t.deleted) return false;
      if(rsMode==="week"){ if(!rsWeek || t.week!==rsWeek) return false; }
      else {
        var sd = String(t.savedAt||"").slice(0,10);
        if(!sd || (rsFrom && sd<rsFrom) || (rsTo && sd>rsTo)) return false;
      }
      if(rsOnlyStale && cur!=null && t.matrixVersion===cur) return false;
      return true;
    });
  }
  async function runRescorePreview(){
    if(!isFullAccess) return;
    if(matrixVersion==null){ addToast("Save the matrix first — there is no saved version to re-score with","error"); return; }
    var dirtyNow = matrixSnapshot!==null && JSON.stringify({m:matrix,a:autofailList,c:scoringContext})!==matrixSnapshot;
    if(dirtyNow){ addToast("The Matrix page has unsaved changes. Save or discard them first so the re-score uses the saved v"+matrixVersion+".","error"); return; }
    var list = rsEligible();
    if(!list.length){ addToast("No audits match that scope","error"); return; }
    if(!window.confirm("Preview a re-score of "+list.length+" audit"+(list.length!==1?"s":"")+" with matrix v"+matrixVersion+"?\n\nThis makes "+list.length+" AI call"+(list.length!==1?"s":"")+" (about "+Math.ceil(list.length*6/60)+" min). Nothing is saved until you apply.")) return;
    setRsRunning(true); rsStopRef.current=false; setRsPreview(null); setRsSelected({});
    var out = {items:[], skipped:[], errors:[], version:matrixVersion};
    for(var i=0;i<list.length;i++){
      if(rsStopRef.current){ setRsStatus("Stopped at "+i+" of "+list.length); break; }
      var t = list[i];
      setRsStatus("Re-scoring "+(i+1)+" of "+list.length+" — #"+t.ticketId);
      if(!t.transcript || t.transcript.trim().length<20){ out.skipped.push({t:t, why:"No transcript stored"}); continue; }
      try {
        var tags = t.ctfAsScored, tagSource = "as scored";
        if(!tags || !tags.contactReasonL1){
          var gt = await gorgiasAPI("/tickets/"+t.ticketId);
          if(gt && gt._status===429){ await new Promise(function(r){setTimeout(r,20000);}); i--; continue; }
          if(!gt || gt.error || !gt.id){ out.errors.push({t:t, why:"Gorgias fetch failed (needed for CTF tags)"}); continue; }
          var cr=parseTicketField(gt,FIELD_CR), pr=parseTicketField(gt,FIELD_PROD), rs=parseTicketField(gt,FIELD_RES), ad=parseTicketField(gt,FIELD_ADDRES);
          tags = {contactReasonL1:cr[0],contactReasonL2:cr[1],productL1:pr[0],productL2:pr[1],resolutionL1:rs[0],resolutionL2:rs[1],addResolutionL1:ad[0],addResolutionL2:ad[1]};
          tagSource = "current Gorgias";
        }
        var ticketObj = Object.assign({}, t, tags, {
          contactReason: (tags.contactReasonL1&&tags.contactReasonL2&&tags.contactReasonL2!=="N/A") ? tags.contactReasonL1+"::"+tags.contactReasonL2 : (tags.contactReasonL1||t.contactReason)
        });
        var rawTxt = await callClaudeWithRetry(buildEvalPrompt(ticketObj));
        var cleanTxt = rawTxt.replace(/```(?:json)?\s*/g,"").replace(/```/g,"").trim();
        var jm = cleanTxt.match(/\{[\s\S]+\}/);
        if(!jm){ out.errors.push({t:t, why:"No JSON in AI response"}); continue; }
        var parsed = JSON.parse(jm[0]);
        var newScores = parsed.scores||{};
        var sc = calcScore(newScores, matrix);
        var newPct = sc?sc.pct:0;
        var aiAutofails = parsed.autofails||[];
        var autofail = t.autofailManual ? true : aiAutofails.length>0;
        var disputedRes = calcDisputedScore(Object.assign({}, t, {aiScores:newScores}), matrix);
        var newFinal = disputedRes ? disputedRes.pct : newPct;
        var oldFinal = t.finalScore||0;
        var oldPassed = t.autofail ? false : (t.disputedPassed!==undefined ? t.disputedPassed : oldFinal>=85);
        var newPassed = !autofail && newFinal>=85;
        var changed = matrix.map(function(c){
          var norm = function(v){ v=String(v||"").trim().toUpperCase(); return v===""?"NA":v; };  // blank == NA (not a change)
          var b=(t.aiScores||{})[c.id]||"", a=newScores[c.id]||"";
          return norm(b)!==norm(a) ? {id:c.id,label:c.label,before:b||"NA",after:a||"NA"} : null;
        }).filter(Boolean);
        var pendingDisputes = Object.keys(t.disputes||{}).filter(function(k){ return (t.disputes[k]||{}).status==="pending"; });
        out.items.push({t:t, parsed:parsed, newScores:newScores, sc:sc, newPct:newPct, newFinal:newFinal, oldFinal:oldFinal,
          oldAi:t.aiScore||0, oldPassed:oldPassed, newPassed:newPassed, autofail:autofail, changed:changed, tagSource:tagSource,
          pendingDisputes:pendingDisputes, reviewed:!!t.reviewed, tags:tags});
      } catch(e){ out.errors.push({t:t, why:e.message}); }
      await new Promise(function(r){setTimeout(r,1000);});
    }
    var sel = {};
    out.items.forEach(function(it){ if(it.changed.length || it.newFinal!==it.oldFinal) sel[it.t.rowId]=true; });  // default: everything that changed
    setRsSelected(sel); setRsPreview(out); setRsStatus(""); setRsRunning(false);
    var nChanged = out.items.filter(function(it){return it.changed.length||it.newFinal!==it.oldFinal;}).length;
    addToast("Re-score preview ready — "+nChanged+" of "+out.items.length+" audits change");
  }
  async function applyRescore(){
    if(!isFullAccess || !rsPreview) return;
    if(rsPreview.version!==matrixVersion){ addToast("The matrix changed since this preview (v"+rsPreview.version+" → v"+matrixVersion+"). Run the preview again.","error"); return; }
    var toApply = rsPreview.items.filter(function(it){ return rsSelected[it.t.rowId]; });
    if(!toApply.length){ addToast("Nothing selected"); return; }
    var down = toApply.filter(function(it){return it.newFinal<it.oldFinal;}).length;
    var flips = toApply.filter(function(it){return it.oldPassed && !it.newPassed;}).length;
    if(!window.confirm("Apply the re-score to "+toApply.length+" audit"+(toApply.length!==1?"s":"")+"?\n\n"
      +(down?down+" score"+(down!==1?"s":"")+" go down"+(flips?", "+flips+" of them from Pass to Fail":"")+".\n":"")
      +"Scores, justifications, comments and autofails are replaced with the v"+matrixVersion+" re-score (auditor-edited notes, manual autofails and all disputes are kept). "
      +"This bypasses the Wednesday lock and is logged to each audit's Reaudit History.")) return;
    setRsApplying(true); rsStopRef.current=false;
    var done=0, failed=0, reopened=0, nowIso=new Date().toISOString();
    for(var i=0;i<toApply.length;i++){
      if(rsStopRef.current){ setRsStatus("Stopped after "+done); break; }
      var it = toApply[i], t = it.t, p = it.parsed;
      setRsStatus("Applying "+(i+1)+" of "+toApply.length+" — #"+t.ticketId);
      try {
        var oldJ = t.justifications||{}, newJ = p.justifications||{}, justif = {};
        matrix.forEach(function(c){ justif[c.id] = (oldJ[c.id]&&oldJ[c.id].edited) ? oldJ[c.id] : (newJ[c.id]||oldJ[c.id]||{}); });
        var nh = {}; try { nh = JSON.parse(t.notesHistoryJSON||"{}"); } catch(e){}
        var keepComments = !!(nh && nh.comments && nh.comments.some(function(h){ return h && h.by && h.by!=="AI"; }));
        var prevHist = t.reauditHistory;
        if(typeof prevHist==="string"){ try { prevHist=JSON.parse(prevHist||"[]"); } catch(e2){ prevHist=[]; } }
        if(!Array.isArray(prevHist)) prevHist=[];
        var hist = prevHist.concat([{
          version: prevHist.length+1, type: "system-matrix-rescore",
          note: "Re-scored with saved matrix v"+matrixVersion+" (original audit scored with "+(t.matrixVersion?("v"+t.matrixVersion):"an unknown / fallback matrix")+")",
          matrixVersionBefore: t.matrixVersion||null, matrixVersionAfter: matrixVersion,
          scoreBefore: it.oldFinal, scoreAfter: it.newFinal, aiScoreBefore: it.oldAi, aiScoreAfter: it.newPct,
          scoresBefore: t.aiScores||{}, categoryChanges: it.changed, tagSource: it.tagSource,
          by: currentUser.name, at: nowIso
        }]);
        var patch = {
          scores: it.newScores, aiScore: it.newPct, finalScore: it.newFinal,
          aiPassed: !it.autofail && it.newPct>=85, finalPassed: it.newPassed,
          autofail: it.autofail, justifications: justif, reauditHistory: hist,
          totalPoints: it.sc?it.sc.pts:0, maxPoints: it.sc?it.sc.max:0, matrixVersion: matrixVersion,
          aiMeta: p.meta ? {product:p.meta.product||"", ticketResolution:p.meta.ticketResolution||""} : undefined
        };
        if(!t.autofailManual) patch.autofails = p.autofails||[];
        if(!keepComments && p.comments) patch.comments = p.comments;
        if(it.tagSource==="current Gorgias") patch.ctfAsScored = pickCtfTags(it.tags);   // record the tags this re-score used
        var reopen = rsReopen && it.reviewed && (it.newFinal!==it.oldFinal || it.newPassed!==it.oldPassed);
        var reopenHist = null;
        if(reopen){
          try { reopenHist = JSON.parse(t.reopenHistoryJSON||"[]"); } catch(e3){ reopenHist = []; }
          reopenHist.push({by:currentUser.name, at:nowIso, reason:"Re-scored with matrix v"+matrixVersion+" ("+it.oldFinal+"% → "+it.newFinal+"%)"});
          patch.reviewed = false; patch.reopenHistory = JSON.stringify(reopenHist);
        }
        Object.keys(patch).forEach(function(k){ if(patch[k]===undefined) delete patch[k]; });
        await dbPatchTicketRetry(t.rowId, patch, 3);
        var updated = Object.assign({}, t, {
          aiScores: it.newScores, scores: it.newScores, aiScore: it.newPct, finalScore: it.newFinal, passed: !it.autofail&&it.newPct>=85,
          disputedPassed: it.newPassed, autofail: it.autofail, autofails: patch.autofails||t.autofails, justifications: justif,
          comments: patch.comments||t.comments, reauditHistory: hist, matrixVersion: matrixVersion,
          reviewed: reopen ? false : t.reviewed, reopenHistoryJSON: reopen ? JSON.stringify(reopenHist) : t.reopenHistoryJSON
        });
        setTickets(function(ts){ return ts.map(function(x){ return x.rowId===t.rowId ? updated : x; }); });
        if(reopen){ reopened++; setReviewedTickets(function(r){ var n=Object.assign({},r); delete n[t.id||t.ticketId]; return n; }); }
        done++;
      } catch(e){ failed++; console.error("[Rescore] #"+t.ticketId+" failed:", e.message); }
      await new Promise(function(r2){setTimeout(r2,300);});
    }
    setRsApplying(false); setRsStatus(""); setRsPreview(null); setRsSelected({});
    addToast("Re-score applied — "+done+" updated"+(reopened?", "+reopened+" reopened for review":"")+(failed?", "+failed+" failed":""), failed?"warning":undefined);
  }

  // ── RECALCULATE FINAL PASSED ────────────────────────────────────────────────
  async function recalcFinalPassed() {
    var toFix = tickets.filter(function(t){
      var effective = t.autofail ? false
        : (t.disputedPassed!==undefined) ? t.disputedPassed
        : t.finalScore >= 85;
      return effective !== !!(t.finalPassed||t.passed) && t.rowId;
    });
    if(!toFix.length){ addToast("All Final Passed flags are correct — nothing to fix"); return; }
    addToast("Fixing "+toFix.length+" tickets...");
    var fixed=0;
    for(var i=0;i<toFix.length;i++){
      var t=toFix[i];
      var correct = t.autofail ? false : (t.disputedPassed!==undefined) ? t.disputedPassed : t.finalScore>=85;
      try {
        await dbPatchTicket(t.rowId,{finalPassed:correct});
        fixed++;
        setSyncStatus("Fixed "+(i+1)+" of "+toFix.length+"...");
      } catch(e){ console.error("Fix failed for",t.ticketId,e.message); }
    }
    // Update local state
    setTickets(function(ts){return ts.map(function(t){
      var correct = t.autofail?false:(t.disputedPassed!==undefined)?t.disputedPassed:t.finalScore>=85;
      return Object.assign({},t,{finalPassed:correct,passed:correct});
    });});
    addToast("Fixed "+fixed+" tickets");
    setSyncStatus("");
  }

  // Single source of truth for "who can be given QA work" — round-robin assignment on
  // both ingest paths AND Team Calibration participation. Three copies of this filter
  // is how the FIELD_CR duplication bug happened, so it lives in one place.
  // Excludes: non-auditor roles, deactivated users (previously only blocked at login,
  // so they still got tickets round-robined to them that nobody could open), and
  // anyone with "Assign Audits" unchecked in the QA Users DB.
  // Whose Gorgias tickets should never be audited — driven by the QA Users DB
  // "Exclude Their Tickets" checkbox. Matched on EMAIL, which is identical on both
  // sides, rather than display name, which is not (Jero vs Jero M., Naomi vs Naomi O.,
  // Drew vs Drew T).
  // NOTE: do NOT use `effectiveUsers` in here. The agents dropdown list is computed
  // earlier in the component body than `effectiveUsers` is assigned, and `var` hoists
  // the declaration without the value — so it reads as undefined and throws on .filter().
  // userList (useState) is safe at any point in the body, so resolve the pool through this.
  function userPool() {
    return userList || [];
  }

  function excludedAgentUsers() {

  // Agent-name dropdowns (Manual Audit, admin, filters). Replaces the hardcoded AGENT_LIST:
  // active view/agent users from the database plus every agent name already on an audit,
  // minus anyone flagged "Exclude Their Tickets".
  function agentList() {
    var ex = excludedAgentNames();
    var names = {};
    userPool().forEach(function(u){
      if((u.role==="view"||u.role==="agent") && u.active!==false && u.excludeTickets!==true && u.name) names[normalizeAgentName(u.name)] = true;
    });
    (tickets||[]).forEach(function(t){ if(t.agentName) names[normalizeAgentName(t.agentName)] = true; });
    return Object.keys(names).filter(function(n){ return n && ex.indexOf(n)===-1; }).sort(function(a,b){ return a.localeCompare(b); });
  }
  function excludedAgentEmails() {
    return excludedAgentUsers().map(function(u){ return (u.email||"").toLowerCase().trim(); }).filter(Boolean);

  function excludedAgentNames() {

  }

  // name check is a backstop for assignees with no email on the Gorgias record.
  function isExcludedAssignee(email, name) {
    var e = (email||"").toLowerCase().trim();
    if(e && excludedAgentEmails().indexOf(e) !== -1) return true;

  // ── GORGIAS FETCH ────────────────────────────────────────────────────────────
  async function gorgiasAPI(endpoint, params, method) {
    var resp = await fetch(window.location.origin+"/gorgias", {
      method: "POST",
      headers: {"Content-Type":"application/json","X-Session-Token":sessionStorage.getItem("qa_session")||""},
      body: JSON.stringify({endpoint: endpoint, params: params||{}, method: method||"GET"})
    });
    if(resp.status === 429) return {_status: 429};
    if(!resp.ok) throw new Error("Gorgias API error: "+resp.status);
    return resp.json();
  }

  function stripHTML(html) {
    if(!html) return "";
    html = html.replace(/<blockquote[^>]*>[\s\S]*?<\/blockquote>/gi,"");
    html = html.replace(/<br\s*\/?>/gi,"\n");
    html = html.replace(/<\/?(p|div|li|tr|h[1-6])[^>]*>/gi,"\n");
    html = html.replace(/<[^>]+>/g,"");
    html = html.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">")
               .replace(/&nbsp;/g," ").replace(/&#39;/g,"'").replace(/&quot;/g,'"');
    html = html.replace(/On\s+(Mon|Tue|Wed|Thu|Fri|Sat|Sun)[^\n]*\d{4}[^\n]*:/gi,"");
    html = html.replace(/^>+\s?/gm,"");
    return html.replace(/\s+/g," ").trim().slice(0,2000);
  }

  function buildTranscript(messages) {
    var sorted = messages.slice().sort(function(a,b){return (a.created_datetime||"").localeCompare(b.created_datetime||"");});
    var lines = [];
    sorted.forEach(function(m){
      var isAgent = m.from_agent || ((m.sender||{}).meta||{}).is_staff;
      var role = isAgent ? "Agent" : "Customer";
      var sender = (m.sender||{}).name || role;
      var bodyText = (m.body_text||"").trim();
      var bodyHtml = m.body_html || m.body || "";
      var body = (bodyText && !/<[a-zA-Z]/.test(bodyText)) ? bodyText : stripHTML(bodyHtml);
      body = body.split("\n").join(" ").split("\r").join(" ").split("\t").join(" ").replace(/  +/g," ").trim();
      var junkWords = ["billing address","shipping address","items ordered","subtotal:","all rights reserved","unsubscribe"];
      var isJunk = junkWords.filter(function(j){return body.toLowerCase().includes(j);}).length >= 2;
      if(isJunk) return;
      var time = (m.created_datetime||"").slice(0,16).replace("T"," ");
      lines.push("["+role+" - "+sender+" @ "+time+"]: "+body);
    });
    return lines.join(" | ");
  }

  // Counts PUBLIC replies (not internal notes) sent by the ASSIGNED agent specifically.
  // Matches on Gorgias user ID where available since that's stable; falls back to a
  // normalized-name compare (same NBSP/whitespace collapsing used everywhere else) only
  // when the API doesn't give us usable IDs on both sides.
  // Note: this counts the CURRENT assignee only. If a ticket was handled by one agent and
  // later reassigned, the earlier agent's replies do NOT count here — by design, since the
  // audit is of the assigned agent, but it means a reassigned ticket can legitimately read 0.
  function countAssignedAgentMessages(messages, agentId, agentName) {
    if(!messages || !messages.length) return 0;
    if(!agentId && !agentName) return 0;
    var normTarget = normalizeAgentName(agentName||"");
    return messages.filter(function(m){
      // Internal notes don't count — only replies that actually reached the customer.
      // Gorgias omits `public` on some message shapes; treat missing as public (true)
      // rather than dropping the message, so we under-filter instead of over-filtering.
      var isPublic = (m.public === undefined || m.public === null) ? true : !!m.public;
      if(!isPublic) return false;
      var fromAgent = m.from_agent || ((m.sender||{}).meta||{}).is_staff;
      if(!fromAgent) return false;
      var s = m.sender || {};
      if(agentId && s.id != null) return String(s.id) === String(agentId);
      var sName = normalizeAgentName(s.name || ((s.firstname||"")+" "+(s.lastname||"")).trim());
      return !!sName && !!normTarget && sName.toLowerCase() === normTarget.toLowerCase();
    }).length;
  }

  // Gorgias custom-field IDs — single source of truth. These were previously declared
  // inside the fetch loop only, which is how the re-audit path ended up unable to read tags.
  var FIELD_CR=9969, FIELD_PROD=5807, FIELD_RES=11375, FIELD_ADDRES=11421;

  function parseTicketField(ticket, fieldId) {
    var cf = ticket.custom_fields || {};
    var val = cf[String(fieldId)];
    if(!val) return ["",""];
    if(typeof val === "object") val = val.value || val.text || "";
    val = String(val).trim();
    if(!val) return ["",""];
    if(val.includes("::")) { var p=val.split("::",2); return [p[0].trim(), p[1].trim()]; }
    return [val, "N/A"];
  }

  async function fetchGorgiasTickets(opts) {
    setFetchLoading(true); setFetchError(""); setFetchedTickets([]); setFetchSummary(null);
    setBalanceReport(null);
    fetchCancelRef.current = false;
    var f = fetchForm;
    var balance = !!(opts && opts.balance);
    var balanceTarget = balance ? (parseInt(f.balanceTarget||"")||0) : 0;
    var agentDeficits = {};       // {agentLower: number still to pull}
    var balanceExisting = {};     // {agentLower: existing audits this week}
    var auditedThisWeek = new Set();
    var balanceWeekLabel = "";
    var balanceScopeNames = [];
    try {
      // Build date params
      var since = null, until = null;
      if(balance) {
        if(!balanceTarget || balanceTarget < 1) { setFetchError("Enter a target number of audits per agent."); setFetchLoading(false); return; }
        if(!f.balanceWeek) { setFetchError("Pick a week for Balance Audits."); setFetchLoading(false); return; }
        var bMonInst = new Date(f.balanceWeek+"T00:00:00+08:00").getTime();        // Manila Monday 00:00 as an instant
        since = new Date(bMonInst).toISOString().slice(0,19);                       // UTC equivalent (Gorgias datetimes are UTC)
        until = new Date(bMonInst + 7*86400000 - 1000).toISOString().slice(0,19);   // through Manila Sunday 23:59:59, in UTC
        balanceWeekLabel = mnlWeekLabel(mnlMondayInstant(bMonInst));
        balanceScopeNames = Object.entries(f.selectedAgents||{}).filter(function(e){return e[1];}).map(function(e){return e[0];});
        if(!balanceScopeNames.length) balanceScopeNames = [...new Set(tickets.map(function(t){return t.agentName;}).filter(Boolean))];
        balanceScopeNames.forEach(function(nm){ balanceExisting[nm.toLowerCase()] = 0; });
        tickets.forEach(function(t){
          if(t.week===balanceWeekLabel){
            if(t.ticketId) auditedThisWeek.add(String(t.ticketId));
            var k=(t.agentName||"").toLowerCase();
            if(k in balanceExisting) balanceExisting[k]++;
          }
        });
        balanceScopeNames.forEach(function(nm){
          var k=nm.toLowerCase();
          var deficit = Math.max(0, balanceTarget - (balanceExisting[k]||0));
          if(deficit>0) agentDeficits[k]=deficit;
        });
        console.log("[Balance] Week:", balanceWeekLabel, "| target:", balanceTarget, "| deficits:", agentDeficits, "| already audited this week:", auditedThisWeek.size);
        if(!Object.keys(agentDeficits).length) { setFetchError("All selected agents already have "+balanceTarget+"+ audits for "+balanceWeekLabel+"."); setFetchLoading(false); return; }
      } else if(f.dateMode==="range" && f.fromDate) {
        since = f.fromDate+"T00:00:00";
        until = f.toDate ? f.toDate+"T23:59:59" : null;
        console.log("[QA][filter] Date range:", since, "→", until||"no end");
      } else {
        var d = new Date(); d.setDate(d.getDate() - parseInt(f.lastDays||7));
        since = d.toISOString().slice(0,10)+"T00:00:00";
        console.log("[QA][filter] Last N days:", f.lastDays||7, "→ since", since);
      }

      // Active status filters
      var activeStatuses = Object.entries(f.status||{}).filter(function(e){return e[1];}).map(function(e){return e[0];});
      var filterByStatus = activeStatuses.length > 0 && activeStatuses.length < Object.keys(f.status||{}).length;
      console.log("[QA][filter] Status filter:", filterByStatus ? activeStatuses.join(", ") : "all statuses");

      var cursor = null;
      var maxTickets = parseInt(f.maxTickets||500) || 500;
      var totalDeficit = Object.values(agentDeficits).reduce(function(a,b){return a+b;},0);
      if(balance) maxTickets = totalDeficit || maxTickets;
      var skipHrs = parseInt(f.skipHours||"0") || 0;
      var cutoffSkip = skipHrs > 0 ? new Date(Date.now() - skipHrs*60*60*1000).toISOString().slice(0,19) : null;
      if(cutoffSkip) console.log("[QA][fetch] Skipping tickets closed within last "+skipHrs+"h, cutoff:", cutoffSkip);
      var reachedCutoff = false;

      var fc = {
        scanned:0, raw:0, skippedStatus:0, skippedRecentlyClosed:0,
        skippedChannel:0, skippedAgentFilter:0, skippedExcludedAgent:0,
        skippedCR:0, skippedRes:0, skippedMsgCount:0, skippedAgentMsgCount:0, skippedKeyword:0,
        skippedAgentCap:0, skippedDeleted:0, skippedMsgFetch:0, skippedAlreadyAudited:0, rateLimited:false, result:0
      };

      var channels = Object.entries(f.channels).filter(function(e){return e[1];}).map(function(e){return e[0];});
      var selectedAgentNames = Object.entries(f.selectedAgents||{}).filter(function(e){return e[1];}).map(function(e){return e[0].toLowerCase();});
      var channelFilterActive = channels.length > 0 && channels.length < Object.keys(f.channels||{}).length;
      var crL1All = Object.keys(f.crL1||{}); var crL1Sel = crL1All.filter(function(k){return f.crL1[k];}).map(function(s){return s.toLowerCase();}); var crL1Active = crL1Sel.length > 0 && crL1Sel.length < crL1All.length;
      var crL2All = Object.keys(f.crL2||{}); var crL2Sel = crL2All.filter(function(k){return f.crL2[k];}).map(function(s){return s.toLowerCase();}); var crL2Active = crL2Sel.length > 0 && crL2Sel.length < crL2All.length;
      // FIELD_CR / FIELD_PROD / FIELD_RES / FIELD_ADDRES are defined once near parseTicketField

      console.log("[QA][fetch] Date filter (client-side) \u2014 start:", since, "end:", until||"none");
      console.log("[QA][filter] Status:", filterByStatus ? activeStatuses.join(", ") : "all");

      var results = [];
      var perAgent = parseInt(f.ticketsPerAgent||"") || null;
      var agentCounts = {};
      if(perAgent) console.log("[QA][filter] Tickets per agent cap:", perAgent);

      setFetchStatus("Scanning for tickets in your date range...");

      // Per-ticket fetch debug: logs each ticket# and PASS or the filter it violated.
      // Disable with window.__FETCH_DEBUG = false in the console.
      var fdbg = function(id, v){ if(window.__FETCH_DEBUG !== false) console.log("[FetchDbg] #"+id+" "+v); };
      var pageRetry = 0;
      while(!reachedCutoff) {
        if(fetchCancelRef.current) { setFetchStatus("Cancelled \u2014 "+results.length+" matched."); break; }
        var params = { limit: 30 };
        if(cursor) params.cursor = cursor;
        var page = await gorgiasAPI("/tickets", params);
        // Gorgias rate limit on the page-listing call: back off and retry the SAME page
        // instead of treating the empty body as end-of-data and silently ending the run.
        if(page && page._status === 429) {
          fc.rateLimited = true;
          var pwait = [10000,20000,40000,60000,120000][Math.min(pageRetry,4)];
          dbg("fetch","page list 429 -- backing off "+(pwait/1000)+"s (retry "+(pageRetry+1)+")");
          setFetchStatus("Rate limited \u2014 pausing "+(pwait/1000)+"s... (scanned "+fc.scanned+", matched "+results.length+")");
          await new Promise(function(r){setTimeout(r,pwait);});
          pageRetry++;
          if(pageRetry > 6) { dbg("fetch","page list 429 -- giving up after 6 retries"); break; }
          continue;
        }
        pageRetry = 0;
        var data = page.data || [];
        if(!data.length) break;

        // Skip-fast: if all tickets on this page are newer than our window, no delay needed
        if(until) {
          var allTooNew = data.every(function(t){
            return (t.created_datetime||"").slice(0,19) > until;
          });
          if(allTooNew) {
            fc.scanned += data.length;
            setFetchStatus("Scanning — skipped "+fc.scanned+" recent tickets, reaching your date range...");
            var nc = (page.meta||{}).next_cursor||page.next_cursor;
            if(!nc) break;
            cursor = nc;
            continue; // no delay
          }
        }

        for(var ti=0; ti<data.length; ti++) {
          if(fetchCancelRef.current) break;
          var t = data[ti];
          var tid = t.id;
          var created = (t.created_datetime||"").slice(0,19);

          fc.scanned++;
          if(until && created && created > until) {
            setFetchStatus("Scanning \u2014 skipping "+fc.scanned+" recent tickets to reach your date range...");
            continue;
          }
          if(since && created && created < since) { fdbg(tid,"STOP: created "+created+" older than range start "+since+" (cutoff reached)"); reachedCutoff = true; break; }
          fc.raw++;

          if(filterByStatus) {
            var tStatus = (t.status||"").toLowerCase();
            if(!activeStatuses.includes(tStatus)) { fc.skippedStatus++; fdbg(tid,"SKIP status: '"+tStatus+"' not in ["+activeStatuses.join(",")+"]"); continue; }
          }

          if(cutoffSkip && t.closed_datetime) {
            var closedAt = (t.closed_datetime||"").slice(0,19);
            if(closedAt && closedAt > cutoffSkip) { fc.skippedRecentlyClosed++; fdbg(tid,"SKIP recently-closed: closed "+closedAt); continue; }
          }

          if(channelFilterActive) {
            if(!channels.includes((t.channel||t.via||t.initial_channel||"").toLowerCase())) { fc.skippedChannel++; fdbg(tid,"SKIP channel: '"+((t.channel||t.via||t.initial_channel||"").toLowerCase())+"' not in selected"); continue; }
          }

          if(f.agentFilter==="Has agent assigned" && !t.assignee_user) { fc.skippedAgentFilter++; fdbg(tid,"SKIP agent: no agent assigned"); continue; }
          if(f.agentFilter==="No agent assigned" && t.assignee_user)   { fc.skippedAgentFilter++; fdbg(tid,"SKIP agent: has agent (wanted unassigned)"); continue; }

          var agentName = "";
          var agentId = null;
          var agentEmail = "";
          if(t.assignee_user) {
            var au = t.assignee_user;
            agentName = normalizeAgentName(au.name || ((au.firstname||"")+" "+(au.lastname||"")).trim());
            agentId = au.id != null ? String(au.id) : null;
            agentEmail = (au.email||"").toLowerCase().trim();
          }

          if(isExcludedAssignee(agentEmail, agentName)) {
            fc.skippedExcludedAgent++; fdbg(tid,"SKIP excluded agent: '"+agentName+"' is QA team, not auditable"); continue;
          }

          if(selectedAgentNames.length && agentName && !selectedAgentNames.includes(agentName.toLowerCase())) {
            fc.skippedAgentFilter++; fdbg(tid,"SKIP agent: '"+agentName+"' not in selected agents"); continue;
          }

          if(balance) {
            var bak = (agentName||"").toLowerCase();
            if(!agentDeficits[bak]) { fc.skippedAgentFilter++; fdbg(tid,"SKIP balance: "+(agentName||"(no agent)")+" not in scope / already at target"); continue; }
            if(auditedThisWeek.has(String(tid))) { fc.skippedAlreadyAudited++; fdbg(tid,"SKIP balance: already audited this week"); continue; }
            if((agentCounts[agentName]||0) >= agentDeficits[bak]) { fc.skippedAgentCap++; fdbg(tid,"SKIP balance: "+agentName+" deficit met"); continue; }
          }

          var crParts     = parseTicketField(t, FIELD_CR);
          var prodParts   = parseTicketField(t, FIELD_PROD);
          var resParts    = parseTicketField(t, FIELD_RES);
          var addResParts = parseTicketField(t, FIELD_ADDRES);

          if(crL1Active && !crL1Sel.includes(crParts[0].toLowerCase())) { fc.skippedCR++; fdbg(tid,"SKIP contact-reason-L1: '"+crParts[0]+"' not in selected"); continue; }
          if(crL2Active && !crL2Sel.includes(crParts[1].toLowerCase())) { fc.skippedCR++; fdbg(tid,"SKIP contact-reason-L2: '"+crParts[1]+"' not in selected"); continue; }
          if(f.prodL1 && prodParts[0].toLowerCase() !== f.prodL1.toLowerCase()) { fc.skippedCR++; fdbg(tid,"SKIP product-L1: '"+prodParts[0]+"' != '"+f.prodL1+"'"); continue; }
          // v3.2.0: resolution filters are multi-selects (any selected value matches); "All"/none = no filter
          if(selIsActive(f.resL1) && selValuesLower(f.resL1).indexOf(resParts[0].toLowerCase().trim())===-1) { fc.skippedRes++; fdbg(tid,"SKIP resolution-L1: '"+resParts[0]+"' not in selected"); continue; }
          if(selIsActive(f.resL2) && selValuesLower(f.resL2).indexOf(resParts[1].toLowerCase().trim())===-1) { fc.skippedRes++; fdbg(tid,"SKIP resolution-L2: '"+resParts[1]+"' not in selected"); continue; }
          if(selIsActive(f.addResL1) && selValuesLower(f.addResL1).indexOf(addResParts[0].toLowerCase().trim())===-1) { fc.skippedRes++; fdbg(tid,"SKIP add-resolution-L1: '"+addResParts[0]+"' not in selected"); continue; }
          if(selIsActive(f.addResL2) && selValuesLower(f.addResL2).indexOf(addResParts[1].toLowerCase().trim())===-1) { fc.skippedRes++; fdbg(tid,"SKIP add-resolution-L2: '"+addResParts[1]+"' not in selected"); continue; }

          if(deletedTicketIds.has(String(tid))) { fc.skippedDeleted++; fdbg(tid,"SKIP previously-deleted"); continue; }

          if(!balance && perAgent && agentName && (agentCounts[agentName]||0) >= perAgent) { fc.skippedAgentCap++; fdbg(tid,"SKIP agent-cap: "+agentName+" already at "+perAgent); continue; }

          // All cheap filters passed — update live counter before expensive message fetch
          setFetchStatus("Searched "+fc.raw+" \u00b7 Matched "+results.length+(maxTickets?" / "+maxTickets:""));

          // Fetch messages
          var transcript = "";
          var msgCount = 0;
          var msgFetchOk = false;
          for(var attempt=0; attempt<5; attempt++) {
            try {
              var msgResp = await gorgiasAPI("/tickets/"+tid+"/messages", {limit:100});
              if(msgResp._status === 429) {
                fc.rateLimited = true;
                var wait = [10000,20000,40000,60000,120000][attempt];
                setFetchStatus("Rate limited \u2014 pausing "+(wait/1000)+"s... (searched "+fc.raw+" \u00b7 matched "+results.length+")");
                await new Promise(function(r){setTimeout(r,wait);});
                continue;
              }
              var messages = msgResp.data || [];
              msgCount = messages.length;
              transcript = buildTranscript(messages);
              msgFetchOk = true;
              break;
            } catch(e) {
              if(attempt===4) transcript = "Error: "+e.message;
              else { await new Promise(function(r){setTimeout(r,5000*(attempt+1));}); }
            }
          }
          // Persistent rate limit/error: don't mislabel as "too few messages" -- flag run
          // incomplete and skip this ticket so it can be re-fetched on a clean run.
          if(!msgFetchOk) { fc.rateLimited = true; fc.skippedMsgFetch++; fdbg(tid,"SKIP msg-fetch: rate-limited/failed (run incomplete)"); continue; }
          await new Promise(function(r){setTimeout(r,250);}); // pace to ease Gorgias rate limit

          var minMsg2 = parseInt(f.msgMin||"")||null;
          var maxMsg2 = parseInt(f.msgMax||"")||null;
          if(minMsg2 && msgCount < minMsg2) { fc.skippedMsgCount++; fdbg(tid,"SKIP msg-count: "+msgCount+" < min "+minMsg2); await new Promise(function(r){setTimeout(r,500);}); continue; }
          if(maxMsg2 && msgCount > maxMsg2) { fc.skippedMsgCount++; fdbg(tid,"SKIP msg-count: "+msgCount+" > max "+maxMsg2); await new Promise(function(r){setTimeout(r,500);}); continue; }

          // Assigned-agent message count: public replies from the assigned agent only.
          // Catches tickets that look busy on raw message count but have no actual agent
          // interaction (all bot + customer), which would otherwise score as all-NA.
          var agentMsgCount = countAssignedAgentMessages(messages, agentId, agentName);
          var minAgentMsg = parseInt(f.agentMsgMin||"")||null;
          if(minAgentMsg && agentMsgCount < minAgentMsg) { fc.skippedAgentMsgCount++; fdbg(tid,"SKIP agent-msg-count: "+agentMsgCount+" < min "+minAgentMsg+" (assigned: '"+(agentName||"none")+"')"); await new Promise(function(r){setTimeout(r,500);}); continue; }

          if(f.keyword && f.keyword.trim()) {
            var haystack = (transcript + " " + (t.subject||"")).toLowerCase();
            var kwWords = f.keyword.trim().toLowerCase().split(/[\s,]+/).filter(function(w){return w.length>0;});
            var allMatch = kwWords.every(function(w){return haystack.includes(w);});
            if(!allMatch) { fc.skippedKeyword++; fdbg(tid,"SKIP keyword: not all of ["+kwWords.join(",")+"] found"); await new Promise(function(r){setTimeout(r,500);}); continue; }
          }

          var customerEmail = (t.customer||{}).email || "";
          var createdFmt = (t.created_datetime||"").slice(0,16).replace("T"," ");

          results.push({
            ticket_id:                String(tid),
            ticket_url:               "https://"+((window.__ENV__&&window.__ENV__.GORGIAS_DOMAIN)||"freedomgrooming.gorgias.com")+"/app/ticket/"+tid,
            subject:                  t.subject || "(no subject)",
            status:                   t.status || "",
            initial_channel:          t.channel || t.via || "",
            created_date:             createdFmt,
            agent:                    agentName,
            customer_email:           customerEmail,
            contact_reason_l1:        crParts[0],
            contact_reason_l2:        crParts[1],
            product_l1:               prodParts[0],
            product_l2:               prodParts[1],
            ticket_resolution_l1:     resParts[0],
            ticket_resolution_l2:     resParts[1],
            additional_resolution_l1: addResParts[0],
            additional_resolution_l2: addResParts[1],
            message_count:            msgCount,
            agent_message_count:      agentMsgCount,
            transcript:               transcript,
          });
          fdbg(tid,"PASS  status="+(t.status||"")+" channel="+((t.channel||t.via||t.initial_channel||"").toLowerCase())+" crL1="+crParts[0]+" crL2="+crParts[1]+" agent="+agentName+" msgs="+msgCount);
          fc.result++;

          if((perAgent || balance) && agentName) {
            agentCounts[agentName] = (agentCounts[agentName]||0) + 1;
          }

          setFetchStatus("Searched "+fc.raw+" \u00b7 Matched "+results.length+(maxTickets?" / "+maxTickets:""));
          await new Promise(function(r){setTimeout(r,500);});

          if(maxTickets && results.length >= maxTickets) {
            console.log("[QA][fetch] Max results reached ("+maxTickets+") \u2014 stopping");
            reachedCutoff = true; break;
          }
        }

        var nextCursor = (page.meta||{}).next_cursor || page.next_cursor;
        if(!nextCursor || reachedCutoff) break;
        cursor = nextCursor;
        await new Promise(function(r){setTimeout(r,100);});
      }

      fc.result = results.length;
      setFetchSummary(Object.assign({},fc));
      console.log("[QA][summary]", fc);
      setFetchedTickets(results);
      if(balance){
        var pulledByAgent={}; Object.keys(agentCounts).forEach(function(a){ pulledByAgent[a.toLowerCase()]=agentCounts[a]; });
        var brows = balanceScopeNames.map(function(nm){
          var k=nm.toLowerCase(); var had=balanceExisting[k]||0; var pulled=pulledByAgent[k]||0; var tot=had+pulled;
          return { agent:nm, had:had, pulled:pulled, total:tot, short:Math.max(0,balanceTarget-tot) };
        }).sort(function(a,b){ return b.short-a.short || b.pulled-a.pulled; });
        setBalanceReport({ week:balanceWeekLabel, target:balanceTarget, rows:brows, rateLimited:fc.rateLimited });
        console.log("[Balance] Result for "+balanceWeekLabel+":", brows);
        var anyShort = brows.some(function(r){return r.short>0;});
        setFetchStatus("Balance complete for "+balanceWeekLabel+" — pulled "+results.length+" ticket(s)."+(fc.rateLimited?" Rate-limited, may be incomplete.":(anyShort?" Some agents short of target (see breakdown).":" All selected agents now at "+balanceTarget+".")));
        if(fc.rateLimited) addToast("Gorgias rate-limited the balance run — results may be incomplete","error");
      } else if(fc.rateLimited){
        setFetchStatus("Done — "+results.length+" fetched, but Gorgias rate-limited this run so it may be INCOMPLETE. Narrow the date range or run again in a minute.");
        addToast("Gorgias rate-limited the fetch — results may be incomplete","error");
      } else {
        setFetchStatus("Done — "+results.length+" ticket"+(results.length!==1?"s":"")+" fetched.");
      }
    } catch(e) {
      setFetchError("Error: "+e.message);
      setFetchStatus("");
    }
    setFetchLoading(false);
  }

  function downloadFetchedCSV() {
    if(!fetchedTickets.length) return;
    var keys = Object.keys(fetchedTickets[0]).filter(function(k){ return k.charAt(0)!=="_"; }); // skip internal "_" fields
    var rows = [keys.join(",")].concat(fetchedTickets.map(function(r){
      return keys.map(function(k){
        var v = String(r[k]||"").replace(/"/g,'""');
        return '"'+v+'"';
      }).join(",");
    }));
    var blob = new Blob([rows.join("\n")], {type:"text/csv;charset=utf-8;"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href=url; a.download="gorgias_export_"+new Date().toISOString().slice(0,10)+".csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
    addToast("CSV downloaded");
  }

  // The fetch output row uses the SAME snake_case keys as the CSV export (it IS what gets
  // exported), so we delegate to mapRow rather than maintaining a second parallel mapping.
  // This previously hand-mapped only 8 fields and silently dropped product_l1/l2,
  // ticket_resolution_l1/l2 and additional_resolution_l1/l2 -- buildEvalPrompt then read
  // undefined and printed "not tagged" for Product and Ticket Resolution on EVERY fetched
  // ticket, so CTF Accuracy could never score above PARTIAL on the Fetch -> Batch QA path.
  // Contact Reason was mapped, which is why that one field always read correctly.
  // Delegating keeps the two ingest paths permanently in sync.
  // ══════════════════════════════════════════════════════════════════════════
  // FETCH V2 — warehouse-selected fetch.
  // The Gorgias analytics warehouse (BigQuery, via the Gorgias MCP server) can
  // work out WHICH tickets to audit in one query, including the tiered fallback
  // that Fetch v1 forces you to discover by re-running at 4, then 3, then 2.
  // Wingman can't reach that warehouse itself (it authenticates to
  // api.gorgias.com with basic auth; the warehouse is behind MCP OAuth), so this
  // is a handoff: generate the SQL -> run it in Claude -> paste the ticket IDs
  // back here -> Wingman fetches exactly those from the live REST API.
  // ~160 calls instead of ~10,000. Fetch v1 is untouched as the fallback.
  // ══════════════════════════════════════════════════════════════════════════

  function buildV2SQL() {
    if(!v2Week) return "";
    var mon = mnlMondayInstant(new Date(v2Week+"T00:00:00+08:00").getTime());
    if(mon==null) return "";
    var start = new Date(mon + MNL_MS), end = new Date(mon + 6*86400000 + MNL_MS);
    function d(x){ return x.getUTCFullYear()+"-"+String(x.getUTCMonth()+1).padStart(2,"0")+"-"+String(x.getUTCDate()).padStart(2,"0"); }
    var target = parseInt(v2Target||"6")||6;
    var floor = parseInt(v2FloorAgentMsg||"2")||2;
    var exclEmails = excludedAgentEmails().map(function(e){return "'"+e.replace(/'/g,"\\'")+"'";}).join(", ");
    if(!exclEmails) exclEmails = "''"; // no-op IN() list
    var v2Active = v2ActiveFilters(v2Filters);
    var ctfSql = v2CtfSql(v2Active, d(start), d(end));
    var filterNote = v2Active.length
      ? "-- Priority filters (closest matches first, then top-up from near misses):\n"
        + v2Active.map(function(a){ return "--   "+a.label+" = "+selChosen(v2Filters[a.key]).join(" | "); }).join("\n")+"\n"
      : "";
    return "-- Wingman Fetch v2 — "+mnlWeekLabel(mon)+"\n"
      +"-- Top "+target+" tickets per agent, ranked by "+(v2Active.length?"filter mismatch, then ":"")+"assigned-agent public replies (floor "+floor+").\n"
      +filterNote
      +"WITH per_ticket AS (\n"
      +"  SELECT\n"
      +"    t.ticket_id,\n"
      +"    t.assignee_user_id,\n"
      +"    COUNTIF(\n"
      +"      m.from_agent = TRUE\n"
      +"      AND m.sender_id = t.assignee_user_id\n"
      +"      AND JSON_VALUE(m.source, '$.type') != 'internal-note'\n"
      +"      AND COALESCE(m.is_ai_agent_message, FALSE) = FALSE\n"
      +"    ) AS agent_msgs\n"
      +"  FROM gaia.tickets AS t\n"
      +"  CROSS JOIN UNNEST(t.ticket_messages) AS m\n"
      +"  WHERE t.ticket_created_date BETWEEN '"+d(start)+"' AND '"+d(end)+"'\n"
      +"    AND COALESCE(t.is_spam, FALSE) = FALSE\n"
      +"    AND t.assignee_user_id IS NOT NULL\n"
      +"  GROUP BY 1, 2\n"
      +"),\n"
      +ctfSql.ctes
      +"ranked AS (\n"
      +"  SELECT p.*, u.name AS agent_name,\n"
      +"    ROW_NUMBER() OVER (PARTITION BY p.assignee_user_id ORDER BY "+(v2Active.length?"p.mismatch ASC, ":"")+"p.agent_msgs DESC, p.ticket_id DESC) AS rn\n"
      +"  FROM "+ctfSql.source+" AS p\n"
      +"  LEFT JOIN gaia.users AS u ON u.gorgias_user_id = p.assignee_user_id\n"
      +"  WHERE p.agent_msgs >= "+floor+"\n"
      +"    AND LOWER(COALESCE(u.email, '')) NOT IN ("+exclEmails+")\n"
      +"    AND COALESCE(u.name, '') != 'Jamie'\n"
      +")\n"
      +"SELECT STRING_AGG(CAST(ticket_id AS STRING), ',' ORDER BY agent_name) AS ticket_ids\n"
      +"FROM ranked WHERE rn <= "+target+";\n"
      +"-- Swap the final SELECT for this to eyeball it first:\n"
      +"-- SELECT agent_name, ticket_id, agent_msgs"+(v2Active.length?", mismatch":"")+" FROM ranked WHERE rn <= "+target+" ORDER BY agent_name, "+(v2Active.length?"mismatch, ":"")+"agent_msgs DESC;";
  }

  function parseV2Ids(raw) {
    if(!raw) return [];
    // Tolerant: accepts commas, newlines, spaces, tabs, quotes, leading '#',
    // and pasted CSV rows (grabs the longest digit run per line as the ID).
    var out = [], seen = {};
    raw.split(/[\s,;]+/).forEach(function(tok){
      var m = String(tok).replace(/["'#]/g,"").match(/\d{4,}/);
      if(m && !seen[m[0]]) { seen[m[0]] = 1; out.push(m[0]); }
    });
    return out;
  }

  async function runFetchV2() {
    if(!isEditor) return;
    var ids = parseV2Ids(v2IdInput);
    if(!ids.length) { addToast("No ticket IDs found in that input","error"); return; }
    if(ids.length > 600 && !window.confirm(ids.length+" ticket IDs — that's a large run. Continue?")) return;

    setV2Running(true); v2StopRef.current = false; setV2Summary(null);
    var v2Active = v2ActiveFilters(v2Filters);   // priority filters, re-checked on LIVE tags below
    var fc = { requested: ids.length, fetched:0, skippedDeleted:0, skippedAudited:0,
               skippedExcludedAgent:0, skippedNoTranscript:0, errors:0, rateLimited:false };
    var results = [];
    var auditedSet = v2SkipAudited
      ? new Set(tickets.filter(function(t){return !t.deleted;}).map(function(t){return String(t.ticketId);}))
      : new Set();

    for(var i=0; i<ids.length; i++){
      if(v2StopRef.current){ setV2Status("Stopped at "+i+" of "+ids.length); break; }
      var tid = ids[i];
      setV2Status("Fetching "+(i+1)+" of "+ids.length+" — #"+tid+" ("+results.length+" ready)");

      if(deletedTicketIds.has(String(tid))) { fc.skippedDeleted++; continue; }
      if(auditedSet.has(String(tid))) { fc.skippedAudited++; continue; }

      try {
        // 1. Ticket (tags, assignee, subject, status)
        var t = await gorgiasAPI("/tickets/"+tid);
        if(t && t._status === 429){
          fc.rateLimited = true;
          setV2Status("Rate limited — pausing 20s... ("+results.length+" ready)");
          await new Promise(function(r){setTimeout(r,20000);});
          i--; continue; // retry same ticket
        }
        if(!t || t.error || !t.id) { fc.errors++; continue; }

        var agentName = "", agentId = null, agentEmail = "";
        if(t.assignee_user){
          var au = t.assignee_user;
          agentName = normalizeAgentName(au.name || ((au.firstname||"")+" "+(au.lastname||"")).trim());
          agentId = au.id != null ? String(au.id) : null;
          agentEmail = (au.email||"").toLowerCase().trim();
        }
        if(isExcludedAssignee(agentEmail, agentName)) { fc.skippedExcludedAgent++; continue; }

        // 2. Messages (transcript + agent message count)
        var msgs = [], gotMsgs = false;
        for(var a=0; a<4; a++){
          var mr = await gorgiasAPI("/tickets/"+tid+"/messages", {limit:100});
          if(mr && mr._status === 429){
            fc.rateLimited = true;
            var w = [10000,20000,40000,60000][a];
            setV2Status("Rate limited — pausing "+(w/1000)+"s... ("+results.length+" ready)");
            await new Promise(function(r){setTimeout(r,w);});
            continue;
          }
          msgs = (mr && mr.data) || []; gotMsgs = true; break;
        }
        if(!gotMsgs) { fc.errors++; fc.rateLimited = true; continue; }

        var transcript = buildTranscript(msgs);
        if(!transcript || transcript.trim().length < 20) { fc.skippedNoTranscript++; continue; }

        var crP = parseTicketField(t, FIELD_CR), prP = parseTicketField(t, FIELD_PROD),
            rsP = parseTicketField(t, FIELD_RES), adP = parseTicketField(t, FIELD_ADDRES);
        var createdFmt = (t.created_datetime||"").slice(0,10);
        var missed = v2Active.length ? v2TicketMismatch(v2Active, {cr:crP, res:rsP, addres:adP}) : [];

        results.push({
          _v2Missed:                missed,   // priority-filter misses (for the run summary only; not saved)
          ticket_id:                String(tid),
          ticket_url:               "https://"+((window.__ENV__&&window.__ENV__.GORGIAS_DOMAIN)||"freedomgrooming.gorgias.com")+"/app/ticket/"+tid,
          subject:                  t.subject || "(no subject)",
          status:                   t.status || "",
          initial_channel:          t.channel || t.via || "",
          created_date:             createdFmt,
          agent:                    agentName,
          customer_email:           (t.customer&&t.customer.email) || "",
          contact_reason_l1:        crP[0],
          contact_reason_l2:        crP[1],
          product_l1:               prP[0],
          product_l2:               prP[1],
          ticket_resolution_l1:     rsP[0],
          ticket_resolution_l2:     rsP[1],
          additional_resolution_l1: adP[0],
          additional_resolution_l2: adP[1],
          message_count:            msgs.length,
          agent_message_count:      countAssignedAgentMessages(msgs, agentId, agentName),
          transcript:               transcript,
        });
        fc.fetched++;
      } catch(e){ fc.errors++; console.error("[FetchV2] #"+tid+" failed:", e.message); }
      await new Promise(function(r){setTimeout(r,250);});
    }

    fc.result = results.length;
    if(v2Active.length){
      // Priority summary: per agent, how many picks matched every filter vs. were near-miss top-ups
      var byAgent = {}, missCount = {};
      results.forEach(function(r){
        var a = r.agent||"(no agent)", n = (r._v2Missed||[]).length;
        var row = byAgent[a] || (byAgent[a] = {agent:a, total:0, exact:0, off1:0, off2:0});
        row.total++; if(n===0) row.exact++; else if(n===1) row.off1++; else row.off2++;
        (r._v2Missed||[]).forEach(function(l){ missCount[l]=(missCount[l]||0)+1; });
      });
      fc.priority = {
        filters: v2Active.map(function(a){ return {label:a.label, values:selChosen(v2Filters[a.key])}; }),
        target: parseInt(v2Target||"6")||6,
        agents: Object.values(byAgent).sort(function(x,y){ return x.agent.localeCompare(y.agent); }),
        exact: results.filter(function(r){return !(r._v2Missed||[]).length;}).length,
        topMisses: Object.entries(missCount).sort(function(x,y){return y[1]-x[1];})
      };
    }
    setFetchedTickets(results);
    setV2Summary(fc);
    setV2Running(false);
    setV2Status(results.length
      ? "Done — "+results.length+" of "+ids.length+" ready for Run QA."+(fc.rateLimited?" (Rate-limited at some point — check the counts.)":"")
      : "Done — nothing fetched. Check the skip counts below.");
    if(results.length) addToast(results.length+" ticket"+(results.length!==1?"s":"")+" fetched — use Run QA below");
    else addToast(UI_LABELS.fetchv2+" returned no tickets","error"); // UI label (was "Fetch v2")
  }
