  v3.0.0 (2026-09-29) -- STORAGE MOVED FROM NOTION TO POSTGRES. File renamed QAToolNotion.html -> Wingman.html.
    Everything the app does is unchanged; only where data lives (and the limits that came with Notion) changed.
    - All reads/writes go to Wingman's own REST API (/api/*, server.py -> Postgres via DATABASE_URL). The browser
      never talks to Notion again; api.notion.com is removed from the proxy allowlist. notionAPI(), getProp(),
      rtChunks() and chunkReportContent() are gone. Row IDs of imported records are the old Notion page IDs, so
      nothing that referenced them breaks (the in-app field is renamed notionPageId -> rowId).
    - NO CHARACTER LIMITS. Justifications, AI notes, transcripts, comments, reviewer notes, disputes, reports,
      calibration pool/participants/notes/insights and the scoring matrix are TEXT/JSONB with no size cap:
        * Justifications are stored whole ({reason, improve, sample, edited...}). v2 compressed them to
          150/100 chars in JSON and leaned on the per-category Notes fields; the Notes columns still exist
          (for SQL readability) but are now derived from justifications server-side, uncapped.
        * formatNotes() no longer slices at 1990. The Round/Review 1,990-char guards are removed.
        * Reports are one TEXT value (v2: 20 x 1,990 chars). Report lists are no longer limited to the first
          100 Notion rows (v2's report queries never paginated).
    - SCORING MATRIX FIX: v2 chunked config values into 1,900-char pieces but loadConfigFromNotion() only read
      10 of them, so a matrix over ~19k chars failed JSON.parse and the app silently fell back to the default
      matrix. Config is now one JSONB row per key -- and the importer reassembles every chunk, so the real saved
      matrix is recovered.
    - MATRIX VERSIONING: every change to any config key (matrix, autofails, scoringContext, calibrationBaseline)
      writes a numbered row to config_history. Saving an unchanged value does not bump the version. Every new
      audit is stamped with the matrix version it was scored under (matrix_version). Toast shows "Matrix saved (vN)".
    - FULL TICKET DATA SAVED. New per-audit columns: ctf_as_scored (the exact Contact Reason / Product /
      Ticket Resolution / Additional Resolution L1/L2 + status/channel values shown to the AI -- previously read

      replaced-for, customer email, message counts on batch rows.
    - FULL GORGIAS PULL PER AUDIT: after each audit is saved, a server-side worker fetches GET /api/tickets/{id}
      and stores the entire response in ticket_snapshots (messages, events, custom fields incl. 7630, tags,
      Shopify/Recharge integration data, datetimes...). `requester` is dropped when identical to `customer`.
      Promoted columns for querying (status, channel, assignee, tags, cf_*). Paced ~1.2s/call, backs off on 429,

    - New "Ticket data (Gorgias)" panel in Review (Edit/Full): CTF tags as scored, matrix version, and the
      captured Gorgias record. Customer PII (names, emails, phones, addresses -- including copies inside message
      bodies and map links) is censored server-side before it reaches the browser. The DB keeps the full record.
    - USERS: Postgres qa_users is the only source of truth. Removed the hardcoded USERS map, AGENT_LIST,

    - SECURITY (server-enforced now, was client-side only): View/Agent users only receive their own audits and
      reports, and may only write disputes on their own tickets. Only Full sees everyone's calibration
      assignments; reviewers can only submit their own. Role comes from the database on every request, so a
      deactivated user loses access immediately (not at session expiry). server.py/schema.sql are never served.
    - MIGRATION (Settings > Access Control > Database, Full only): 1) Import from Notion (idempotent upsert by page

  v2.0.98 (2026-09-15) -- HOTFIX: white screen / TypeError on login after v2.0.97
    - "TypeError: Cannot read properties of undefined (reading 'filter')" thrown from excludedAgentUsers() during first render, crashing the app right after the user list loaded.
    - Cause: excludedAgentUsers() read `effectiveUsers`, but the agents-dropdown list (a top-level statement in the component body, ~line 2081) is evaluated BEFORE `var effectiveUsers` is assigned (~line 4185). `var` hoists the declaration without the value, so it was undefined at call time. Other references to effectiveUsers sit inside function bodies or JSX, which evaluate after the body completes, so only this one broke.
    - Fix: added userPool(), which resolves through userList (useState, initialized early) with a hardcodedUsersArray() fallback (a hoisted function declaration, safe anywhere). excludedAgentUsers() and assignableAuditors() now both use it and never touch effectiveUsers.

  v2.0.95 (2026-09-11) -- New tab: Fetch v2 (warehouse-selected). Fetch Tickets is UNCHANGED and remains the fallback.
    - Problem: picking N tickets per agent above an assigned-agent message threshold means Fetch v1 fetches messages for EVERY in-range ticket (one Gorgias call each, ~2,500/week), and most agents can't hit the threshold, so the whole pass gets re-run at 4, then 3, then 2. Hours per week.
    - The Gorgias analytics warehouse (BigQuery, reachable via the Gorgias MCP server) answers "which tickets" in one query, tiered fallback included. Measured on Aug 31-Sep 6: only 12 of 27 agents had 6+ tickets at >=4 assigned-agent replies, but all 27 did at >=2 -- which is exactly why the re-runs were needed.
    - Wingman CANNOT reach that warehouse itself: it authenticates to api.gorgias.com with basic auth via server.py, while the warehouse sits behind MCP OAuth, and PROXY_ALLOWED_HOSTS is locked to Notion + Anthropic. So Fetch v2 is a handoff, not a direct integration.
    - Flow: pick week/target/preferred-min/floor -> Copy SQL -> run it in Claude with the Gorgias connector -> paste the ticket IDs back -> Wingman fetches exactly those from the live REST API. ~160 calls instead of ~10,000.
    - The generated SQL counts assigned-agent PUBLIC replies only: excludes customer messages, bot messages (is_ai_agent_message), and internal notes via JSON_VALUE(m.source,'$.type') != 'internal-note'. Note: m.internal is NOT a boolean -- it holds JSON metadata; and filtering internal notes on channel alone misses ~1,100/week that ride on email/facebook/chat. QA staff (EXCLUDED_AGENT_NAMES) and Jamie are excluded in the query.
    - ID paste box is tolerant of commas, spaces, newlines, quotes, leading '#', and whole pasted CSV rows. Dedupes. Live count of detected IDs.
    - Per-ticket fetch reuses the existing pipeline unchanged (parseTicketField for CTF tags, buildTranscript, countAssignedAgentMessages) and emits the identical row shape as v1, so Run QA / CSV export / Notion save all work with no downstream changes.
    - Skips previously-deleted tickets, optionally skips already-audited ones, skips QA-team agents and tickets with no usable transcript. 429 backoff with same-ticket retry. Stop button. Full skip-reason summary.
    - LIMITATION: the warehouse refreshes roughly once daily, so Fetch v2 is for closed/past weeks. For same-day work use Fetch Tickets.

  v2.0.94 (2026-07-30) -- One-time CTF correction tool (Settings > Data Integrity, Full access only)
    - Remediates tickets scored before the v2.0.93 fix, where the AI never saw Product / Ticket Resolution tags and marked them "not tagged", depressing CTF Accuracy across the board.
    - Two-pass by design. PREVIEW pass is read-only: re-fetches each ticket's live tags from Gorgias (Notion never stored raw tag values), re-scores CTF ONLY via a focused single-category prompt, and buckets results into raise / lower / unchanged / skipped / errors. Nothing is written until you review and click Apply.
    - Only ever RAISES a score. Anything scoring lower than the original is listed for manual review and never applied -- the bug systematically depressed CTF, so a lower re-score is more likely Claude run-to-run variance than a real correction, and silently docking agents in an unundoable bulk job is the wrong trade.
    - Tickets whose CTF dispute a human already approved OR rejected are skipped entirely -- a human made that call and the tool does not reverse it.
    - A PENDING CTF dispute the re-run supports (new score >= the score the agent asked for) is auto-approved and attributed to the operator as "(CTF correction)". A pending dispute the re-run does NOT support is left pending for a human -- this tool never auto-rejects.
    - Recalculates AI Score / Final Score / AI Passed / Final Passed from the new CTF value, respecting autofail and any approved dispute on other categories. Every change is appended to Reaudit History as type "system-ctf-correction" with the before/after CTF level and score.
    - Deliberately bypasses the Wednesday lock: this is a Full-access repair of a system bug, and every change is logged. Run it before the affected week locks where possible.
    - Stop button on both passes; ~600ms pacing on the scan and ~350ms on the write to stay under Gorgias/Anthropic rate limits.
    - Defensive fix: reauditHistory is normalized to an array before append, since a raw JSON string would have silently corrupted the history via string concat rather than erroring.

  v2.0.93 (2026-07-30) -- Fix: AI never saw Product / Ticket Resolution tags, so CTF Accuracy could never pass
    - ROOT CAUSE: mapFetchedToQA() -- the handoff from Fetch to Batch QA -- hand-mapped only 8 fields and silently dropped product_l1/l2, ticket_resolution_l1/l2 and additional_resolution_l1/l2. buildEvalPrompt() then read undefined for those and printed "Product: not tagged" / "Ticket Resolution: not tagged" into the scoring prompt on EVERY fetched ticket. Contact Reason WAS mapped, which is exactly why that one field always read correctly while the other two always failed -- the AI was scoring the prompt it was given, accurately. This is separate from (and larger than) the v2.0.91 product_l2 fix, which only affected the CSV export path.
    - mapFetchedToQA now delegates to mapRow(), which the CSV import path already used and which handles the identical snake_case key shape (the fetch row IS what gets exported to CSV). One mapping instead of two that can drift apart.
    - Same bug in the re-audit path: its ticketObj also omitted the tag fields, and Notion does not persist raw tag values, so a re-audit could not recover them either. Re-audit now re-fetches the ticket from Gorgias and re-parses its custom fields, so it scores against the CURRENT tags -- picking up any tag corrected since the original audit. Non-fatal if that call fails: it logs and scores without tags rather than blocking the re-audit.
    - Hoisted FIELD_CR / FIELD_PROD / FIELD_RES / FIELD_ADDRES out of the fetch loop to a single shared definition. They were local to the fetch function, which is structurally why re-audit had no way to read tags in the first place.
    - Tickets already scored under the old behaviour keep their incorrect CTF scores until re-audited -- their saved justifications will read "Product and Ticket Resolution fields are both missing" even where the tags were present in Gorgias all along.

  v2.0.92 (2026-07-30) -- New fetch filter: assigned agent message count
    - New "Assigned agent msg count min" filter on the Fetch tab, beside the existing msg count min/max. Counts only PUBLIC replies sent by the ticket's ASSIGNED agent -- excludes customer messages, bot/Jamie replies from a different sender, and internal notes. Catches tickets that look busy on raw message count but have no actual agent interaction (all bot + customer), which would otherwise get audited and score as all-NA.
    - Matching is by Gorgias user ID (assignee_user.id vs sender.id) since that's stable; falls back to a normalizeAgentName() comparison only when the API doesn't return usable IDs on both sides.
    - Internal notes excluded via the message `public` flag. Where Gorgias omits `public` entirely, the message is treated as public so we under-filter rather than silently dropping real replies.
    - Saved per-ticket as agent_message_count -> Notion "Agent Message Count", flows through CSV export (headers are derived dynamically) and is refreshed on re-audit. The existing messageCount field is deliberately UNTOUCHED, since re-audit's "are there new messages?" check depends on it counting everything.
    - Min only, no max (per spec). Applies to Balance Audits too, since it shares the fetch loop. New "Skipped -- agent msg count" row in the fetch summary.
    - Two behaviours worth knowing: (1) this counts the CURRENT assignee only, so a ticket handled by one agent and later reassigned can legitimately read 0 and be filtered out; (2) unassigned tickets always read 0, so any minimum above 0 excludes them.
    - REQUIRES SETUP: new "Agent Message Count" (Number) property on the QA Audits database.
    - Going-forward only -- already-fetched tickets have no agent count and are unaffected.

  v2.0.91 (2026-07-30) -- Fix: product_l2 dropped on fetch (breaking CTF Accuracy) + wrong week on Delete & Replace
    - Fix: the Gorgias fetch loop computed prodParts via parseTicketField (which returns [L1, L2] just like contact_reason and ticket_resolution) but only ever wrote prodParts[0] to the output row — product_l2 was silently dropped on every fetch. Since the CTF Accuracy rubric explicitly checks product_l1/l2 against the transcript, the AI saw Product L2 as permanently blank and treated it as a mistagged/missing field, so CTF was effectively always failing. Added the missing product_l2 line. mapRow() already read product_l2 correctly and the fetch CSV export derives its headers dynamically from the row object, so this one line fixes the whole chain (fetch -> CSV export -> Notion save -> scoring prompt) with no other changes needed.
    - Fix: scoreAndSaveReplacement() derived the replacement audit's week from the REPLACEMENT ticket's created date instead of inheriting the original audit's week. Delete & Replace searches for a same-agent replacement without constraining created date, so pulling a newer ticket pushed the audit into a future week (e.g. an audit replaced this week landing under "Aug 3 - Aug 9"), which then skewed Balance Audits counts and weekly reporting. Now inherits originalTicket.week (a replacement stands in for the original audit's slot), falling back to the old behaviour only if the original has no week.
    - Same hardening applied to the re-audit path: it re-scores the same ticket so its week was already correct, but it re-derived from createdDate and would silently discard any manually-corrected week. Now prefers the stored week and only re-derives as a fallback.
    - NOTE: this fixes fetches going forward. Tickets already fetched and saved without Product L2 still have a blank value in Notion and will keep scoring poorly on CTF Accuracy until re-fetched or re-audited.

  v2.0.90 (2026-07-27) -- New feature: audited tickets lock on the Wednesday of the following week
    - Lock date = Wednesday of the week following the Manila week containing reviewedAt (the human audit-completion timestamp) — NOT the ticket's created-date week, since those can drift apart (backlogs, late catch-up audits, re-audits). A ticket with no reviewedAt yet is never locked. Formula: mnlMondayInstant(reviewedAt) + 9 days.
    - Once locked: no new agent disputes (saveAgentDispute), no auditor direct override (saveDispute), no Re-audit, no Delete & Replace, no Mark/Remove autofail.
    - Deliberately NOT gated: saveDisputeApproval (resolving an already-filed dispute — by construction it was filed before the lock, so it always resolves normally) and recalcFinalPassed (the admin drift-repair tool — fixes bugs, not scores).
    - Full-access users get an explicit "🔓 Unlock" action on a locked ticket (reason required) — logged (who/when/why) via 4 new fields, not a silent bypass. Persists once set; no separate re-lock action in this version.
    - UI: lock banner + inline unlock control in the ticket detail view, an "Unlocked by X — reason" banner when an override is active, and a 🔒 icon next to the ticket ID in the Review tab list.
    - REQUIRES SETUP: 4 new properties on the existing QA Audits database — Unlocked Override (Checkbox), Unlocked By, Unlocked At, Unlock Reason (all Text). Nothing else in that DB changes.

  v2.0.89 (2026-07-13) -- Fix: Round Status grid showed headers but no ticket rows

    - Loaded via a new query in openTeamCalibRound (Full-access only) that pulls every assignment in the round, not just the current user's — kept separate from what feeds Calibrate itself, so opening a round to check status doesn't require running the analysis.

  v2.0.87 (2026-07-13) -- Team Calibration: wire in real DB IDs + fix Notion 2000-char field overflow
    - CALIB_ROUNDS_DB_ID / CALIB_REVIEWS_DB_ID now point at the real "Team Calibration Rounds" / "Team Calibration Reviews" databases.
    - Fix: confirmCalibRound() was saving candidateIds/candidateIdx (every ticket an auditor reviewed that week, kept only for the pre-confirm re-roll button) into the Pool rich_text field. With any real team size this pushed past Notion's 2000-char-per-rich_text-block limit ("Pool.rich_text[0].text.content.length ... instead was 2997") and the round never got created. Those fields are pre-confirm-only (never read from the persisted round), so they're now stripped before the Notion write.
    - Added a pre-flight length check on Participants/Pool before writing, and the same check on Notes when submitting a blind review (free-text justifications across 8 categories can independently hit the same 2000-char ceiling) — both now fail with a clear, specific message instead of a cryptic Notion 400.

  v2.0.86 (2026-07-13) -- New feature: Team Calibration (blind human inter-rater calibration)
    - New "Team Calibration" tab, visible to Edit/Full, hidden from View/Agent. Distinct from the existing AI-vs-dispute "Calibration" tab — this measures auditor-vs-auditor agreement.
    - Setup (Full-only): pick a week, generates a pool of one ticket per active auditor who reviewed at least one ticket that week (auditors with zero reviewed tickets that week are skipped from the pool but still participate as reviewers, with a re-roll option per pool ticket before confirming.
    - On confirm: every active Edit/Full auditor is assigned every pool ticket EXCEPT the one they originally reviewed (no self-review).
    - Blind scoring: each auditor gets a "My Calibration Queue" showing their assigned tickets. Scoring a ticket shows only the transcript, agent, and contact reason — the original AI score, the original human reviewer's identity/score, and every other auditor's score are hidden until the round's insights are generated. Includes the same autofail flag + condition capture as the main rubric.
    - "Calibrate" (Full-only): can be run anytime, with a confirm-dialog warning if the round isn't fully complete (works on whatever's done — minimum 2 completed reviews just to have something to compare). Sends all blind scores + notes to Claude (Sonnet, same call used for weekly Team Insights), alongside the original AI/human score as reference-only context (never shown to blind reviewers), and returns category agreement, per-auditor lean (lenient/strict), autofail agreement, highest-divergence tickets with quoted reasoning, and rubric/scoring-context recommendations.
    - Insights are saved to Notion (chunked, same pattern as Reports) so past rounds can be reopened later — visible to both Edit and Full. Export to .doc supported.
    - REQUIRES SETUP: two new Notion databases must be created before this works — "Team Calibration Rounds" and "Team Calibration Reviews" — with their IDs pasted into the CALIB_ROUNDS_DB_ID / CALIB_REVIEWS_DB_ID placeholders near the top of this file. Schema details in the handoff notes. This has not been tested against live data.

  v2.0.85 (2026-07-08) -- Fix: Maria C. (and any agent) could get silently split into two entries
    - Root cause: agentName is read from several sources (live Gorgias assignee_user.name on fetch, the "Agent" property when loading from Notion, CSV import) and any of them could carry a stray non-breaking space, doubled space, or leading/trailing whitespace that's invisible in the UI but makes the string byte-for-byte different from the canonical "Maria C." — so it silently became a second "agent" everywhere names are grouped: the Review "Agent" filter dropdown, the Dashboard "By agent" breakdown, and worst of all Balance Audits, where the variant with 0 tracked audits looked short of target and had 6 more tickets pulled for Maria C. on top of the 12 she already had that week (target was 6).
    - Added normalizeAgentName() (collapses NBSP + repeated whitespace, trims ends) and applied it at every point agentName enters the app: Notion ticket load (both parse paths), CSV import, and the live Gorgias fetch loop. Because this runs when data is read into the app (not just on write), it also self-heals existing split records in Notion the next time they're loaded — no manual data cleanup needed in Notion itself.

    - AGENT_LIST (used by Manual Audit's agent dropdown and the Admin panel's per-user Agent Name assignment) filtered to exclude the same names.
    - The dynamically-derived `agents` list (Fetch tab's Agent multi-select, Dashboard "By agent" breakdown, Balance Audits scope) filtered the same way, so excluded names no longer appear as selectable/reportable agents anywhere in-app.
    - Re-confirmed the v2.0.83 report-generation fix: the agent-facing exported report (My Reports .doc) has no remaining auditor-name references — verified no other code path reintroduces it.

}

// Storage is Postgres via /api (v3.0.0). The Notion database IDs, the hardcoded USERS map,
// AGENT_LIST and EXCLUDED_AGENT_NAMES were removed -- qa_users in Postgres is the source of truth.
// Collapses NBSP/double-space/leading-trailing whitespace so the same person never gets
// split into two "different" agents (e.g. "Maria C." vs "Maria C. " from a Gorgias display-name edit).
function normalizeAgentName(s){
  return (s||"").replace(/\u00A0/g," ").replace(/\s+/g," ").trim();
}
const DATA_SETUP = { storage: "postgres" };
const PASS_THRESHOLD = 85;

// Role: "full" = all access, "edit" = can QA + dispute, "view"/"agent" = read-only (own tickets)


// ── API HELPERS ──────────────────────────────────────────────────────────
// All external calls go through the local Python proxy (start.py)
// so there are no CORS issues regardless of how the file is served.
const PROXY = window.location.origin + "/proxy";

async function proxyFetch(targetUrl, method, headers, body) {
  // The Anthropic key is injected by the server; the browser never holds it.
  // We only send the session token so the proxy can authenticate the request.
  const res = await fetch(PROXY + "?url=" + encodeURIComponent(targetUrl), {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-Session-Token": sessionStorage.getItem("qa_session") || ""
    },
    body: JSON.stringify({
      _method: method || "GET",
      _body: body
    })
  });
  if (!res.ok) {
    const txt = await res.text().catch(() => "");
    throw new Error("Request failed " + res.status + ": " + txt.slice(0, 200));
  }
  return res.json();
}

async function callClaude(prompt) {
  const data = await proxyFetch(
    "https://api.anthropic.com/v1/messages",
    "POST",
    null,
    { model: "claude-haiku-4-5-20251001", max_tokens: 4000, messages: [{ role: "user", content: prompt }] }
  );
  return (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
}

// Use Sonnet for insights -- much better analysis quality, worth the extra cost
async function callClaudeInsights(prompt) {
  const data = await proxyFetch(
    "https://api.anthropic.com/v1/messages",
    "POST",
    null,
    { model: "claude-sonnet-4-5", max_tokens: 8000, messages: [{ role: "user", content: prompt }] }
  );
  return (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
}

// Retry on 429 rate limit with exponential backoff, and on 502/503/504 upstream errors with flat 3s delay
async function callClaudeWithRetry(prompt, maxRetries=4) {
  var upstreamRetries = 0;
  var maxUpstreamRetries = 2;
  for (var attempt=0; attempt<=maxRetries; attempt++) {
    try {
      return await callClaude(prompt);
    } catch(e) {
      var is429 = e.message && e.message.includes("429");
      var isUpstream = e.message && (e.message.includes("502") || e.message.includes("503") || e.message.includes("504"));
      if (is429 && attempt < maxRetries) {
        var wait = Math.pow(2, attempt) * 3000; // 3s, 6s, 12s, 24s
        console.log("[QA] Rate limited, waiting " + (wait/1000) + "s...");
        await new Promise(function(r){setTimeout(r, wait);});
      } else if (isUpstream && upstreamRetries < maxUpstreamRetries) {
        upstreamRetries++;
        console.log("[QA] Upstream error, retry " + upstreamRetries + "/" + maxUpstreamRetries + " in 3s...");
        await new Promise(function(r){setTimeout(r, 3000);});
      } else {
        throw e;
      }
    }
  }
}


// ── POSTGRES DATA LAYER (v3.0.0) ─────────────────────────────────────────
// Every storage call goes to Wingman's own /api (server.py -> Postgres). The browser
// never talks to Notion. No chunking, no 2,000-char limits anywhere on this path.
var CURRENT_MATRIX_VERSION = null;   // set by the app whenever the matrix is loaded/saved

async function apiCall(path, method, body) {
  const res = await fetch(window.location.origin + "/api" + path, {
    method: method || "GET",
    headers: {
      "Content-Type": "application/json",
      "X-Session-Token": sessionStorage.getItem("qa_session") || ""
    },
    body: body === undefined ? undefined : JSON.stringify(body)
  });
  var data = null;
  try { data = await res.json(); } catch(e) {}
  if (!res.ok) {
    var msg = (data && data.error) || ("HTTP " + res.status);
    var err = new Error(msg); err.status = res.status;
    throw err;
  }
  return data;
}

async function loadTicketsFromDb(onStatus) {
  const log = (msg) => { console.log("[QA]", msg); if(onStatus) onStatus(msg); };
  log("Loading tickets from database...");
  var rows = [], offset = 0, total = null;
  while (offset !== null) {
    var data = await apiCall("/tickets?limit=500&offset=" + offset);
    rows.push.apply(rows, data.rows || []);
    total = data.total;
    offset = data.next;
    log("Fetched " + rows.length + (total != null ? " of " + total : "") + " tickets...");
  }
  log("Parsing " + rows.length + " tickets");
  return rows.map(function(r){
    return parseTicketRow(Object.assign({}, r, {
      pageId: r.id,
      agentName: normalizeAgentName(r.agentName||""),
      ticketUrl: (r.ticketUrl||"").replace("/app/tickets/","/app/ticket/"),
      auditType: r.auditType||"AI Batch",
    }));
  });
}

async function loadDeletedTicketIds() {
  var data = await apiCall("/tickets/deleted-ids");
  return new Set((data.ids||[]).map(String));
}

// Returns the stored value (or null), exactly like v2's loadConfigFromNotion().
async function loadConfigFromDb(key) {
  try {
    var data = await apiCall("/config/" + encodeURIComponent(key));
    if (!data || !data.exists) return null;
    if (key === "matrix") CURRENT_MATRIX_VERSION = data.version;
    return data.value;
  } catch(e) { console.error("[QA] loadConfig:", e); return null; }
}

// One JSONB row per key, versioned server-side. Returns the new/current version.
async function saveConfigToDb(key, value) {
  var data = await apiCall("/config/" + encodeURIComponent(key), "PUT", { value: value });
  if (key === "matrix") CURRENT_MATRIX_VERSION = data.version;
  return data.version;
}

// CTF tag values exactly as they were shown to the AI for this scoring run.
function pickCtfTags(src) {
  if (!src) return null;
  var keys = ["contactReasonL1","contactReasonL2","productL1","productL2","resolutionL1","resolutionL2",
              "addResolutionL1","addResolutionL2","status","initialChannel"];
  var out = {}, any = false;
  keys.forEach(function(k){ if (src[k] !== undefined && src[k] !== null) { out[k] = src[k]; any = true; } });
  return any ? out : null;
}

// PATCH an audit row. `fields` uses the camelCase names the server maps (see TICKET_FIELDS in server.py).
async function dbPatchTicket(rowId, fields) {
  return apiCall("/tickets/" + rowId, "PATCH", fields);
}
// PATCH with up to 3 attempts on transient failure (never retries a 4xx).
async function dbPatchTicketRetry(rowId, fields, maxRetries){
  maxRetries = maxRetries==null?2:maxRetries;
  var lastErr;
  for(var attempt=0;attempt<=maxRetries;attempt++){
    try{ return await dbPatchTicket(rowId, fields); }
    catch(e){
      lastErr=e; dbg("db","patch attempt "+(attempt+1)+" failed: "+e.message);
      if(e.status && e.status>=400 && e.status<500) break;
      if(attempt<maxRetries) await new Promise(function(r){setTimeout(r,700*(attempt+1));});
    }
  }
  throw lastErr;
}
// Read-back verify that a disputes object actually persisted (guards against silent loss).
async function verifyDisputesSaved(rowId, expectedCount){
  try{
    var row = await apiCall("/tickets/"+rowId);
    var parsed = tryParseJSON(row.disputesJSON);
    var got = parsed?Object.keys(parsed).length:0;
    dbg("dispute","read-back rowId="+rowId+" got="+got+" expected="+expectedCount);
    if(got!==expectedCount) throw new Error("read-back mismatch: saved "+got+" of "+expectedCount+" disputes");
    return true;
  }catch(e){ dbg("dispute","read-back error: "+e.message); throw e; }
}

async function saveTicketToDb(ticket) {
  const payload = {
    ticketId:          String(ticket.ticketId||""),

async function updateTicketInDb(rowId, ticket) {
  await dbPatchTicket(rowId, {
    finalScore:  ticket.finalScore||0,
    finalPassed: !!(ticket.disputedPassed!==undefined?ticket.disputedPassed:ticket.passed),
    hasDisputes: !!ticket.hasDisputes,
    disputes:    ticket.disputes||{},
    savedAt:     new Date().toISOString(),
  });
}

function tryParseJSON(txt) {
  if (!txt) return null;
  try { return JSON.parse(txt); } catch(e) {}
  const cb = txt.match(/```(?:json)?\s*([\s\S]+?)```/);
  if (cb) { try { return JSON.parse(cb[1].trim()); } catch(e) {} }
  const arr = txt.match(/\[[\s\S]{10,}\]/);
  if (arr) { try { return JSON.parse(arr[0]); } catch(e) {} }
  const obj = txt.match(/\{[\s\S]{10,}\}/);
  if (obj) { try { return JSON.parse(obj[0]); } catch(e) {} }
  return null;
}

function parseTicketRow(r) {
  function safeParse(str, fallback) {
    if(!str) return fallback;
    try { return JSON.parse(str); } catch(e) {}
    try { return JSON.parse(str.replace(/'/g,'"')); } catch(e) {}
    return fallback;
  }
  let aiScores = {}, disputes = {}, justifications = {}, autofails = [];
  aiScores  = safeParse(r.scoresJSON       || r["Scores JSON"]       || "{}", {});
  disputes  = safeParse(r.disputesJSON     || r["Disputes JSON"]     || "",   {});
  autofails = safeParse(r.autofailsJSON    || r["Autofails JSON"]    || "",   []);
  var rawJust = safeParse(r.justificationsJSON || r["Justifications JSON"] || "{}", {});
  // Handle both compressed format {r,i} and full format {reason,improve}
  Object.entries(rawJust).forEach(function(e){
    var k=e[0],v=e[1];
    if(v&&typeof v==="object"){
      // Keep every stored key (edited, editedBy, editedAt, ...) -- v2 dropped them on load.
      var e2=Object.assign({},v); delete e2.r; delete e2.i;
      justifications[k]=Object.assign(e2,{
        reason: v.reason||v.r||"",
        improve: v.improve||v.i||null,
        sample: v.sample||null
      });
    }
  });
  // Override with per-category notes fields if present (full text, no truncation)
  var catNoteMap={
    ctf:"ctfNotes",empathy:"empathyNotes",fcr:"fcrNotes",product:"productNotes",
    order:"orderNotes",returns:"returnsNotes",promo:"promoNotes",retention:"retentionNotes"
  };
  Object.entries(catNoteMap).forEach(function(e){
    var catId=e[0], field=e[1];
    var raw=r[field]||r[field.replace(/([A-Z])/g," $1").replace(/^./,function(s){return s.toUpperCase();})+""]||"";
    if(raw){
      var parts=raw.split(" | ↑ ");
      justifications[catId]={
        reason: parts[0]||"",
        improve: parts[1]||null,
        sample: null
      };
    }
  });
  // Support both camelCase (API field names) and "Title Case" (legacy field names)
  const ticketId  = r.ticketId  || r["Ticket ID"]  || r.title || "";
  const agentName = normalizeAgentName(r.agentName || r["Agent"]       || r.agent || "");
  const reviewer  = r.reviewer  || r["Auditor"]     || r.auditor || "";
  const aiScore   = parseFloat(r.aiScore    ?? r["AI Score"]    ?? 0) || 0;
  const finalScore= parseFloat(r.finalScore ?? r["Final Score"] ?? aiScore) || 0;
  return {
    id: r.pageId || r.id || ticketId,
    rowId: r.pageId || r.id || null,
    ticketId,
    agentName,
    reviewer,
    week:          r.week         || r["Week"]          || "",
    createdDate:   r.createdDate  || r["Created Date"]  || "",
    contactReason: r.contactReason|| r["Contact Reason"]|| "",
    subject:       r.subject      || r["Subject"]       || "",
    ticketUrl:     r.ticketUrl    || r["Ticket URL"]    || "",
    aiScore,
    finalScore,
    passed:         !!(r.aiPassed    ?? r["AI Passed"]    ?? false),
    disputedPassed: !!(r.finalPassed ?? r["Final Passed"] ?? false),
    hasDisputes:    !!(r.hasDisputes ?? r["Has Disputes"] ?? false),
    reviewed:       !!(r.reviewed ?? r["Reviewed"] ?? false),
    reviewedBy:     r.reviewedBy || r["Reviewed By"] || "",
    reviewedAt:     r.reviewedAt || r["Reviewed At"] || "",
    reviewerNotes:  r.reviewerNotes || r["Reviewer Notes"] || "",
    autofail:       !!(r.autofail    ?? r["Autofail"]     ?? false),
    aiScores, scores: aiScores, disputes, justifications,
    comments:  r.comments  || r["Comments"]  || "",
    transcript: r.transcript || r["Transcript"] || "",
    autofails,
    savedAt: r.savedAt || r["Saved At"] || "",
    notesHistoryJSON: r.notesHistoryJSON || r["Notes History JSON"] || "{}",
    reopenHistoryJSON: r.reopenHistoryJSON || r["Reopen History JSON"] || "[]",
    auditType: r.auditType || r["Audit Type"] || "AI Batch",
    messageCount: parseInt(r.messageCount ?? r["Message Count"] ?? "") || null,
    agentMessageCount: parseInt(r.agentMessageCount ?? r["Agent Message Count"] ?? "") || null,
    reauditHistory: (function(){
      try { return JSON.parse(r.reauditHistory || r["Reaudit History"] || "[]"); } catch(e){ return []; }
    })(),
    deleted: r.deleted || false,
    deletedBy: r.deletedBy || "", deletedAt: r.deletedAt || "", deleteReason: r.deleteReason || "",
    unlockedOverride: !!(r.unlockedOverride ?? r["Unlocked Override"] ?? false),
    unlockedBy: r.unlockedBy || r["Unlocked By"] || "",
    unlockedAt: r.unlockedAt || r["Unlocked At"] || "",
    unlockReason: r.unlockReason || r["Unlock Reason"] || "",
    // v3 additions (null/empty on audits imported from Notion)
    autofailManual: !!r.autofailManual,
    auditWeek: r.auditWeek || "",
    totalPoints: r.totalPoints==null ? null : r.totalPoints,
    maxPoints: r.maxPoints==null ? null : r.maxPoints,
    replacedFor: r.replacedFor || "",
    customerEmail: r.customerEmail || "",
    aiMeta: r.aiMeta || null,
    ctfAsScored: r.ctfAsScored || null,
    matrixVersion: r.matrixVersion==null ? null : r.matrixVersion,
    snapshotStatus: r.snapshotStatus || "none",
    imported: !!r.imported
  };
}



function makeDefaultCtf() { return { contactReasons:[], products:[], resolutions:[] }; }
function downloadBlob(content,filename,type) {
  var blob=new Blob([content],{type});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}

function parseScoreVal(val) {
  if (!val || val === "NA") return null;
  const m = val.match(/\(([\d.]+)\)/);
  return m ? parseFloat(m[1]) : null;
}
function calcScore(scores, matrix) {
  let pts = 0, max = 0;
  matrix.forEach(c => {
    const v = scores[c.id];
    if (!v || v === "NA") return;
    const sv = parseScoreVal(v);
    if (sv !== null) { pts += sv; max += c.max; }
  });
  return max === 0 ? null : { pts, max, pct: Math.round((pts / max) * 100) };
}
function calcDisputedScore(ticket, matrix) {
  // Only approved disputes affect the score -- pending and rejected use AI score
  // normalizeDisputeScore: converts bare labels ("Pass","YES","NO","Partial") to "LEVEL (points)" format
  // Handles legacy disputes saved before the points-in-parens format was enforced
  function normalizeDisputeScore(val, cat) {
    if (!val) return val;
    if (/\([\d.]+\)/.test(val)) return val; // already has points
    var upper = val.toUpperCase();
    if (cat && cat.levels) {
      var match = cat.levels.find(function(l) {
        return l.level.toUpperCase() === upper ||
               (upper === "PASS" && l.level.toUpperCase().startsWith("YES")) ||
               (upper === "MISS" && l.level.toUpperCase().startsWith("NO"));
      });
      if (match && match.points !== null && match.points !== undefined) {
        return match.level + " (" + match.points + ")";
      }
    }
    return val;
  }
  const merged = {};
  matrix.forEach(c => {
    const d = ticket.disputes && ticket.disputes[c.id];
    const useDispute = d && (d.status === "approved" || !d.status); // no status = legacy dispute, treat as approved
    var score = useDispute ? normalizeDisputeScore(d.finalScore, c) : ((ticket.aiScores && ticket.aiScores[c.id]) || "");
    merged[c.id] = score;
  });
  return calcScore(merged, matrix);
}
function scoreLabel(val) {
  if (!val || val === "NA") return null;
  const v = val.toUpperCase();
  if (v.startsWith("YES")) return "Pass";
  if (v.startsWith("PARTIAL")) return "Partial";
  if (v.startsWith("NO")) return "Miss";
  return null;
}
// Asia/Manila (UTC+8, no DST) is the canonical timezone for all week bucketing, so audit
// "week" labels are consistent regardless of the operator's browser zone and align with Scout/Gorgias.
// We shift an instant by +8h and read its UTC fields to get Manila wall-clock.
var MNL_MS = 8 * 60 * 60 * 1000;
function _mnlFmt(instant) {
  return new Date(instant).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "Asia/Manila" });
}
function mnlMondayInstant(input) {
  var d = (input instanceof Date) ? input : new Date(input);
  if (isNaN(d.getTime())) return null;
  var s = new Date(d.getTime() + MNL_MS);
  var dow = s.getUTCDay() || 7;                                   // 1=Mon..7=Sun (Manila)
  var midMNL = Date.UTC(s.getUTCFullYear(), s.getUTCMonth(), s.getUTCDate()) - MNL_MS; // Manila 00:00 of that date
  return midMNL - (dow - 1) * 86400000;                          // back to Monday
}
function mnlWeekLabel(monInstant) {
  if (monInstant == null) return "";
  var monShift = new Date(monInstant + MNL_MS);
  return _mnlFmt(monInstant) + " - " + _mnlFmt(monInstant + 6 * 86400000) + " " + monShift.getUTCFullYear();
}
function mnlMondayStr(input) {
  var mi = mnlMondayInstant(input);
  if (mi == null) return "";
  var s = new Date(mi + MNL_MS);
  return s.getUTCFullYear() + "-" + String(s.getUTCMonth() + 1).padStart(2, "0") + "-" + String(s.getUTCDate()).padStart(2, "0");
}

function getWeek() {
  return mnlWeekLabel(mnlMondayInstant(new Date()));
}
function ticketWeekLabel(createdDate) {
  if (!createdDate) return "";
  return mnlWeekLabel(mnlMondayInstant(createdDate));
}

// Locking: a ticket locks on the Wednesday of the week FOLLOWING the Manila week its
// human review (reviewedAt) fell in — not the week it was created. E.g. reviewed sometime
// in the week of Jul 20-26 -> following week is Jul 27-Aug 2 -> Wednesday of that = Jul 29.
// That's mnlMondayInstant(reviewedAt) + 9 days (7 to next Monday, +2 to Wednesday).
function ticketLockInstant(reviewedAt) {
  if(!reviewedAt) return null;
  var reviewMon = mnlMondayInstant(reviewedAt);
  if(reviewMon==null) return null;
  return reviewMon + 9*86400000;
}
// A ticket is never locked until it's been human-reviewed at least once (no reviewedAt = no lock),
// and a Full-access unlock override always wins regardless of date.
function isTicketLocked(t) {
  if(!t || !t.reviewedAt || t.unlockedOverride) return false;
  var lockInstant = ticketLockInstant(t.reviewedAt);
  if(lockInstant==null) return false;
  return Date.now() >= lockInstant;
}
function ticketLockDateLabel(t) {
  var lockInstant = ticketLockInstant(t&&t.reviewedAt);
  if(lockInstant==null) return "";
  var d = new Date(lockInstant + MNL_MS);
  return _mnlFmt(lockInstant) + " " + d.getUTCFullYear();
}

// Parse a week label ("Jun 9 - Jun 15 2026") into a sortable timestamp (start of week).
// Used to sort week dropdowns chronologically, since the label sorts wrong as a string.
function weekSortKey(label) {
  if (!label) return 0;
  try {
    const m = String(label).match(/^(.*?)\s*-\s*.*\s(\d{4})$/);
    if (m) { const d = new Date(m[1].trim() + " " + m[2]); if (!isNaN(d.getTime())) return d.getTime(); }
  } catch (e) {}
  return 0;
}

// Build the Mon-Sun week label ("Jun 9 - Jun 15 2026") from a Monday Date.
function weekLabelFromMonday(mon){
  var input=(mon instanceof Date)?mon:(mon+"T00:00:00+08:00");
  return mnlWeekLabel(mnlMondayInstant(input));
}
// Last n weeks (Mondays), newest first: [{value:"YYYY-MM-DD"(Mon), label:"Jun 9 - Jun 15 2026"}].
function recentWeeks(n){
  var out=[]; var cur=mnlMondayInstant(new Date());
  for(var i=0;i<n;i++){
    var mi=cur - i*7*86400000;
    out.push({value:mnlMondayStr(new Date(mi)), label:mnlWeekLabel(mi)});
  }
  return out;
}

// ── CSV PARSER ───────────────────────────────────────────────────────────
function parseCSV(text) {
  // RFC 4180-style parser: handles quoted fields containing commas, embedded
  // newlines, and "" escapes. The old version split on newlines first, which
  // shattered any row whose transcript contained line breaks.
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // strip BOM
  const rows = []; let row = [], cur = "", inQ = false, i = 0; const n = text.length;
  while (i < n) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') {
        if (text[i + 1] === '"') { cur += '"'; i += 2; continue; } // escaped quote
        inQ = false; i++; continue;
      }
      cur += ch; i++; continue;
    }
    if (ch === '"') { inQ = true; i++; continue; }
    if (ch === ',') { row.push(cur); cur = ""; i++; continue; }
    if (ch === '\r') { i++; continue; }
    if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ""; i++; continue; }
    cur += ch; i++;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  const clean = rows.filter(r => r.some(c => c.trim() !== ""));
  if (clean.length < 2) return [];
  const headers = clean[0].map(h => h.replace(/^\uFEFF/, "").trim());
  return clean.slice(1).map(vals => {
    const obj = {};
    headers.forEach((h, idx) => { obj[h] = (vals[idx] != null ? vals[idx] : "").trim(); });
    return obj;
  });
}
function mapRow(row) {

  var ks = Object.keys(m||{});
  var wasAll = ks.length===0 || ks.every(function(k){return m[k];});   // empty map = never touched = "All"
  var out={}; (options||[]).forEach(function(o){ out[o] = wasAll ? true : !!(m&&m[o]); }); return out;
}

// ── BATCH FETCH PRIORITY FILTERS (v3.2.0) ───────────────────────────────────
// Filters are PRIORITIES, not hard filters: every ticket gets a mismatch count (how many active
// filters it misses; 0 = exact match), and each agent's top-N is taken by mismatch ASC first, then
// assigned-agent replies DESC. So agents fill their target with exact matches, and only top up from
// the closest near-misses when they run short. Pure function so it can be tested on its own.
var V2_FILTER_DEFS = [
  {key:"crL1",     label:"Contact Reason L1",  field:"Contact Reason",               part:0, opts:"contactReason"},
  {key:"crL2",     label:"Contact Reason L2",  field:"Contact Reason",               part:1, opts:"contactReason"},
  {key:"resL1",    label:"Resolution L1",      field:"Ticket Resolution",            part:0, opts:"resolution"},
  {key:"resL2",    label:"Resolution L2",      field:"Ticket Resolution",            part:1, opts:"resolution"},
  {key:"addResL1", label:"Add. Resolution L1", field:"Additional Ticket Resolution", part:0, opts:"addResolution"},
  {key:"addResL2", label:"Add. Resolution L2", field:"Additional Ticket Resolution", part:1, opts:"addResolution"}
];
function v2ActiveFilters(filters){
  return V2_FILTER_DEFS.filter(function(d){ return selIsActive(filters&&filters[d.key]); })
    .map(function(d){ return Object.assign({}, d, {values: selValuesLower(filters[d.key])}); });
}
function v2SqlStr(v){ return "'"+String(v).replace(/\\/g,"\\\\").replace(/'/g,"\\'")+"'"; }
var V2_FIELD_COL = {"Contact Reason":"cr", "Ticket Resolution":"res", "Additional Ticket Resolution":"addres"};
// Returns "" when no filters are active (query stays exactly as before).
function v2CtfSql(active, startDate, endDate){
  if(!active || !active.length) return {ctes:"", source:"per_ticket", mismatch:"0"};
  var cols = {}; active.forEach(function(a){ cols[a.field]=true; });
  var sel = Object.keys(cols).map(function(f){
    return "    MAX(IF(cf.label = "+v2SqlStr(f)+", cf.customer_field_value, NULL)) AS "+V2_FIELD_COL[f];
  }).join(",\n");
  var terms = active.map(function(a){
    var col = "COALESCE(c."+V2_FIELD_COL[a.field]+", '')";
    var part = a.part===0
      ? "LOWER(TRIM(SPLIT("+col+", '::')[SAFE_OFFSET(0)]))"
      : "LOWER(TRIM(COALESCE(SPLIT("+col+", '::')[SAFE_OFFSET(1)], '')))";
    return "      IF("+part+" IN ("+a.values.map(v2SqlStr).join(", ")+"), 0, 1)  -- "+a.label;
  }).join("\n    + ");
  var ctes = "ctf AS (\n  SELECT t.ticket_id,\n"+sel+"\n"
    +"  FROM gaia.tickets AS t\n  CROSS JOIN UNNEST(t.custom_fields_ticket_values) AS cf\n"
    +"  WHERE t.ticket_created_date BETWEEN '"+startDate+"' AND '"+endDate+"'\n  GROUP BY 1\n),\n"
    +"scored AS (\n  SELECT p.*, (\n    "+terms+"\n  ) AS mismatch\n"
    +"  FROM per_ticket AS p\n  LEFT JOIN ctf AS c USING (ticket_id)\n),\n";
  return {ctes:ctes, source:"scored", mismatch:"p.mismatch"};
}
// Client-side twin, run on the LIVE tags of each fetched ticket (the warehouse refreshes daily).
function v2TicketMismatch(active, tags){
  var missed = [];
  active.forEach(function(a){
    var raw = a.field==="Contact Reason" ? tags.cr : a.field==="Ticket Resolution" ? tags.res : tags.addres;
    var v = String((raw||["",""])[a.part]||"").toLowerCase().trim();
    if(a.values.indexOf(v)===-1) missed.push(a.label);
  });
  return missed;
}

// ── HOME DASHBOARD: CHARTS + AI INSIGHTS (v3.4.0) ────────────────────────────
// All charts use the FINAL level per category (an approved dispute replaces the AI level), so they agree
// with the Final pass rate / Avg score cards. Plain SVG, Wingman colors, no chart library.
var DASH_LEVEL_COLORS = {YES:"#1f8a5b", PARTIAL:"#b7791f", NO:"#c53030"};
function dashLevelOf(t, catId){
  var d = t.disputes && t.disputes[catId];
  var raw = (d && d.status==="approved" && d.finalScore) ? d.finalScore : ((t.aiScores||t.scores||{})[catId]);
  var w = String(raw||"").trim().split(/[\s(]/)[0].toUpperCase();
  return (w==="YES"||w==="PARTIAL"||w==="NO") ? w : (w ? "NA" : "");
}
function dashFinalPct(t, matrix){ var sc = calcDisputedScore(t, matrix); return sc ? sc.pct : (t.finalScore||t.aiScore||0); }
function dashFinalPassed(t, matrix){ var sc = calcDisputedScore(t, matrix); return sc ? (!t.autofail && sc.pct>=85) : !!t.passed; }
function dashMonday(dateStr){
  var s = String(dateStr||"").replace("T"," ").slice(0,10); if(s.length<10) return "";
  var d = new Date(s+"T00:00:00Z"); if(isNaN(d)) return "";
  d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7)); return d.toISOString().slice(0,10);
}
function dashShortDate(iso){ var m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; var p=String(iso).split("-"); return p.length===3 ? m[+p[1]-1]+" "+(+p[2]) : iso; }
function dashCrL1(t){ var c = (t.ctfAsScored&&t.ctfAsScored.contactReasonL1) || String(t.contactReason||"").split("::")[0]; c=String(c||"").trim(); return c||"(none)"; }

    {sub&&<p style={{margin:"0 0 12px",fontSize:"12px",color:"var(--color-text-secondary)"}}>{sub}</p>}

function dashLegend(items){

// 1) Category scorecard — YES / PARTIAL / NO share per matrix category (N/A excluded)

// 2) Weekly trend — avg final score, final pass rate, AI pass rate; 85% target line

  var by = {};

    return {w:w, n:a.length,

// Evidence for the AI: the AI's own written justifications, sampled evenly across the period.
function buildInsightSamples(list, matrix){
  var out = {};
  matrix.forEach(function(c){
    var good=[], bad=[];
    list.forEach(function(t){ var l=dashLevelOf(t,c.id); var j=(t.justifications||{})[c.id]; var txt=j&&(j.reason||j.r); if(!txt) return;
      var item = "["+dashCrL1(t)+"] "+String(txt).replace(/\s+/g," ").slice(0,240)+(j.improve&&l!=="YES"?" | improve: "+String(j.improve).replace(/\s+/g," ").slice(0,120):"");
      if(l==="YES") good.push(item); else if(l==="PARTIAL"||l==="NO") bad.push(l+": "+item); });
    var pick = function(a,k){ if(a.length<=k) return a; var step=a.length/k, r=[]; for(var i=0;i<k;i++) r.push(a[Math.floor(i*step)]); return r; };
    if(good.length||bad.length) out[c.label] = {YES:pick(good,5), notYES:pick(bad,7)};
  });
  return out;
}
function buildInsightPrompt(stats, samples, rangeLabel){
  return "You are a senior quality analyst for Freebird's customer experience (CX) team. Write insights for the leadership team "
    +"from this period's QA audit data.\n\nPERIOD: "+rangeLabel+"\n\n"
    +"AGGREGATE DATA (final levels; an approved dispute replaces the AI's level):\n"+JSON.stringify(stats)+"\n\n"
    +"EVIDENCE — a sample of the AI auditor's written justifications per category, prefixed with the ticket's contact reason:\n"+JSON.stringify(samples)+"\n\n"
    +"Write 2 or 3 items for WHAT WENT WELL and 2 or 3 for WHAT COULD BE DONE BETTER.\n"
    +"Each item: a short headline that names the workflow or skill (e.g. 'Return and refund workflow execution.'), then ONE paragraph "
    +"(2-4 sentences) that describes the concrete agent behaviours seen in the evidence and backs them with the exact numbers above "
    +"(e.g. '105 YES versus only 5 PARTIAL or NO'), and says why it matters given the contact-reason mix.\n"
    +"Rules: use only numbers present in the data; never invent figures. Speak about the team, not individual agents. "
    +"Pick the patterns with the largest volume or impact. For 'could be done better', be specific about what agents should do differently. "
    +"Plain, confident, professional English — no hype, no filler.\n\n"
    +"Respond with ONLY this JSON, no other text:\n"
    +'{"wentWell":[{"headline":"...","detail":"..."}],"improve":[{"headline":"...","detail":"..."}]}';
}
function insightRangeLabel(from, to){ return (from||to) ? ((from?dashShortDate(from)+" "+from.slice(0,4):"start")+" – "+(to?dashShortDate(to)+" "+to.slice(0,4):"today")) : "All time"; }
function insightToSlack(ins){
  var c=ins.content||{}, out=["*Team QA insights — "+insightRangeLabel(ins.dateFrom, ins.dateTo)+"* ("+ins.auditCount+" audits)",""];
  [["What went well",c.wentWell],["What could be done better",c.improve]].forEach(function(sec){ if(!(sec[1]||[]).length) return;
    out.push("*"+sec[0]+"*"); sec[1].forEach(function(it){ out.push("", "*"+String(it.headline||"").trim()+"*", "• "+String(it.detail||"").trim()); }); out.push(""); });
  return out.join("\n").trim();
}
function insightToMarkdown(ins){
  var c=ins.content||{}, out=["# Team QA insights — "+insightRangeLabel(ins.dateFrom, ins.dateTo),"",
    "_"+ins.auditCount+" audits · generated "+new Date(ins.createdAt||Date.now()).toLocaleString()+" by "+(ins.createdBy||"")+(ins.matrixVersion?" · matrix v"+ins.matrixVersion:"")+"_",""];

// Reusable checkbox multi-select dropdown for the Fetch tab. Driven by a {value:true} map;
// "All" selected means no filter. Defined at module scope so its open state survives re-renders.
function FetchMultiSelect(props){
  var label=props.label, options=props.options||[], selected=props.selected||{}, onChange=props.onChange;
  var format=props.format||function(x){return x;};
  var sref=React.useRef(null);
  var os=React.useState(false), open=os[0], setOpen=os[1];
  React.useEffect(function(){
    if(!open) return;
    function onDoc(e){ if(sref.current && !sref.current.contains(e.target)) setOpen(false); }
    document.addEventListener("mousedown", onDoc);
    return function(){ document.removeEventListener("mousedown", onDoc); };
  },[open]);
  var chosen=options.filter(function(o){return selected[o];});
  var total=options.length, n=chosen.length;
  var summary = n===0 ? "None" : (n===total ? "All" : (n===1 ? format(chosen[0]) : n+" selected"));
  // v3.2.0 fix: the map always holds EVERY option (true/false). Before, "Clear" produced {} and ticking one value
  // gave {X:true} — which the "active filter" checks read as "all selected", so the filter silently did nothing.
  function setAll(v){ var m=Object.assign({},selected); options.forEach(function(o){ m[o]=!!v; }); onChange(m); }
  function toggle(o){ var m=Object.assign({},selected); options.forEach(function(x){ if(!(x in m)) m[x]=false; }); m[o]=!m[o]; onChange(m); }
  return (
    <div style={{position:"relative"}} ref={sref}>
      <label style={{...lbl,marginBottom:"4px"}}>{label}</label>
      <button onClick={function(){ setOpen(function(v){return !v;}); }}
        style={{width:"100%",boxSizing:"border-box",fontSize:"12px",padding:"6px 8px",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",background:"var(--color-background-primary)",textAlign:"left",cursor:"pointer",color:"var(--color-text-primary)",display:"flex",justifyContent:"space-between",alignItems:"center",gap:"6px"}}>
        <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{summary}</span>
        <span style={{fontSize:"10px",color:"var(--color-text-secondary)"}}>{open?"\u25be":"\u25b8"}</span>
      </button>
      {open&&(
        <div style={{position:"absolute",top:"100%",left:0,right:0,zIndex:200,minWidth:"220px",background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",boxShadow:"0 4px 12px rgba(0,0,0,0.15)",maxHeight:"280px",overflowY:"auto",marginTop:"2px"}}>
          <div style={{padding:"6px 8px",borderBottom:"0.5px solid var(--color-border-tertiary)",display:"flex",gap:"8px",position:"sticky",top:0,background:"var(--color-background-primary)"}}>
            <button onClick={function(){ setAll(true); }} style={{fontSize:"11px",padding:"2px 8px",background:"none",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",cursor:"pointer",color:"var(--color-text-secondary)"}}>All</button>
            <button onClick={function(){ setAll(false); }} style={{fontSize:"11px",padding:"2px 8px",background:"none",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",cursor:"pointer",color:"var(--color-text-secondary)"}}>Clear</button>
          </div>
          {options.map(function(o){
            return <label key={o} style={{display:"flex",alignItems:"center",gap:"8px",padding:"6px 10px",cursor:"pointer",fontSize:"12px",borderBottom:"0.5px solid var(--color-border-tertiary)"}}>
              <input type="checkbox" checked={!!selected[o]} onChange={function(){ toggle(o); }}/>
              <span style={{wordBreak:"break-word"}}>{format(o)}</span>
            </label>;
          })}
        </div>
      )}
    </div>
  );
}

  async function loginWithSession(token){
    setSsoLoading(true);
    var session=await verifySession(token);
    if(session){
      var em=session.email.toLowerCase().trim();
      dbg("login","session valid for "+em+" — loading users");

      // Session is server-valid — store the token now so the API calls made
      // during login authenticate. Removed below if the user turns out not to be authorized.
      sessionStorage.setItem("qa_session",token);
      setSessionToken(token);

      // Authoritative identity + role from the server (qa_users in Postgres)
      var me = null, meErr = null;
      try { me = await apiCall("/me"); } catch(e){ meErr = e; }
      if(meErr && meErr.status===503){
        sessionStorage.removeItem("qa_session"); setSessionToken("");
        setLoginError("Database unavailable: "+meErr.message); setSsoLoading(false); return;
      }
      var user = null;
      if(me && me.ok){
        user = {email:(me.email||em).toLowerCase(), name:me.name, role:me.role, active:me.active!==false, agentName:me.agentName||me.name||""};
      } else if(meErr && /inactive/i.test(meErr.message)) {
        user = {email:em, name:em.split("@")[0], active:false};
      }

      // Migration mode: until cutover is marked complete only Full users may sign in (read-only)
      if(user && me && me.migrationMode && user.role!=="full"){
        sessionStorage.removeItem("qa_session");
        setSessionToken("");
        setLoginBlocked({reason:"migrating", email:em, name:user.name});
        setSsoLoading(false);
        return;
      }
      if(user && user.active!==false) { await loadUsersFromDb(); setMigrationMode(!!(me&&me.migrationMode)); }

      // Not in DB at all
      if(!user){
        sessionStorage.removeItem("qa_session");
        setSessionToken("");
        setLoginBlocked({reason:"not_found", email:em});
        setSsoLoading(false);
        return;
      }

      // In DB but inactive
      if(user.active===false){
        sessionStorage.removeItem("qa_session");
        setSessionToken("");
        setLoginBlocked({reason:"inactive", email:em, name:user.name});
        setSsoLoading(false);
        return;
      }

      // Valid user — assign role and load
      var role      = user.role||"agent";
      var name      = user.name||(session.name||em.split("@")[0]);
      var agentName = user.agentName||user.name||"";
      var isAgent   = role==="agent"||role==="view";

      sessionStorage.setItem("qa_session",token);
      setSessionToken(token);
      setCurrentUser({email:em,name:name,role:role,agentName:agentName,picture:(me&&me.picture)||""}); // picture: Google profile photo when signed in via SSO (v3.1.0)
      var setup2=Object.assign({},DATA_SETUP,{_agentFilter:isAgent?agentName:""});
      setDataSetup(DATA_SETUP);
      setLoading(true);
      loadAllData(setup2);
    } else {
      sessionStorage.removeItem("qa_session");
      setSessionToken("");
      setLoginError("Session expired. Please sign in again.");
    }
    setSsoLoading(false);
  }

  function getWeekBounds(dateStr) {
    // Returns Mon 00:00 → Sun 23:59 of the week containing dateStr
    var d = new Date(dateStr);
    var day = d.getUTCDay(); // 0=Sun, 1=Mon...
    var diffToMon = (day===0) ? -6 : 1 - day;
    var mon = new Date(d);
    mon.setUTCDate(d.getUTCDate() + diffToMon);
    mon.setUTCHours(0,0,0,0);
    var sun = new Date(mon);
    sun.setUTCDate(mon.getUTCDate() + 6);
    sun.setUTCHours(23,59,59,999);
    return { start: mon.toISOString().slice(0,19), end: sun.toISOString().slice(0,19) };
  }

  async function findReplacementTicket(ticket, minMsg) {
    console.log("[Replace][1] Finding replacement for ticket #"+ticket.ticketId);
    console.log("[Replace][1] Agent:", ticket.agentName, "| Created:", ticket.createdDate||ticket.savedAt);

    var agentName = ticket.agentName||"";
    if(!agentName) { console.log("[Replace][1] No agent name — cannot find replacement"); return null; }

    var createdDate = ticket.createdDate||ticket.savedAt||new Date().toISOString();
    var week = getWeekBounds(createdDate);
    console.log("[Replace][1] Week bounds:", week.start, "→", week.end);

    var usedIds = new Set(
      tickets.map(function(t){return String(t.ticketId);})
             .concat(Array.from(deletedTicketIds))
    );
    console.log("[Replace][1] Excluding", usedIds.size, "already-audited/deleted IDs");

    var candidates = [];
    var cursor = null;
    var reachedCutoff = false;
    var pagesFetched = 0;
    var inWindow = false; // true once we've reached the target week

    while(!reachedCutoff) {
      // Fetch page with 429 retry
      var page = null;
      for(var attempt=0; attempt<5; attempt++) {
        try {
          var params = { limit: 30 };
          if(cursor) params.cursor = cursor;
          var resp = await gorgiasAPI("/tickets", params);
          if(resp._status === 429) {
            var wait = [10000,20000,40000,60000,120000][attempt];
            console.log("[Replace][2] 429 rate limit — waiting "+(wait/1000)+"s (attempt "+(attempt+1)+"/5)");
            setDeleteModal(function(d){return Object.assign({},d,{_status:"Rate limited by Gorgias — pausing "+(wait/1000)+"s..."});});
            await new Promise(function(r){setTimeout(r,wait);});
            continue;
          }
          page = resp;
          break;
        } catch(e) {
          if(attempt===4) throw e;
          await new Promise(function(r){setTimeout(r,3000*(attempt+1));});
        }
      }
      if(!page) break;

      var data = page.data||[];
      if(!data.length) break;
      pagesFetched++;

      // Quick scan: check if ALL tickets on this page are newer than week.end
      var allTooNew = data.every(function(t){
        var c = (t.created_datetime||"").slice(0,19);
        return c > week.end;
      });

      if(allTooNew) {
        // Skip entire page instantly — still burning through recent tickets
        var newest = (data[0].created_datetime||"").slice(0,10);
        console.log("[Replace][2] Page "+pagesFetched+" — all too new (newest: "+newest+"), skipping instantly");
        var nextCursor = (page.meta||{}).next_cursor||page.next_cursor;
        if(!nextCursor) break;
        cursor = nextCursor;
        // No delay — burn fast
        continue;
      }

      // We've reached the target window or gone past it
      inWindow = true;
      console.log("[Replace][2] Page "+pagesFetched+" — entered target window");

      for(var i=0; i<data.length; i++) {
        var t = data[i];
        var created = (t.created_datetime||"").slice(0,19);

        if(created > week.end) continue; // skip tickets newer than window on this mixed page
        if(created && created < week.start) { reachedCutoff = true; break; } // past the window

        // Must be same agent
        var au = t.assignee_user;
        var tAgent = au ? (au.name||((au.firstname||"")+" "+(au.lastname||"")).trim()) : "";
        if(tAgent.toLowerCase() !== agentName.toLowerCase()) {
          console.log("[Replace][2] Skip #"+t.id+" — wrong agent ('"+tAgent+"')");
          continue;
        }

        if(usedIds.has(String(t.id))) {
          console.log("[Replace][2] Skip #"+t.id+" — already audited or deleted");
          continue;
        }

        // Fetch message count
        console.log("[Replace][2] Checking msgs for #"+t.id+"...");
        try {
          var msgResp = null;
          for(var ma=0; ma<4; ma++) {
            var mr = await gorgiasAPI("/tickets/"+t.id+"/messages", {limit:100});
            if(mr && mr._status === 429) {
              var mwait = [5000,10000,20000,40000][ma];
              console.log("[Replace][2] msg 429 for #"+t.id+" — pausing "+(mwait/1000)+"s (attempt "+(ma+1)+"/4)");
              setDeleteModal(function(d){return Object.assign({},d,{_status:"Rate limited by Gorgias — pausing "+(mwait/1000)+"s..."});});
              await new Promise(function(r){setTimeout(r,mwait);});
              continue;
            }
            msgResp = mr; break;
          }
          if(!msgResp) { console.log("[Replace][2] #"+t.id+" — still rate-limited after retries, skipping"); await new Promise(function(r){setTimeout(r,500);}); continue; }
          var msgs = msgResp.data||[];
          var msgCount = msgs.length;
          console.log("[Replace][2] #"+t.id+" — "+msgCount+" msgs (min: "+minMsg+")");
          if(msgCount < minMsg) { console.log("[Replace][2] Skip — below min"); continue; }

          var transcript = buildTranscript(msgs);
          var crParts = parseTicketField(t, 9969);

          candidates.push({
            id: String(t.id),
            subject: t.subject||"(no subject)",
            agent: tAgent,
            created: created,
            msgCount: msgCount,
            crL1: crParts[0]||"",
            crL2: crParts[1]||"",
            transcript: transcript,
            ticketUrl: "https://"+((window.__ENV__&&window.__ENV__.GORGIAS_DOMAIN)||"freedomgrooming.gorgias.com")+"/app/ticket/"+t.id,
          });
          console.log("[Replace][2] ✓ Candidate found: #"+t.id+" ("+msgCount+" msgs) — stopping search");
          reachedCutoff = true; // stop fetching further pages
          break;             // stop processing this page
        } catch(e) {
          console.log("[Replace][2] Skip #"+t.id+" — msg fetch error:", e.message);
        }
        await new Promise(function(r){setTimeout(r,500);});
      }

      var nextCursor2 = (page.meta||{}).next_cursor||page.next_cursor;
      if(!nextCursor2||reachedCutoff) break;
      cursor = nextCursor2;
      // Inside window — use normal pacing to avoid rate limits
      if(inWindow) await new Promise(function(r){setTimeout(r,100);});
    }

    console.log("[Replace][2] Search complete. Pages fetched:", pagesFetched, "Candidates:", candidates.length);
    if(!candidates.length) return null;

    var picked = candidates[Math.floor(Math.random()*candidates.length)];
    console.log("[Replace][2] Selected:", picked.id);
    return picked;
  }

  async function scoreAndSaveReplacement(replacement, originalTicket) {
    console.log("[Replace][3] Scoring replacement ticket #"+replacement.id+"...");

    // Build ticket object matching batch QA format
    var auditor = originalTicket.auditor||originalTicket.reviewer||originalTicket.auditedBy||currentUser.name;
    // A replacement stands in for the ORIGINAL audit's slot, so it must inherit the original's
    // week — not derive its own from the replacement ticket's creation date. Delete & Replace
    // searches by agent without constraining created date, so a newer replacement would
    // otherwise land the audit in a future week (e.g. an audit replaced this week showing up
    // under "Aug 3 - Aug 9"), breaking Balance Audits counts and weekly reporting.
    var week = originalTicket.week || originalTicket.auditWeek || ticketWeekLabel(replacement.created) || ticketWeekLabel(new Date().toISOString().slice(0,10));

    var ticketObj = {
      ticketId:      replacement.id,
      ticketUrl:     replacement.ticketUrl,
      agentName:     replacement.agent,
      transcript:    replacement.transcript,
      subject:       replacement.subject,
      contactReason: replacement.crL1+(replacement.crL2?"::"+replacement.crL2:""),
      createdDate:   replacement.created.slice(0,10),
      customerEmail: "",
      reviewer:      auditor,
    };

    // Score via Claude Haiku (same as batch QA)
    var rawTxt = await callClaudeWithRetry(buildEvalPrompt(ticketObj));
    console.log("[Replace][3] Claude response received");
    var cleanTxt = rawTxt.replace(/```(?:json)?\s*/g,"").replace(/```/g,"").trim();
    var jsonMatch = cleanTxt.match(/\{[\s\S]+\}/);
    if(!jsonMatch) throw new Error("No JSON in Claude response");
    var parsed = JSON.parse(jsonMatch[0]);
    var sc = calcScore(parsed.scores||{}, matrix);
    var hasAF = (parsed.autofails||[]).length > 0;

    var newResult = {
      id:            Date.now(),
      week:          week,
      auditWeek:     week,
      reviewer:      auditor,
      agentName:     replacement.agent,
      ticketId:      String(replacement.id),
      ticketUrl:     replacement.ticketUrl,
      createdDate:   replacement.created.slice(0,10),
      contactReason: parsed.meta&&parsed.meta.contactReason||replacement.crL1,
      product:       parsed.meta&&parsed.meta.product||"",
      ticketResolution: parsed.meta&&parsed.meta.ticketResolution||"",
      scores:        parsed.scores||{},
      aiScores:      parsed.scores||{},
      autofails:     parsed.autofails||[],
      autofail:      hasAF,
      comments:      parsed.comments||"",
      totalPoints:   sc?sc.pts:0,
      maxPoints:     sc?sc.max:0,
      finalScore:    sc?sc.pct:0,
      aiScore:       sc?sc.pct:0,
      passed:        !hasAF&&(sc?sc.pct:0)>=85,
      hasDisputes:   false,
      disputes:      {},
      justifications:parsed.justifications||{},
      customerEmail: "",
      savedAt:       new Date().toISOString(),
      replacedFor:   String(originalTicket.ticketId), // audit trail
      ctfAsScored:   pickCtfTags(ticketObj),
    };

    console.log("[Replace][4] Saving replacement to database. Auditor:", auditor, "Passed:", newResult.passed);
    var savedR = await saveTicketToDb(newResult);
    if(savedR && savedR.id){ newResult.rowId = savedR.id; newResult.id = savedR.id; }
    setTickets(function(prev){return prev.concat([newResult]);});
    console.log("[Replace][4] Saved successfully (pageId:", newResult.rowId+")");
    return newResult;
  }

  async function proceedReaudit() {
    var rm = reauditModal;
    if(!rm) return;

    if(rm.step==="confirm") {
      // Step 1 — fetch messages from Gorgias
      console.log("[Reaudit][1] Fetching messages for ticket #"+rm.ticket.ticketId+"...");
      setReauditModal(function(r){return Object.assign({},r,{step:"fetching"});});
      try {
        var msgResp = await gorgiasAPI("/tickets/"+rm.ticket.ticketId+"/messages", {limit:100});
        var msgs = msgResp.data||[];
        var newCount = msgs.length;
        console.log("[Reaudit][1] Current msgs:", newCount, "| Original:", rm.ticket.messageCount);
        if(newCount <= (rm.ticket.messageCount||0)) {
          console.log("[Reaudit][1] No new messages — blocking re-audit");
          setReauditModal(function(r){return Object.assign({},r,{step:"noNewMsgs", newMsgCount:newCount});});
          return;
        }
        // New messages found — proceed to scoring
        console.log("[Reaudit][2] New messages found ("+newCount+" vs "+rm.ticket.messageCount+") — scoring...");
        setReauditModal(function(r){return Object.assign({},r,{step:"scoring", newMsgCount:newCount});});

        // Step 2 — build transcript and score
        var transcript = buildTranscript(msgs);
        // Pull the ticket itself so CTF tags (Product / Ticket Resolution / Contact Reason)
        // are available to the prompt. (v2 never persisted the raw tag values, so without
        // this re-fetch buildEvalPrompt would read undefined and print "not tagged" for every
        // re-audit — scoring CTF Accuracy down regardless of how the ticket was actually tagged.
        // Re-reading from Gorgias also means a tag corrected since the original audit is picked up.
        var raTags = {};
        try {
          var raTicket = await gorgiasAPI("/tickets/"+rm.ticket.ticketId);
          if(raTicket && !raTicket.error) {
            var raCr = parseTicketField(raTicket, FIELD_CR);
            var raProd = parseTicketField(raTicket, FIELD_PROD);
            var raRes = parseTicketField(raTicket, FIELD_RES);
            var raAdd = parseTicketField(raTicket, FIELD_ADDRES);
            raTags = {
              contactReasonL1: raCr[0], contactReasonL2: raCr[1],
              productL1: raProd[0], productL2: raProd[1],
              resolutionL1: raRes[0], resolutionL2: raRes[1],
              addResolutionL1: raAdd[0], addResolutionL2: raAdd[1]
            };
            console.log("[Reaudit][2] Tags refreshed — product:", raProd.join("::"), "| resolution:", raRes.join("::"));
          }
        } catch(tagErr) {
          // Non-fatal: fall through with no tags rather than blocking the re-audit outright.
          console.log("[Reaudit][2] Tag refresh failed, scoring without CTF tags:", tagErr.message);
        }
        var ticketObj = Object.assign({
          ticketId:      rm.ticket.ticketId,
          ticketUrl:     rm.ticket.ticketUrl,
          agentName:     rm.ticket.agentName,
          transcript:    transcript,
          subject:       rm.ticket.subject,
          contactReason: rm.ticket.contactReason,
          createdDate:   rm.ticket.createdDate,
          customerEmail: rm.ticket.customerEmail||"",
          reviewer:      rm.ticket.reviewer,
        }, raTags);
        var rawTxt = await callClaudeWithRetry(buildEvalPrompt(ticketObj));
        console.log("[Reaudit][2] Claude response received");
        var cleanTxt = rawTxt.replace(/```(?:json)?\s*/g,"").replace(/```/g,"").trim();
        var jsonMatch = cleanTxt.match(/\{[\s\S]+\}/);
        if(!jsonMatch) throw new Error("No JSON in Claude response");
        var parsed = JSON.parse(jsonMatch[0]);
        var sc = calcScore(parsed.scores||{}, matrix);
        var hasAF = (parsed.autofails||[]).length > 0;
        // Re-audit re-scores the SAME ticket, so its week must not change. Prefer the stored
        // week (preserves any manual correction) and only re-derive as a fallback.
        var week = rm.ticket.week || rm.ticket.auditWeek || ticketWeekLabel(rm.ticket.createdDate) || ticketWeekLabel(new Date().toISOString().slice(0,10));

        // Build reaudit history — carry forward existing + add current record
        var prevHistory = rm.ticket.reauditHistory||[];
        var newHistory = prevHistory.concat([{
          version: prevHistory.length+1,
          score:   rm.ticket.finalScore,
          passed:  !!(rm.ticket.disputedPassed!==undefined?rm.ticket.disputedPassed:rm.ticket.passed),
          messages: rm.ticket.messageCount,
          auditedAt: rm.ticket.savedAt ? rm.ticket.savedAt.slice(0,10) : "",
          auditor:   rm.ticket.reviewer,
        }]);

        var newRecord = {
          ticketId:      rm.ticket.ticketId,
          ticketUrl:     rm.ticket.ticketUrl,
          agentName:     rm.ticket.agentName,
          reviewer:      rm.ticket.reviewer,
          week:          week,
          createdDate:   rm.ticket.createdDate,
          contactReason: parsed.meta&&parsed.meta.contactReason||rm.ticket.contactReason,
          subject:       rm.ticket.subject,
          scores:        parsed.scores||{},
          aiScores:      parsed.scores||{},
          autofails:     parsed.autofails||[],
          autofail:      hasAF,
          comments:      parsed.comments||"",
          totalPoints:   sc?sc.pts:0,
          maxPoints:     sc?sc.max:0,
          finalScore:    sc?sc.pct:0,
          aiScore:       sc?sc.pct:0,
          passed:        !hasAF&&(sc?sc.pct:0)>=85,
          hasDisputes:   false,
          disputes:      {},
          justifications:parsed.justifications||{},
          customerEmail: rm.ticket.customerEmail||"",
          savedAt:       new Date().toISOString(),
          transcript:    transcript,
          messageCount:  newCount,
          agentMessageCount: countAssignedAgentMessages(msgs, null, rm.ticket.agentName),
          ctfAsScored:   pickCtfTags(ticketObj),
          reauditHistory:newHistory,
          auditType:     "Re-audit",
        };
        console.log("[Reaudit][3] Scoring complete. Score:", newRecord.finalScore, "Passed:", newRecord.passed);

        // Step 3 — archive old record (only after scoring succeeds)
        console.log("[Reaudit][4] Archiving original record (pageId:", rm.ticket.rowId+")...");
        if(rm.ticket.rowId) {
          await dbPatchTicket(rm.ticket.rowId,{
            deleted:      true,
            deletedBy:    currentUser.name,
            deletedAt:    new Date().toISOString(),
            deleteReason: "Re-audited on "+new Date().toISOString().slice(0,10)+" — "+newCount+" messages",
          });
        }
        console.log("[Reaudit][4] Archived. Saving new record...");

        // Step 4 — save new record
        var saved = await saveTicketToDb(newRecord);
        newRecord.rowId = saved.id;
        newRecord.id = saved.id;
        console.log("[Reaudit][5] Saved. New page ID:", saved.id);

        // Update local state — pass raw JSON strings so parseTicketRow reads them correctly
        setTickets(function(ts){
          return ts.filter(function(t){return t.rowId!==rm.ticket.rowId;})
                   .concat([parseTicketRow(Object.assign({pageId:saved.id},newRecord,{
                     scoresJSON:        JSON.stringify(newRecord.aiScores||newRecord.scores||{}),
                     justificationsJSON:JSON.stringify(newRecord.justifications||{}),
                     autofailsJSON:     JSON.stringify(newRecord.autofails||[]),
                     disputesJSON:      "{}",
                   }))]);
        });
        setDeletedTicketIds(function(prev){
          var next=new Set(prev);
          if(rm.ticket.ticketId) next.delete(String(rm.ticket.ticketId));
          return next;
        });

        setReauditModal(null);
        setReviewSelected(null);
        addToast("Ticket #"+rm.ticket.ticketId+" re-audited — "+newRecord.finalScore+"% ("+(newRecord.passed?"Pass":"Fail")+")");
        console.log("[Reaudit][6] Done.");
      } catch(e) {
        console.log("[Reaudit] Failed:", e.message, "— original record untouched");
        setReauditModal(function(r){return Object.assign({},r,{step:"error",error:e.message});});
      }
      return;
    }
  }

  async function handleDeleteProceed() {

    if(dm.step==="minMsg") {
      // Start search
      console.log("[Replace][1] Starting replacement search. Min msgs:", dm.minMsg);
      setDeleteModal(function(d){return Object.assign({},d,{step:"searching"});});
      try {
        var result = await findReplacementTicket(dm.ticket, parseInt(dm.minMsg)||4);
        if(!result) {
          console.log("[Replace][2] No replacement found — blocking delete");
          setDeleteModal(function(d){return Object.assign({},d,{step:"notFound"});});
        } else {
          console.log("[Replace][2] Replacement found:", result.id);
          setDeleteModal(function(d){return Object.assign({},d,{step:"found",replacement:result});});
        }
      } catch(e) {
        console.log("[Replace] Search failed:", e.message);
        setDeleteModal(function(d){return Object.assign({},d,{step:"error",error:"Search failed: "+e.message});});
      }
      return;
    }

    if(dm.step==="found") {
      // User confirmed replacement — score it
      console.log("[Replace][3] User confirmed replacement #"+dm.replacement.id+". Starting scoring...");
      setDeleteModal(function(d){return Object.assign({},d,{step:"scoring"});});
      try {
        await scoreAndSaveReplacement(dm.replacement, dm.ticket);
        // Scoring succeeded — NOW delete the original
        console.log("[Replace][5] Scoring succeeded. Deleting original ticket #"+dm.ticket.ticketId+"...");
        await deleteAuditDirectly(dm.ticket, "Replaced by ticket #"+dm.replacement.id);
        setDeleteModal(null);
