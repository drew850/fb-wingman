                {/* Rubric Gaps */}
                {(calibrationResult.rubricGaps||[]).length>0&&(
                  <div style={{...card,marginBottom:"12px"}}>
                    <p style={{...sectionLabel,marginBottom:"12px"}}>Rubric Gaps</p>
                    {(calibrationResult.rubricGaps||[]).map(function(g,i){
                      return <div key={i} style={{paddingBottom:"14px",marginBottom:"14px",borderBottom:"0.5px solid var(--color-border-tertiary)"}}>
                        <div style={{fontSize:"13px",fontWeight:600,marginBottom:"6px"}}>{g.category}</div>
                        <p style={{fontSize:"12px",color:"var(--color-text-secondary)",lineHeight:"1.6",marginBottom:"8px"}}><strong>Gap:</strong> {g.gap}</p>
                        <div style={{fontSize:"12px",background:"var(--color-background-success)",borderRadius:"var(--border-radius-md)",padding:"8px 12px",borderLeft:"3px solid var(--color-border-success)"}}>
                          <span style={{fontWeight:600,color:"var(--color-text-success)"}}>Suggested: </span>{g.suggestedCriteria}
                        </div>
                      </div>;
                    })}
                  </div>
                )}

                {/* Prompt Improvements */}
                {(calibrationResult.promptImprovements||[]).length>0&&(
                  <div style={{...card,marginBottom:"12px"}}>
                    <p style={{...sectionLabel,marginBottom:"12px"}}>Prompt Improvements</p>
                    {(calibrationResult.promptImprovements||[]).map(function(p,i){
                      return <div key={i} style={{paddingBottom:"14px",marginBottom:"14px",borderBottom:"0.5px solid var(--color-border-tertiary)"}}>
                        <div style={{fontSize:"13px",fontWeight:600,marginBottom:"8px"}}>{p.category}</div>
                        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"}}>
                          <div style={{background:"var(--color-background-danger)",borderRadius:"var(--border-radius-md)",padding:"8px 12px"}}>
                            <div style={{fontSize:"10px",fontWeight:700,color:"var(--color-text-danger)",marginBottom:"4px"}}>CURRENT</div>
                            <div style={{fontSize:"12px",color:"var(--color-text-primary)"}}>{p.current}</div>
                          </div>
                          <div style={{background:"var(--color-background-success)",borderRadius:"var(--border-radius-md)",padding:"8px 12px"}}>
                            <div style={{fontSize:"10px",fontWeight:700,color:"var(--color-text-success)",marginBottom:"4px"}}>SUGGESTED</div>
                            <div style={{fontSize:"12px",color:"var(--color-text-primary)"}}>{p.suggested}</div>
                          </div>
                        </div>
                      </div>;
                    })}
                  </div>
                )}

                {/* Quick Wins */}
                {(calibrationResult.quickWins||[]).length>0&&(
                  <div style={{...card,marginBottom:"12px"}}>
                    <p style={{...sectionLabel,marginBottom:"12px"}}>Quick Wins</p>
                    {(calibrationResult.quickWins||[]).map(function(q,i){
                      var impactCol=q.impact==="High"?"var(--color-text-danger)":q.impact==="Medium"?"var(--color-text-warning)":"var(--color-text-success)";
                      var impactBg=q.impact==="High"?"var(--color-background-danger)":q.impact==="Medium"?"var(--color-background-warning)":"var(--color-background-success)";
                      return <div key={i} style={{paddingBottom:"12px",marginBottom:"12px",borderBottom:"0.5px solid var(--color-border-tertiary)"}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}}>
                          <span style={{fontSize:"13px",fontWeight:600}}>{i+1}. {q.title}</span>
                          <span style={{fontSize:"10px",fontWeight:700,padding:"2px 8px",borderRadius:"10px",background:impactBg,color:impactCol}}>{q.impact} impact</span>
                        </div>
                        <p style={{fontSize:"12px",color:"var(--color-text-secondary)",lineHeight:"1.6",margin:0}}>{q.action}</p>
                      </div>;
                    })}
                  </div>
                )}

                {/* Agent Patterns */}
                {(calibrationResult.agentPatterns||[]).length>0&&(
                  <div style={card}>
                    <p style={{...sectionLabel,marginBottom:"12px"}}>Agent & Contact Reason Patterns</p>
                    {(calibrationResult.agentPatterns||[]).map(function(a,i){
                      return <div key={i} style={{paddingBottom:"12px",marginBottom:"12px",borderBottom:"0.5px solid var(--color-border-tertiary)"}}>
                        <p style={{fontSize:"12px",color:"var(--color-text-primary)",lineHeight:"1.6",marginBottom:"4px"}}>{a.finding}</p>
                        <p style={{fontSize:"12px",color:"var(--color-text-secondary)",fontStyle:"italic",margin:0}}>{a.implication}</p>
                      </div>;
                    })}
                  </div>
                )}
              </div>
            );
          })()}
        </div>
      )}

      {/* ── TEAM CALIBRATION TAB ── */}
      {view==="teamcal"&&isEditor&&(
        <div>
          <div style={{...card,marginBottom:"16px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <p style={{margin:"0 0 2px",fontSize:"15px",fontWeight:600}}>Team Calibration</p>
                <p style={{margin:0,fontSize:"12px",color:"var(--color-text-secondary)"}}>Blind inter-rater calibration — how consistently your auditors score the same tickets. Distinct from the AI-vs-dispute Calibration tab.</p>
              </div>
              <button onClick={loadTeamCalibRounds} style={{...btnInfo,fontSize:"12px"}}>{teamCalibRoundsLoading?"Loading...":"↺ Refresh"}</button>
            </div>
          </div>

          {isFullAccess&&(
            <div style={{...card,marginBottom:"16px"}}>
              <p style={{...sectionLabel,marginBottom:"10px"}}>Start New Round</p>
              {!calibPreview?(
                <div style={{display:"flex",gap:"10px",alignItems:"flex-end"}}>
                  <div>
                    <label style={{...lbl,marginBottom:"4px"}}>Week (any day in the target week)</label>
                    <input type="date" value={calibSetupWeek} onChange={function(e){setCalibSetupWeek(e.target.value);}} style={{fontSize:"12px",padding:"6px 8px",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)"}}/>
                  </div>
                  <button onClick={function(){
                    if(!calibSetupWeek){addToast("Pick a date","error");return;}
                    var monInst=mnlMondayInstant(new Date(calibSetupWeek+"T00:00:00+08:00").getTime());
                    generateCalibPreview(mnlWeekLabel(monInst));
                  }} disabled={calibGenerating} style={btnInfo}>{calibGenerating?"Building...":"Generate Preview"}</button>
                </div>
              ):(
                <div>
                  <p style={{fontSize:"13px",fontWeight:600,marginBottom:"8px"}}>{calibPreview.week} — {calibPreview.pool.length} ticket{calibPreview.pool.length!==1?"s":""} in the pool · {calibPreview.participants.length} auditor{calibPreview.participants.length!==1?"s":""} will review</p>

                    <p style={{fontSize:"12px",color:"var(--color-text-warning)",marginBottom:"10px"}}>No reviewed tickets this week for: {calibPreview.skipped.join(", ")} — they'll still review the pool, just won't contribute a ticket to it.</p>
                  )}
                  <div style={{border:"0.5px solid var(--color-border-tertiary)",borderRadius:"var(--border-radius-md)",overflow:"hidden",marginBottom:"12px"}}>
                    {calibPreview.pool.map(function(p,i){
                      return <div key={p.originalReviewerEmail} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",borderBottom:i<calibPreview.pool.length-1?"0.5px solid var(--color-border-tertiary)":"none"}}>
                        <div>
                          <span style={{fontSize:"12px",fontWeight:600}}>#{p.ticketId}</span>
                          <span style={{fontSize:"12px",color:"var(--color-text-secondary)"}}> · {p.agentName} · {p.contactReason} · originally reviewed by {p.originalReviewerName}</span>
                        </div>

                      </div>;
                    })}
                  </div>
                  <div style={{display:"flex",gap:"8px"}}>
                    <button onClick={confirmCalibRound} disabled={calibConfirming} style={btnSuccess}>{calibConfirming?"Creating...":"Confirm & Assign"}</button>
                    <button onClick={function(){setCalibPreview(null);}} style={ghost}>Cancel</button>
                  </div>
                </div>
              )}
            </div>
          )}

          <div style={{...card,marginBottom:"16px"}}>
            <p style={{...sectionLabel,marginBottom:"10px"}}>Rounds</p>
            {!teamCalibRoundsLoaded?(
              <p style={{fontSize:"13px",color:"var(--color-text-secondary)"}}>Click Refresh to load past rounds.</p>
            ):teamCalibRounds.length===0?(
              <p style={{fontSize:"13px",color:"var(--color-text-secondary)"}}>No calibration rounds yet.</p>
            ):(
              <div style={{border:"0.5px solid var(--color-border-tertiary)",borderRadius:"var(--border-radius-md)",overflow:"hidden"}}>
                {teamCalibRounds.map(function(r,i){
                  return <div key={r.pageId} onClick={function(){openTeamCalibRound(r.week);}} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px",borderBottom:i<teamCalibRounds.length-1?"0.5px solid var(--color-border-tertiary)":"none",cursor:"pointer",background:activeTeamCalibWeek===r.week?"var(--color-background-info)":"transparent"}}>
                    <span style={{fontSize:"13px",fontWeight:500}}>{r.week}</span>
                    <span style={{fontSize:"12px",color:"var(--color-text-secondary)"}}>{r.poolCount} ticket{r.poolCount!==1?"s":""} · {r.participants.length} auditors · {r.status}{r.insightsGeneratedAt?" ✓ insights":""}</span>
                  </div>;
                })}
              </div>
            )}
          </div>

          {teamCalibDetailLoading&&<p style={{fontSize:"13px",color:"var(--color-text-secondary)"}}>Loading round...</p>}

          {teamCalibDetail&&(
            <div>
              <div style={{...card,marginBottom:"16px"}}>
                <p style={{...sectionLabel,marginBottom:"10px"}}>My Calibration Queue — {teamCalibDetail.week}</p>
                {myCalibAssignments.length===0?(
                  <p style={{fontSize:"13px",color:"var(--color-text-secondary)"}}>No tickets assigned to you for this round.</p>
                ):(
                  <div>
                    <p style={{fontSize:"12px",color:"var(--color-text-secondary)",marginBottom:"10px"}}>{myCalibAssignments.filter(function(a){return a.status==="Complete";}).length} of {myCalibAssignments.length} complete</p>
                    <div style={{border:"0.5px solid var(--color-border-tertiary)",borderRadius:"var(--border-radius-md)",overflow:"hidden"}}>
                      {myCalibAssignments.map(function(a,i){
                        return <div key={a.pageId} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",borderBottom:i<myCalibAssignments.length-1?"0.5px solid var(--color-border-tertiary)":"none"}}>
                          <span style={{fontSize:"13px"}}>#{a.ticketId}</span>
                          <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                            <span style={{fontSize:"11px",fontWeight:600,padding:"2px 8px",borderRadius:"10px",background:a.status==="Complete"?"var(--color-background-success)":"var(--color-background-secondary)",color:a.status==="Complete"?"var(--color-text-success)":"var(--color-text-secondary)"}}>{a.status}</span>
                            <button onClick={function(){startCalibScoring(a);}} style={{...ghost,fontSize:"11px",padding:"3px 10px"}}>{a.status==="Complete"?"Edit":"Score"}</button>
                          </div>
                        </div>;
                      })}
                    </div>
                  </div>
                )}
              </div>

              {isFullAccess&&(
                <div style={{...card,marginBottom:"16px"}}>
                  <p style={{...sectionLabel,marginBottom:"10px"}}>Round Status — all auditors</p>
                  <p style={{fontSize:"12px",color:"var(--color-text-secondary)",marginBottom:"10px"}}>{allRoundAssignments.filter(function(a){return a.status==="Complete";}).length} of {allRoundAssignments.length} reviews complete</p>
                  <div style={{overflowX:"auto"}}>
                    <table style={{borderCollapse:"collapse",width:"100%",minWidth:(120+(teamCalibDetail.participants||[]).length*90)+"px"}}>
                      <thead>
                        <tr>
                          <th style={{textAlign:"left",padding:"6px 8px",fontSize:"11px",color:"var(--color-text-secondary)",fontWeight:600,borderBottom:"0.5px solid var(--color-border-tertiary)",position:"sticky",left:0,background:"var(--color-background-primary)"}}>Ticket</th>
                          {(teamCalibDetail.participants||[]).map(function(p){
                            return <th key={p.email} style={{textAlign:"center",padding:"6px 8px",fontSize:"11px",color:"var(--color-text-secondary)",fontWeight:600,borderBottom:"0.5px solid var(--color-border-tertiary)",whiteSpace:"nowrap"}}>{p.name}</th>;
                          })}
                        </tr>
                      </thead>
                      <tbody>
                        {(teamCalibDetail.pool||[]).map(function(t){
                          return <tr key={t.ticketId}>
                            <td style={{padding:"6px 8px",fontSize:"12px",fontWeight:600,borderBottom:"0.5px solid var(--color-border-tertiary)",whiteSpace:"nowrap",position:"sticky",left:0,background:"var(--color-background-primary)"}}>#{t.ticketId}</td>
                            {(teamCalibDetail.participants||[]).map(function(p){
                              if(p.email===t.originalReviewerEmail){
                                return <td key={p.email} title="No self-review" style={{textAlign:"center",padding:"6px 8px",fontSize:"12px",color:"var(--color-text-secondary)",borderBottom:"0.5px solid var(--color-border-tertiary)"}}>—</td>;
                              }
                              var a = allRoundAssignments.find(function(x){return String(x.ticketId)===String(t.ticketId)&&x.reviewerEmail===p.email;});
                              var status = a?a.status:"Pending";
                              return <td key={p.email} style={{textAlign:"center",padding:"6px 8px",borderBottom:"0.5px solid var(--color-border-tertiary)"}}>
                                <span style={{fontSize:"11px",fontWeight:600,padding:"2px 8px",borderRadius:"10px",background:status==="Complete"?"var(--color-background-success)":"var(--color-background-secondary)",color:status==="Complete"?"var(--color-text-success)":"var(--color-text-secondary)"}}>{status==="Complete"?"✓":"Pending"}</span>
                              </td>;
                            })}
                          </tr>;
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {isFullAccess&&(
                <div style={{...card,marginBottom:"16px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <p style={{...sectionLabel,margin:0}}>Calibrate</p>
                    <button onClick={function(){
                      if(window.confirm("Run calibration analysis now? This uses whatever reviews are currently complete — an incomplete round will produce a partial picture.")){
                        runTeamCalibration(teamCalibDetail.week);
                      }
                    }} disabled={teamCalibRunning} style={btnSuccess}>{teamCalibRunning?(teamCalibStatus||"Running..."):"Calibrate"}</button>
                  </div>
                </div>
              )}

              {teamCalibDetail.insights&&(
                <div style={{...card,marginBottom:"16px"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px"}}>
                    <p style={{...sectionLabel,margin:0}}>Insights</p>
                    <button onClick={function(){downloadTeamCalibDoc(teamCalibDetail.week, teamCalibDetail.insights);}} style={{...ghost,fontSize:"12px"}}>Export to Doc</button>
                  </div>
                  <div style={{marginBottom:"14px"}}>
                    <span style={{fontSize:"11px",fontWeight:700,textTransform:"uppercase",padding:"3px 10px",borderRadius:"10px",background:"var(--color-background-secondary)"}}>{teamCalibDetail.insights.summary&&teamCalibDetail.insights.summary.agreementRating} agreement</span>
                    <p style={{fontSize:"13px",color:"var(--color-text-primary)",marginTop:"8px"}}>{teamCalibDetail.insights.summary&&teamCalibDetail.insights.summary.overallAssessment}</p>
                  </div>
                  {(teamCalibDetail.insights.categoryAgreement||[]).length>0&&(
                    <div style={{marginBottom:"14px"}}>
                      <p style={{fontSize:"12px",fontWeight:600,marginBottom:"6px"}}>Category Agreement</p>
                      {teamCalibDetail.insights.categoryAgreement.map(function(c,i){
                        return <div key={i} style={{padding:"8px 0",borderBottom:"0.5px solid var(--color-border-tertiary)"}}>
                          <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontSize:"12px",fontWeight:600}}>{c.category}</span><span style={{fontSize:"11px",color:"var(--color-text-secondary)"}}>{c.agreementLevel}</span></div>
                          <p style={{fontSize:"12px",color:"var(--color-text-secondary)",margin:"4px 0 0"}}>{c.finding}</p>
                        </div>;
                      })}
                    </div>
                  )}
                  {(teamCalibDetail.insights.auditorLean||[]).length>0&&(
                    <div style={{marginBottom:"14px"}}>
                      <p style={{fontSize:"12px",fontWeight:600,marginBottom:"6px"}}>Auditor Tendencies</p>
                      {teamCalibDetail.insights.auditorLean.map(function(a,i){
                        return <div key={i} style={{padding:"8px 0",borderBottom:"0.5px solid var(--color-border-tertiary)"}}>
                          <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontSize:"12px",fontWeight:600}}>{a.reviewer}</span><span style={{fontSize:"11px",color:"var(--color-text-secondary)"}}>{a.tendency}</span></div>
                          <p style={{fontSize:"12px",color:"var(--color-text-secondary)",margin:"4px 0 0"}}>{a.evidence}</p>
                        </div>;
                      })}
                    </div>
                  )}
                  {(teamCalibDetail.insights.autofailAgreement||[]).length>0&&(
                    <div style={{marginBottom:"14px"}}>
                      <p style={{fontSize:"12px",fontWeight:600,marginBottom:"6px"}}>Autofail Agreement</p>
                      {teamCalibDetail.insights.autofailAgreement.map(function(af,i){
                        return <div key={i} style={{padding:"8px 0",borderBottom:"0.5px solid var(--color-border-tertiary)"}}>
                          <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontSize:"12px",fontWeight:600}}>#{af.ticketId}</span><span style={{fontSize:"11px",color:af.agreement==="Unanimous"?"var(--color-text-success)":"var(--color-text-warning)"}}>{af.agreement}</span></div>
                          <p style={{fontSize:"12px",color:"var(--color-text-secondary)",margin:"4px 0 0"}}>{af.details}</p>
                        </div>;
                      })}
                    </div>
                  )}
                  {(teamCalibDetail.insights.highDivergenceTickets||[]).length>0&&(
                    <div style={{marginBottom:"14px"}}>
                      <p style={{fontSize:"12px",fontWeight:600,marginBottom:"6px"}}>Highest-Divergence Tickets</p>
                      {teamCalibDetail.insights.highDivergenceTickets.map(function(d,i){
                        return <div key={i} style={{padding:"8px 0",borderBottom:"0.5px solid var(--color-border-tertiary)"}}>
                          <p style={{fontSize:"12px",fontWeight:600,margin:"0 0 2px"}}>#{d.ticketId} · {d.category}</p>
                          <p style={{fontSize:"12px",color:"var(--color-text-secondary)",margin:"0 0 2px"}}>{d.scores}</p>
                          <p style={{fontSize:"12px",color:"var(--color-text-secondary)",fontStyle:"italic",margin:0}}>{d.note}</p>
                        </div>;
                      })}
                    </div>
                  )}
                  {(teamCalibDetail.insights.recommendations||[]).length>0&&(
                    <div>
                      <p style={{fontSize:"12px",fontWeight:600,marginBottom:"6px"}}>Recommendations</p>
                      {teamCalibDetail.insights.recommendations.map(function(r,i){
                        return <div key={i} style={{padding:"8px 0",borderBottom:"0.5px solid var(--color-border-tertiary)"}}>
                          <p style={{fontSize:"12px",fontWeight:600,margin:"0 0 2px"}}>{r.area}{r.category?" — "+r.category:""}</p>
                          <p style={{fontSize:"12px",color:"var(--color-text-secondary)",margin:"0 0 2px"}}><strong>Issue:</strong> {r.issue}</p>
                          <p style={{fontSize:"12px",color:"var(--color-text-secondary)",margin:0}}><strong>Fix:</strong> {r.suggestedFix}</p>
                        </div>;
                      })}
                    </div>
                  )}
                </div>
              )}
            </div>
          )}

          {/* Blind scoring modal */}
          {calibScoringAssignment&&calibScoringTicket&&(
            <div style={{position:"fixed",inset:0,zIndex:1000,display:"flex",justifyContent:"center",alignItems:"flex-start",padding:"40px 20px",background:"rgba(0,0,0,0.4)",overflowY:"auto"}} onClick={function(e){if(e.target===e.currentTarget){setCalibScoringAssignment(null);setCalibScoringTicket(null);}}}>
              <div style={{background:"var(--color-background-primary)",borderRadius:"var(--border-radius-lg)",maxWidth:"720px",width:"100%",padding:"24px",maxHeight:"90vh",overflowY:"auto"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px"}}>
                  <div>
                    <p style={{margin:"0 0 2px",fontSize:"15px",fontWeight:600}}>Blind Score — #{calibScoringTicket.ticketId}</p>
                    <p style={{margin:0,fontSize:"12px",color:"var(--color-text-secondary)"}}>{calibScoringTicket.agentName} · {calibScoringTicket.contactReason}</p>
                  </div>
                  <button onClick={function(){setCalibScoringAssignment(null);setCalibScoringTicket(null);}} style={{...ghost,fontSize:"12px"}}>Close</button>
                </div>
                <div style={{padding:"8px 12px",background:"var(--color-background-info)",border:"0.5px solid var(--color-border-info)",borderRadius:"var(--border-radius-md)",fontSize:"11px",color:"var(--color-text-info)",marginBottom:"14px"}}>
                  This is a blind calibration review — you won't see the AI's score, the original auditor's score, or any other auditor's score until the round's insights are generated.
                </div>
                {calibScoringTicket.transcript&&(
                  <div style={{...card,marginBottom:"14px"}}>
                    <p style={{...sectionLabel,marginBottom:"8px"}}>Transcript</p>
                    <div style={{fontSize:"12px",lineHeight:"1.8",color:"var(--color-text-secondary)",maxHeight:"260px",overflowY:"auto"}}>
                      {calibScoringTicket.transcript.split(" | ").map(function(line,i){
                        var isAgent=line.startsWith("[Agent");
                        return <div key={i} style={{padding:"6px 10px",borderRadius:"var(--border-radius-md)",marginBottom:"4px",background:isAgent?"var(--color-background-secondary)":"var(--color-background-info)",color:isAgent?"var(--color-text-primary)":"var(--color-text-info)"}}>{line}</div>;
                      })}
                    </div>
                  </div>
                )}
                {matrix.map(function(c){
                  var draft = calibScoringDraft[c.id]||{level:"",justification:""};
                  return <div key={c.id} style={{...card,marginBottom:"12px"}}>
                    <p style={{fontSize:"13px",fontWeight:600,marginBottom:"6px"}}>{c.label}</p>
                    <select value={draft.level} onChange={function(e){updateCalibDraft(c.id,"level",e.target.value);}} style={{fontSize:"12px",padding:"5px 8px",width:"100%",marginBottom:"8px",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)"}}>
                      <option value="">Select...</option>

                    return (
                    <div style={{border:"0.5px solid var(--color-border-tertiary)",borderRadius:"var(--border-radius-lg)",padding:"16px",marginBottom:"20px"}}>
                      <p style={{margin:"0 0 4px",fontSize:"13px",fontWeight:600}}>Re-score with current matrix</p>
                      <p style={{margin:"0 0 12px",fontSize:"12px",color:"var(--color-text-secondary)",lineHeight:"1.55"}}>
                        Re-runs the full AI audit on saved audits using the saved matrix{matrixVersion?(" (v"+matrixVersion+")"):""}, exactly like {UI_LABELS.batch}.
                        Use it for audits scored with the wrong matrix. Disputes, manual autofails and auditor-edited notes are kept; the final score is recalculated on top of approved disputes.
                        Preview first — nothing is saved until you apply. Every change is logged to the audit's Reaudit History.
                      </p>
                      {matrixVersion==null&&<p style={{fontSize:"12px",color:"var(--color-text-danger)",margin:"0 0 10px"}}>No saved matrix yet — save the matrix first.</p>}
                      <div style={{display:"flex",gap:"16px",alignItems:"flex-end",flexWrap:"wrap",marginBottom:"10px"}}>
                        <div>
                          <label style={lbl}>Audits to re-score</label>
                          <div style={{display:"flex",gap:"12px",fontSize:"12px"}}>
                            <label style={{display:"flex",gap:"5px",alignItems:"center",cursor:"pointer"}}><input type="radio" checked={rsMode==="saved"} onChange={function(){setRsMode("saved");setRsPreview(null);}}/>Scored between</label>
                            <label style={{display:"flex",gap:"5px",alignItems:"center",cursor:"pointer"}}><input type="radio" checked={rsMode==="week"} onChange={function(){setRsMode("week");setRsPreview(null);}}/>Ticket week</label>
                          </div>
                        </div>
                        {rsMode==="saved" ? (
                          <div style={{display:"flex",gap:"6px",alignItems:"center"}}>
                            <input type="date" value={rsFrom} onChange={function(e){setRsFrom(e.target.value);setRsPreview(null);}} style={inp} aria-label="From"/>
                            <span style={{fontSize:"12px",color:"var(--color-text-secondary)"}}>to</span>
                            <input type="date" value={rsTo} onChange={function(e){setRsTo(e.target.value);setRsPreview(null);}} style={inp} aria-label="To"/>
                          </div>
                        ) : (
                          <select value={rsWeek} onChange={function(e){setRsWeek(e.target.value);setRsPreview(null);}} style={inp}>
                            <option value="">Select week...</option>
                            {[...new Set(tickets.map(function(t){return t.week;}).filter(Boolean))].sort().reverse().map(function(w){return <option key={w} value={w}>{w}</option>;})}
                          </select>
                        )}
                      </div>
                      <div style={{display:"flex",gap:"16px",flexWrap:"wrap",fontSize:"12px",marginBottom:"12px"}}>
                        <label style={{display:"flex",gap:"6px",alignItems:"center",cursor:"pointer"}}><input type="checkbox" checked={rsOnlyStale} onChange={function(e){setRsOnlyStale(e.target.checked);setRsPreview(null);}}/>Skip audits already scored with v{matrixVersion||"?"}</label>
                        <label style={{display:"flex",gap:"6px",alignItems:"center",cursor:"pointer"}}><input type="checkbox" checked={rsReopen} onChange={function(e){setRsReopen(e.target.checked);}}/>Reopen reviewed audits whose result changes</label>
                      </div>
                      <div style={{display:"flex",gap:"8px",alignItems:"center",marginBottom:"10px",flexWrap:"wrap"}}>
                        <button onClick={runRescorePreview} disabled={busy||!elig.length||matrixVersion==null}
                          style={{...btnInfo,fontSize:"12px",opacity:(busy||!elig.length||matrixVersion==null)?0.5:1}}>{rsRunning?"Re-scoring…":"Preview re-score"}</button>
                        {busy&&<button onClick={function(){rsStopRef.current=true;}} style={{...ghost,fontSize:"12px"}}>Stop</button>}
                        <span style={{fontSize:"12px",color:"var(--color-text-secondary)"}}>{elig.length} audit{elig.length!==1?"s":""} in scope · {elig.length} AI call{elig.length!==1?"s":""}</span>
                      </div>
                      {rsStatus&&<p style={{margin:"0 0 10px",fontSize:"11px",color:"var(--color-text-info)"}}>{rsStatus}</p>}
                      {P&&(
                        <div style={{marginTop:"6px"}}>
                          <div style={{display:"flex",gap:"14px",flexWrap:"wrap",fontSize:"12px",marginBottom:"8px"}}>
                            <span><strong>{changedItems.length}</strong> change</span>
                            <span style={{color:"var(--color-text-success)"}}><strong>{changedItems.filter(function(it){return it.newFinal>it.oldFinal;}).length}</strong> go up</span>
                            <span style={{color:"var(--color-text-danger)"}}><strong>{changedItems.filter(function(it){return it.newFinal<it.oldFinal;}).length}</strong> go down</span>
                            <span><strong>{P.items.filter(function(it){return !it.oldPassed&&it.newPassed;}).length}</strong> Fail → Pass</span>
                            <span style={{color:"var(--color-text-danger)"}}><strong>{P.items.filter(function(it){return it.oldPassed&&!it.newPassed;}).length}</strong> Pass → Fail</span>
                            <span style={{color:"var(--color-text-secondary)"}}><strong>{unchanged}</strong> unchanged</span>
                            {P.skipped.length>0&&<span style={{color:"var(--color-text-secondary)"}}><strong>{P.skipped.length}</strong> skipped</span>}
                            {P.errors.length>0&&<span style={{color:"var(--color-text-danger)"}}><strong>{P.errors.length}</strong> errors</span>}
                          </div>
                          {changedItems.length>0&&(
                            <div>
                              <div style={{display:"flex",gap:"6px",marginBottom:"6px",fontSize:"11px"}}>
                                <button onClick={function(){var s={};changedItems.forEach(function(it){s[it.t.rowId]=true;});setRsSelected(s);}} style={{...ghost,fontSize:"11px",padding:"3px 10px"}}>Select all changed</button>
                                <button onClick={function(){var s={};changedItems.forEach(function(it){if(it.newFinal>=it.oldFinal)s[it.t.rowId]=true;});setRsSelected(s);}} style={{...ghost,fontSize:"11px",padding:"3px 10px"}}>Only increases</button>
                                <button onClick={function(){setRsSelected({});}} style={{...ghost,fontSize:"11px",padding:"3px 10px"}}>Select none</button>
                              </div>
                              <div style={{overflowX:"auto",maxHeight:"420px",overflowY:"auto",border:"0.5px solid var(--color-border-tertiary)",borderRadius:"var(--border-radius-md)"}}>
                                <table style={{width:"100%",borderCollapse:"collapse",fontSize:"12px"}}>
                                  <thead style={{position:"sticky",top:0,background:"var(--color-background-secondary)"}}><tr>
                                    <th style={th}></th><th style={th}>Ticket</th><th style={th}>Agent</th><th style={th}>Final</th><th style={th}>Result</th><th style={th}>Categories changed</th><th style={th}>Notes</th>
                                  </tr></thead>
                                  <tbody>{changedItems.map(function(it){
                                    var up = it.newFinal>it.oldFinal, dn = it.newFinal<it.oldFinal;
                                    var flags = [];
                                    if(it.reviewed) flags.push(rsReopen?"reviewed — will reopen":"reviewed");
                                    if(it.pendingDisputes.length) flags.push(it.pendingDisputes.length+" pending dispute"+(it.pendingDisputes.length!==1?"s":""));
                                    if(it.t.autofailManual) flags.push("manual autofail kept");
                                    if(it.tagSource!=="as scored") flags.push("tags from current Gorgias");
                                    return <tr key={it.t.rowId}>
                                      <td style={td}><input type="checkbox" checked={!!rsSelected[it.t.rowId]} aria-label={"Apply #"+it.t.ticketId} onChange={function(e){var v=e.target.checked;setRsSelected(function(s){var n=Object.assign({},s);if(v)n[it.t.rowId]=true;else delete n[it.t.rowId];return n;});}}/></td>
                                      <td style={td}>#{it.t.ticketId}</td>
                                      <td style={{...td,whiteSpace:"nowrap"}}>{it.t.agentName}</td>
                                      <td style={{...td,whiteSpace:"nowrap",fontWeight:600,color:up?"var(--color-text-success)":dn?"var(--color-text-danger)":undefined}}>{it.oldFinal}% → {it.newFinal}%</td>
                                      <td style={{...td,whiteSpace:"nowrap"}}>{it.oldPassed===it.newPassed?(it.newPassed?"Pass":"Fail"):((it.oldPassed?"Pass":"Fail")+" → "+(it.newPassed?"Pass":"Fail"))}</td>
                                      <td style={td}>{it.changed.map(function(c){return c.label+": "+c.before+" → "+c.after;}).join("; ")||"—"}</td>
                                      <td style={{...td,color:"var(--color-text-secondary)"}}>{flags.join(" · ")}</td>
                                    </tr>;
                                  })}</tbody>
                                </table>
                              </div>
                            </div>
                          )}
                          {P.errors.length>0&&<p style={{fontSize:"11px",color:"var(--color-text-danger)",margin:"8px 0 0"}}>Errors: {P.errors.slice(0,8).map(function(e){return "#"+e.t.ticketId+" ("+e.why+")";}).join(", ")}{P.errors.length>8?"…":""}</p>}
                          <div style={{display:"flex",gap:"8px",marginTop:"12px",alignItems:"center"}}>
                            <button onClick={applyRescore} disabled={busy||!selCount} style={{...btnInfo,fontSize:"12px",opacity:(busy||!selCount)?0.5:1}}>{rsApplying?"Applying…":("Apply to "+selCount+" selected")}</button>
                            <button onClick={function(){setRsPreview(null);setRsSelected({});}} disabled={busy} style={{...ghost,fontSize:"12px"}}>Discard preview</button>
                          </div>
                        </div>
                      )}
                    </div>);
                  })()}
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {/* ── Re-audit Modal ── */}
      {reauditModal&&(
        <div style={{position:"fixed",inset:0,zIndex:2000,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px"}}>
          <div style={{background:"white",borderRadius:"16px",padding:"32px",width:"460px",maxWidth:"100%",boxShadow:"0 8px 32px rgba(0,0,0,0.18)"}}>

            {/* No message count on record */}
            {reauditModal.step==="noMsgCount"&&(<>
              <div style={{textAlign:"center",padding:"8px 0 16px"}}>
                <div style={{fontSize:"36px",marginBottom:"12px"}}>📋</div>
                <h3 style={{fontSize:"16px",fontWeight:600,margin:"0 0 10px",color:"var(--color-text-primary)"}}>Re-audit not available</h3>
                <p style={{fontSize:"13px",color:"var(--color-text-secondary)",lineHeight:"1.6",margin:"0 0 20px"}}>
                  Message count was not recorded for ticket <span style={{fontFamily:"var(--font-mono)",fontWeight:600}}>#{reauditModal.ticket.ticketId}</span> at the time of the original audit. Re-audit is only available for tickets audited after this feature was added.
                </p>
                <button onClick={function(){setReauditModal(null);}} style={{...ghost,padding:"10px 24px",fontSize:"13px"}}>Close</button>
              </div>
            </>)}

            {/* Confirm */}
            {reauditModal.step==="confirm"&&(<>
              <h3 style={{fontSize:"16px",fontWeight:600,margin:"0 0 6px",color:"var(--color-text-primary)"}}>Re-audit ticket?</h3>
              <p style={{fontSize:"12px",color:"var(--color-text-secondary)",margin:"0 0 18px"}}>
                The latest transcript will be fetched from Gorgias and scored fresh. Existing disputes will not carry over.
              </p>
              <div style={{background:"var(--color-background-secondary)",borderRadius:"var(--border-radius-md)",padding:"14px 16px",marginBottom:"20px",border:"0.5px solid var(--color-border-tertiary)"}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:"4px"}}>
                  <span style={{fontFamily:"var(--font-mono)",fontWeight:700,color:"var(--color-text-info)",fontSize:"13px"}}>#{reauditModal.ticket.ticketId}</span>
                  <span style={{fontSize:"11px",color:"var(--color-text-secondary)"}}>{reauditModal.ticket.messageCount} messages on record</span>
                </div>
                <div style={{fontSize:"12px",color:"var(--color-text-primary)",fontWeight:500,marginBottom:"4px"}}>{reauditModal.ticket.agentName}</div>
                <div style={{fontSize:"11px",color:"var(--color-text-secondary)"}}>
                  Score: {reauditModal.ticket.finalScore}% ({(reauditModal.ticket.disputedPassed!==undefined?reauditModal.ticket.disputedPassed:reauditModal.ticket.passed)?"Pass":"Fail"})
                  {reauditModal.ticket.reviewer&&<span> · Auditor: {reauditModal.ticket.reviewer}</span>}
                  {reauditModal.ticket.savedAt&&<span> · Audited: {reauditModal.ticket.savedAt.slice(0,10)}</span>}
                </div>
              </div>
              <div style={{display:"flex",gap:"10px"}}>
                <button onClick={proceedReaudit} style={{...btnInfo,padding:"10px 24px",fontSize:"13px",flex:1}}>Re-audit</button>
                <button onClick={function(){setReauditModal(null);}} style={{...ghost,padding:"10px 24px",fontSize:"13px"}}>Cancel</button>
              </div>
            </>)}

            {/* Fetching */}
            {reauditModal.step==="fetching"&&(<>
              <div style={{textAlign:"center",padding:"16px 0"}}>
                <div style={{width:"28px",height:"28px",border:"3px solid var(--color-border-info)",borderTop:"3px solid var(--color-text-info)",borderRadius:"50%",animation:"spin 0.8s linear infinite",margin:"0 auto 16px"}}/>
                <p style={{fontSize:"14px",fontWeight:500,color:"var(--color-text-primary)",margin:"0 0 6px"}}>Fetching latest transcript...</p>
                <p style={{fontSize:"12px",color:"var(--color-text-secondary)",margin:0}}>Checking Gorgias for new messages on ticket #{reauditModal.ticket.ticketId}</p>
              </div>
            </>)}

            {/* No new messages */}
            {reauditModal.step==="noNewMsgs"&&(<>
              <div style={{textAlign:"center",padding:"8px 0 16px"}}>
                <div style={{fontSize:"36px",marginBottom:"12px"}}>💬</div>
                <h3 style={{fontSize:"16px",fontWeight:600,margin:"0 0 10px",color:"var(--color-text-primary)"}}>No new messages</h3>
                <p style={{fontSize:"13px",color:"var(--color-text-secondary)",lineHeight:"1.6",margin:"0 0 8px"}}>
                  Ticket <span style={{fontFamily:"var(--font-mono)",fontWeight:600}}>#{reauditModal.ticket.ticketId}</span> still has <strong>{reauditModal.newMsgCount}</strong> messages — same as the last audit.
                </p>
                <p style={{fontSize:"12px",fontWeight:600,color:"var(--color-text-warning)",margin:"0 0 20px"}}>Re-audit is only available when new messages exist.</p>
                <button onClick={function(){setReauditModal(null);}} style={{...ghost,padding:"10px 24px",fontSize:"13px"}}>Close</button>
              </div>
            </>)}

            {/* Scoring */}
            {reauditModal.step==="scoring"&&(<>
              <div style={{textAlign:"center",padding:"16px 0"}}>
                <div style={{width:"28px",height:"28px",border:"3px solid var(--color-border-success)",borderTop:"3px solid var(--color-text-success)",borderRadius:"50%",animation:"spin 0.8s linear infinite",margin:"0 auto 16px"}}/>
                <p style={{fontSize:"14px",fontWeight:500,color:"var(--color-text-primary)",margin:"0 0 6px"}}>Scoring updated transcript...</p>
                <p style={{fontSize:"12px",color:"var(--color-text-secondary)",margin:"0 0 4px"}}>
                  Found {reauditModal.newMsgCount} messages ({reauditModal.newMsgCount - (reauditModal.ticket.messageCount||0)} new)
                </p>
                <p style={{fontSize:"11px",color:"var(--color-text-secondary)",margin:0,fontStyle:"italic"}}>Original audit has not been changed yet.</p>
              </div>
            </>)}

            {/* Error */}
            {reauditModal.step==="error"&&(<>
              <div style={{textAlign:"center",padding:"8px 0 16px"}}>
                <div style={{fontSize:"36px",marginBottom:"12px"}}>⚠️</div>
                <h3 style={{fontSize:"16px",fontWeight:600,margin:"0 0 8px",color:"var(--color-text-danger)"}}>Re-audit failed</h3>
                {(reauditModal.error&&(reauditModal.error.includes("502")||reauditModal.error.includes("503")||reauditModal.error.includes("504")||reauditModal.error.includes("upstream error")))?
                  <p style={{fontSize:"13px",color:"var(--color-text-secondary)",margin:"0 0 8px",lineHeight:"1.6"}}>Scoring timed out — the AI service took too long to respond. You can try again safely.</p>
                :
                  <p style={{fontSize:"13px",color:"var(--color-text-secondary)",margin:"0 0 8px",lineHeight:"1.6"}}>{reauditModal.error}</p>
                }
                <p style={{fontSize:"12px",fontWeight:600,color:"var(--color-text-warning)",margin:"0 0 20px"}}>Original audit was not changed.</p>
                <div style={{display:"flex",gap:"10px",justifyContent:"center"}}>
                  {(reauditModal.error&&(reauditModal.error.includes("502")||reauditModal.error.includes("503")||reauditModal.error.includes("504")||reauditModal.error.includes("upstream error")))&&
                    <button onClick={function(){setReauditModal(function(r){return Object.assign({},r,{step:"scoring",error:""});});proceedReaudit();}} style={{...btnSuccess,padding:"10px 24px",fontSize:"13px"}}>Try Again</button>
                  }
                  <button onClick={function(){setReauditModal(null);}} style={{...ghost,padding:"10px 24px",fontSize:"13px"}}>Close</button>
                </div>
              </div>
            </>)}

          </div>
        </div>
      )}

      {/* ── Delete & Replace Modal ── */}
      {deleteModal&&(
        <div style={{position:"fixed",inset:0,zIndex:2000,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px"}}>
          <div style={{background:"white",borderRadius:"16px",padding:"32px",width:"460px",maxWidth:"100%",boxShadow:"0 8px 32px rgba(0,0,0,0.18)"}}>

            {/* Step 0 — Intent */}
            {deleteModal.step==="intent"&&(<>
              <h3 style={{fontSize:"16px",fontWeight:600,margin:"0 0 8px",color:"var(--color-text-primary)"}}>Delete audit</h3>
              <p style={{fontSize:"13px",color:"var(--color-text-secondary)",margin:"0 0 24px"}}>
                Ticket <span style={{fontFamily:"var(--font-mono)",fontWeight:600}}>#{deleteModal.ticket.ticketId}</span> · {deleteModal.ticket.agentName||"Unknown agent"}
              </p>
              <div style={{display:"flex",flexDirection:"column",gap:"10px"}}>
                <button onClick={function(){setDeleteModal(function(d){return Object.assign({},d,{step:"minMsg"});});}}
                  style={{...btnInfo,padding:"11px",fontSize:"13px",textAlign:"left",display:"flex",flexDirection:"column",gap:"2px"}}>
                  <span style={{fontWeight:600}}>Delete &amp; Replace</span>
                  <span style={{fontSize:"11px",opacity:0.8}}>Find a new ticket from the same agent and week, score it automatically</span>
                </button>
                <button onClick={function(){var t=deleteModal.ticket;setDeleteModal(null);deleteAuditDirectly(t);}}
                  style={{...ghost,padding:"11px",fontSize:"13px",color:"var(--color-text-danger)",borderColor:"var(--color-border-danger)",textAlign:"left"}}>
                  <span style={{fontWeight:600}}>Delete only</span>
                </button>
                <button onClick={function(){setDeleteModal(null);}} style={{...ghost,padding:"11px",fontSize:"13px"}}>Cancel</button>
              </div>
            </>)}

            {/* Step 1 — Min message count */}
            {deleteModal.step==="minMsg"&&(<>
              <h3 style={{fontSize:"16px",fontWeight:600,margin:"0 0 8px",color:"var(--color-text-primary)"}}>Replacement criteria</h3>
              <p style={{fontSize:"13px",color:"var(--color-text-secondary)",margin:"0 0 20px"}}>
                Searching for tickets from <strong>{deleteModal.ticket.agentName}</strong> during the same week with at least:
              </p>
              <label style={{...lbl,marginBottom:"6px"}}>Minimum message count</label>
              <input type="number" min="1" step="1"
                value={deleteModal.minMsg}
                onChange={function(e){var v=e.target.value.replace(/[^0-9]/g,"");setDeleteModal(function(d){return Object.assign({},d,{minMsg:v||"1"});});}}
                style={{width:"100%",boxSizing:"border-box",fontSize:"14px",padding:"9px 12px",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",marginBottom:"20px"}}
                autoFocus/>
              <div style={{display:"flex",gap:"10px"}}>
                <button onClick={handleDeleteProceed} style={{...btnInfo,padding:"10px 24px",fontSize:"13px",flex:1}}>Search</button>
                <button onClick={function(){setDeleteModal(null);}} style={{...ghost,padding:"10px 24px",fontSize:"13px"}}>Cancel</button>
              </div>
            </>)}

            {/* Searching */}
            {deleteModal.step==="searching"&&(<>
              <div style={{textAlign:"center",padding:"16px 0"}}>
                <div style={{width:"28px",height:"28px",border:"3px solid var(--color-border-info)",borderTop:"3px solid var(--color-text-info)",borderRadius:"50%",animation:"spin 0.8s linear infinite",margin:"0 auto 16px"}}/>
                <p style={{fontSize:"14px",fontWeight:500,color:"var(--color-text-primary)",margin:"0 0 6px"}}>Searching Gorgias...</p>
                <p style={{fontSize:"12px",color:"var(--color-text-secondary)",margin:"0 0 4px"}}>
                  {deleteModal._status||("Looking for "+deleteModal.ticket.agentName+" tickets the week of "+getWeekBounds(deleteModal.ticket.createdDate||new Date().toISOString()).start.slice(0,10))}
                </p>
                <p style={{fontSize:"11px",color:"var(--color-text-secondary)",margin:0,fontStyle:"italic"}}>Skipping recent pages to reach your date range — this may take a moment</p>
              </div>
            </>)}

            {/* Not found */}
            {deleteModal.step==="notFound"&&(<>
              <div style={{textAlign:"center",padding:"8px 0 16px"}}>
                <div style={{fontSize:"36px",marginBottom:"12px"}}>🔍</div>
                <h3 style={{fontSize:"16px",fontWeight:600,margin:"0 0 8px",color:"var(--color-text-primary)"}}>No replacement found</h3>
                <p style={{fontSize:"13px",color:"var(--color-text-secondary)",margin:"0 0 20px",lineHeight:"1.6"}}>
                  No eligible tickets found for <strong>{deleteModal.ticket.agentName}</strong> this week with ≥{deleteModal.minMsg} messages that haven't already been audited or deleted.
                </p>
                <p style={{fontSize:"12px",color:"var(--color-text-warning)",margin:"0 0 20px",fontWeight:600}}>
                  Ticket #{deleteModal.ticket.ticketId} was not deleted.
                </p>
                <button onClick={function(){setDeleteModal(null);}} style={{...ghost,padding:"10px 24px",fontSize:"13px"}}>Close</button>
              </div>
            </>)}

            {/* Found — confirm */}
            {deleteModal.step==="found"&&deleteModal.replacement&&(<>
              <h3 style={{fontSize:"16px",fontWeight:600,margin:"0 0 6px",color:"var(--color-text-primary)"}}>Replacement found</h3>
              <p style={{fontSize:"12px",color:"var(--color-text-secondary)",margin:"0 0 16px"}}>Review the replacement ticket before confirming.</p>
              <div style={{background:"var(--color-background-secondary)",borderRadius:"var(--border-radius-md)",padding:"14px 16px",marginBottom:"20px",border:"0.5px solid var(--color-border-tertiary)"}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:"6px"}}>
                  <span style={{fontFamily:"var(--font-mono)",fontWeight:700,color:"var(--color-text-info)",fontSize:"13px"}}>#{deleteModal.replacement.id}</span>
                  <span style={{fontSize:"11px",color:"var(--color-text-secondary)"}}>{deleteModal.replacement.msgCount} messages</span>
                </div>
                <div style={{fontSize:"12px",color:"var(--color-text-primary)",marginBottom:"4px",fontWeight:500}}>{deleteModal.replacement.subject}</div>
                <div style={{fontSize:"11px",color:"var(--color-text-secondary)"}}>
                  {deleteModal.replacement.agent} · Created {deleteModal.replacement.created.slice(0,10)}
                  {deleteModal.replacement.crL1&&<span> · {deleteModal.replacement.crL1}{deleteModal.replacement.crL2&&"::"+deleteModal.replacement.crL2}</span>}
                </div>
              </div>
              <div style={{display:"flex",gap:"10px"}}>
                <button onClick={handleDeleteProceed} style={{...btnSuccess,padding:"10px 24px",fontSize:"13px",flex:1}}>
                  Confirm &amp; Score
                </button>
                <button onClick={function(){setDeleteModal(null);}} style={{...ghost,padding:"10px 24px",fontSize:"13px"}}>Cancel</button>
              </div>
              <p style={{fontSize:"11px",color:"var(--color-text-secondary)",marginTop:"10px",marginBottom:0}}>
                Original ticket #{deleteModal.ticket.ticketId} will only be deleted after scoring succeeds.
              </p>
            </>)}

            {/* Scoring */}
            {deleteModal.step==="scoring"&&(<>
              <div style={{textAlign:"center",padding:"16px 0"}}>
                <div style={{width:"28px",height:"28px",border:"3px solid var(--color-border-success)",borderTop:"3px solid var(--color-text-success)",borderRadius:"50%",animation:"spin 0.8s linear infinite",margin:"0 auto 16px"}}/>
                <p style={{fontSize:"14px",fontWeight:500,color:"var(--color-text-primary)",margin:"0 0 6px"}}>Scoring replacement...</p>
                <p style={{fontSize:"12px",color:"var(--color-text-secondary)",margin:"0 0 4px"}}>
                  Ticket #{deleteModal.replacement&&deleteModal.replacement.id}
                </p>
                <p style={{fontSize:"11px",color:"var(--color-text-secondary)",margin:0}}>
                  Original ticket #{deleteModal.ticket.ticketId} has not been deleted yet.
                </p>
              </div>
            </>)}

            {/* Error */}
            {deleteModal.step==="error"&&(<>
              <div style={{textAlign:"center",padding:"8px 0 16px"}}>
                <div style={{fontSize:"36px",marginBottom:"12px"}}>⚠️</div>
                <h3 style={{fontSize:"16px",fontWeight:600,margin:"0 0 8px",color:"var(--color-text-danger)"}}>Something went wrong</h3>
                {(deleteModal.error&&(deleteModal.error.includes("502")||deleteModal.error.includes("503")||deleteModal.error.includes("504")||deleteModal.error.includes("upstream error")))?
                  <p style={{fontSize:"13px",color:"var(--color-text-secondary)",margin:"0 0 8px",lineHeight:"1.6"}}>Scoring timed out — the AI service took too long to respond. You can try again safely.</p>
                :
                  <p style={{fontSize:"13px",color:"var(--color-text-secondary)",margin:"0 0 8px",lineHeight:"1.6"}}>{deleteModal.error}</p>
                }
                <p style={{fontSize:"12px",fontWeight:600,color:"var(--color-text-warning)",margin:"0 0 20px"}}>
                  Ticket #{deleteModal.ticket.ticketId} was not deleted.
                </p>
                <div style={{display:"flex",gap:"10px",justifyContent:"center"}}>
                  {(deleteModal.error&&(deleteModal.error.includes("502")||deleteModal.error.includes("503")||deleteModal.error.includes("504")||deleteModal.error.includes("upstream error")))&&deleteModal.replacement&&
                    <button onClick={function(){setDeleteModal(function(d){return Object.assign({},d,{step:"found",error:""});});handleDeleteProceed();}} style={{...btnSuccess,padding:"10px 24px",fontSize:"13px"}}>Try Again</button>
                  }
                  <button onClick={function(){setDeleteModal(null);}} style={{...ghost,padding:"10px 24px",fontSize:"13px"}}>Close</button>
                </div>
              </div>
            </>)}

          </div>
        </div>
      )}

            </div>{/* /wm-page */}
          </div>{/* /wm-content */}
        </div>{/* /wm-canvas */}
      </main>

      {/* Toasts */}
      <div style={{position:"fixed",bottom:"24px",right:"24px",display:"flex",flexDirection:"column",gap:"8px",zIndex:9999,pointerEvents:"none"}}>
        {toasts.map(function(t){
          var tone=t.type==="error"?T.red:t.type==="warning"?T.amber:T.green;
          return <div key={t.id} style={{background:tone.bg,border:"1px solid "+tone.border,borderLeft:"3px solid "+tone.text,borderRadius:"var(--border-radius-md)",padding:"10px 18px",fontSize:"12px",fontWeight:600,color:tone.text,animation:"toastIn 0.15s ease",whiteSpace:"nowrap"}}>{t.msg}</div>;
        })}
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
