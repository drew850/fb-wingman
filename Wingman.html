  async function runQAOnFetched(downloadCSV) {
    if(!fetchedTickets.length) return;
    if(downloadCSV) downloadFetchedCSV();
    // Map fetched tickets to QA batch format and start batch QA
    var mapped = fetchedTickets.map(mapFetchedToQA);
    // Auto-assign evenly across all Full+Edit users (round-robin), same as the CSV upload path,
    // so each auditor gets the same number of tickets as much as possible (counts differ by <=1).
    var assignable = assignableAuditors().map(function(u){return u.name;});
    if(assignable.length>0){
      mapped = mapped.map(function(t,i){return Object.assign({},t,{reviewer:assignable[i%assignable.length]});});
    }
    setBatchTickets(mapped);
    setView("batch");
    addToast(assignable.length>0
      ? ("Loaded "+mapped.length+" tickets into "+UI_LABELS.batch+" — auto-assigned across "+assignable.length+" reviewer"+(assignable.length!==1?"s":""))
      : ("Loaded "+mapped.length+" tickets into "+UI_LABELS.batch+" — ready to score")); // UI label (was "Batch QA")
  }

  // ── MANUAL AUDIT (v3.2.0) ────────────────────────────────────────────────────
  // One input: the ticket ID. "Load from Gorgias" pulls the ticket + messages the same way Batch Fetch
  // does, and scoring uses the SAME prompt and result shape as AI Audit (buildEvalPrompt / calcScore),
  // so a manual audit is graded exactly like a batch audit — CTF tags, scoring context and autofails
  // included. The pre-v3.2.0 manual prompt only saw a free-text contact reason.
  async function gorgiasGetWithBackoff(path, params, label){
    var waits=[5000,10000,20000,40000];
    for(var a=0;a<=waits.length;a++){
      var r = await gorgiasAPI(path, params);
      if(!(r && r._status===429)) return r;
      if(a===waits.length) break;
      setManualStatus("Gorgias rate limit — retrying "+label+" in "+(waits[a]/1000)+"s…");
      await new Promise(function(res){setTimeout(res,waits[a]);});
    }
    throw new Error("Gorgias kept rate-limiting — try again in a minute");
  }
  async function loadManualFromGorgias(){
    var tid = String(manualTicketId||"").replace(/[^0-9]/g,"");
    if(!tid){ addToast("Enter a Gorgias ticket ID","error"); return; }
    setManualLoading(true); setManualLoaded(null); setManualResult(null); setManualAgentOverride(""); setManualStatus("Loading #"+tid+" from Gorgias…");
    try{
      var t = await gorgiasGetWithBackoff("/tickets/"+tid, null, "ticket");
      if(!t || t.error || !t.id) throw new Error("Ticket #"+tid+" not found in Gorgias");
      var agentName="", agentId=null, agentEmail="";
      if(t.assignee_user){ var au=t.assignee_user;
        agentName = normalizeAgentName(au.name || ((au.firstname||"")+" "+(au.lastname||"")).trim());
        agentId = au.id!=null ? String(au.id) : null; agentEmail = (au.email||"").toLowerCase().trim(); }
      setManualStatus("Loading messages…");
      var mr = await gorgiasGetWithBackoff("/tickets/"+tid+"/messages", {limit:100}, "messages");
      var msgs = (mr && mr.data) || [];
      var transcript = buildTranscript(msgs);
      var crP=parseTicketField(t,FIELD_CR), prP=parseTicketField(t,FIELD_PROD), rsP=parseTicketField(t,FIELD_RES), adP=parseTicketField(t,FIELD_ADDRES);
      var row = {
        ticket_id: String(tid),
        ticket_url: "https://"+((window.__ENV__&&window.__ENV__.GORGIAS_DOMAIN)||"freedomgrooming.gorgias.com")+"/app/ticket/"+tid,
        subject: t.subject||"(no subject)", status: t.status||"", initial_channel: t.channel||t.via||"",
        created_date: (t.created_datetime||"").slice(0,10), closed_date: (t.closed_datetime||"").slice(0,10),
        agent: agentName, customer_email: (t.customer&&t.customer.email)||"",
        contact_reason_l1: crP[0], contact_reason_l2: crP[1], product_l1: prP[0], product_l2: prP[1],
        ticket_resolution_l1: rsP[0], ticket_resolution_l2: rsP[1], additional_resolution_l1: adP[0], additional_resolution_l2: adP[1],
        message_count: msgs.length, agent_message_count: countAssignedAgentMessages(msgs, agentId, agentName), transcript: transcript
      };
      var mapped = mapRow(row);
      var warnings = [];
      if(!transcript || transcript.trim().length<20) warnings.push("No usable transcript on this ticket — it can't be scored.");
      if(!agentName) warnings.push("No agent is assigned in Gorgias — pick the agent below.");
      if(agentName && isExcludedAssignee(agentEmail, agentName)) warnings.push(agentName+" is flagged “Exclude Their Tickets”. Batch runs skip them; you can still audit manually.");
      var prior = (tickets||[]).filter(function(x){ return String(x.ticketId)===String(tid) && !x.deleted; });
      if(prior.length) warnings.push("Already audited ("+prior.length+"×, latest by "+(prior[0].reviewer||"?")+"). Running again adds another audit.");
      if(deletedTicketIds.has(String(tid))) warnings.push("A previous audit of this ticket was deleted.");
      setManualLoaded({ticket:mapped, warnings:warnings, alreadyAudited:prior.length>0, noTranscript:!transcript||transcript.trim().length<20});
      setManualStatus("");
    } catch(e){ setManualStatus(""); addToast(e.message,"error"); }
    setManualLoading(false);
  }
  async function runManualAudit() {
    if(!manualLoaded || manualLoaded.noTranscript) return;
    var ticket = Object.assign({}, manualLoaded.ticket);
    if(!ticket.agentName) ticket.agentName = manualAgentOverride;
    if(!ticket.agentName){ addToast("Pick the agent first","error"); return; }
    if(manualLoaded.alreadyAudited && !window.confirm("Ticket #"+ticket.ticketId+" was already audited. Add another audit?")) return;
    setManualRunning(true); setManualResult(null); setManualStatus("Scoring with AI (same rubric as "+UI_LABELS.batch+")…");
    try {
      var rawTxt = await callClaudeWithRetry(buildEvalPrompt(ticket));
      var cleanTxt = rawTxt.replace(/```(?:json)?\s*/g,"").replace(/```/g,"").trim();
      var jsonMatch = cleanTxt.match(/\{[\s\S]+\}/);
      if(!jsonMatch) throw new Error("AI scoring failed — no JSON in response");
      var parsed = JSON.parse(jsonMatch[0]);
      var sc = calcScore(parsed.scores||{}, matrix);
      var hasAF = (parsed.autofails||[]).length>0;
      // Same shape as an AI Audit result (see runBatchQA) — only auditType differs
      var result = {
        week: ticketWeekLabel(ticket.createdDate)||week, auditWeek: week,
        reviewer: currentUser.name, agentName: ticket.agentName, ticketId: String(ticket.ticketId), ticketUrl: ticket.ticketUrl,
        createdDate: ticket.createdDate||"", contactReason: (parsed.meta&&parsed.meta.contactReason)||ticket.contactReason,
        product: (parsed.meta&&parsed.meta.product)||"", ticketResolution: (parsed.meta&&parsed.meta.ticketResolution)||"",
        scores: parsed.scores||{}, aiScores: parsed.scores||{}, autofails: parsed.autofails||[], autofail: hasAF,
        comments: parsed.comments||"", totalPoints: sc?sc.pts:0, maxPoints: sc?sc.max:0,
        finalScore: sc?sc.pct:0, aiScore: sc?sc.pct:0, passed: !hasAF&&(sc?sc.pct:0)>=85,
        hasDisputes: false, disputes: {}, justifications: parsed.justifications||{},
        customerEmail: ticket.customerEmail, savedAt: new Date().toISOString(), transcript: ticket.transcript||"",
        messageCount: ticket.messageCount||0, agentMessageCount: ticket.agentMessageCount||0,
        ctfAsScored: pickCtfTags(ticket), auditType: "Manual",
      };
      setManualStatus("Saving…");
      var saved = await saveTicketToDb(result);
      result.rowId = saved.id; result.id = saved.id;
      setTickets(function(ts){ return [parseTicketRow(Object.assign({pageId:saved.id}, result))].concat(ts); });
      setManualResult(result);
      addToast("Manual audit saved — "+result.aiScore+"%");
    } catch(e){ addToast("Error: "+e.message,"error"); }
    setManualRunning(false); setManualStatus("");
  }

  // ── CALIBRATION ───────────────────────────────────────────────────────────────
  async function runCalibration() {
    var disputed=tickets.filter(function(t){var hd=t.hasDisputes||(t.disputes&&Object.keys(t.disputes).length>0);if(!hd)return false;if(calibrationBaseline){var ts=t.reviewedAt||t.savedAt||"";if(ts<calibrationBaseline)return false;}return true;});
    if(disputed.length<10){addToast("Need at least 10 disputed tickets for calibration (currently "+disputed.length+")","error");return;}
    setCalibrationRunning(true); setCalibrationResult(null);
    try {
      var disputeData=disputed.map(function(t){
        var cats=Object.entries(t.disputes||{}).map(function(e){
          var catId=e[0],d=e[1];
          var c=matrix.find(function(m){return m.id===catId;})||{label:catId};
          return {category:c.label,aiScore:t.aiScores&&t.aiScores[catId],finalScore:d.finalScore,justification:d.justification};
        });
        return {ticketId:t.ticketId,agent:t.agentName,contactReason:t.contactReason,disputes:cats};
      });

      // Category dispute counts for context
      var catCounts={};
      disputeData.forEach(function(t){t.disputes.forEach(function(d){catCounts[d.category]=(catCounts[d.category]||0)+1;});});

      var prompt="You are a QA calibration analyst for Freedom Grooming customer support. Analyze these disputed tickets and return a structured JSON calibration report.\n\n"
        +"RUBRIC:\n"+matrix.map(function(c){return c.label+": "+c.levels.map(function(l){return l.level+(l.points!==null?" ("+l.points+")":"");}).join("/");}).join("\n")+"\n\n"
        +"DISPUTED TICKETS ("+disputed.length+" total):\n"+JSON.stringify(disputeData,null,2).slice(0,7000)+"\n\n"
        +"CATEGORY DISPUTE COUNTS: "+JSON.stringify(catCounts)+"\n\n"
        +"Return ONLY valid JSON (no markdown, no preamble) matching this exact structure:\n"
        +'{"summary":{"totalDisputed":0,"alignmentRating":"Good/Fair/Poor","overallAssessment":"2-3 sentence overview"},'
        +'"categoryAnalysis":[{"category":"","disputeCount":0,"pattern":"over-scoring/under-scoring/inconsistent","finding":"specific observation","recommendation":"specific fix"}],'
        +'"rubricGaps":[{"category":"","gap":"what is unclear","suggestedCriteria":"improved wording"}],'
        +'"promptImprovements":[{"category":"","current":"current prompt behavior","suggested":"specific improved instruction"}],'
        +'"quickWins":[{"title":"","impact":"High/Medium","action":"specific immediate change"}],'
        +'"agentPatterns":[{"finding":"observation about specific agents or contact reasons","implication":"what it means for QA"}]}';

      var result=await callClaudeWithRetry(prompt);
      var clean=result.replace(/```json|```/g,"").trim();
      var parsed=null;
      try { parsed=JSON.parse(clean); } catch(e){
        // fallback: try to extract JSON
        var m=clean.match(/\{[\s\S]*\}/);
        if(m) try { parsed=JSON.parse(m[0]); } catch(e2){}
      }
      if(!parsed){addToast("Could not parse calibration response — try again","error");setCalibrationRunning(false);return;}
      parsed._disputedCount = disputed.length;
      setCalibrationResult(parsed);
      addToast(UI_LABELS.calibration+" analysis complete"); // UI label (was "Calibration")
    } catch(e){addToast(UI_LABELS.calibration+" failed: "+e.message,"error");}
    setCalibrationRunning(false);
  }

        +"</div>"
      );

    var quickHTML=(data.quickWins||[]).map(function(q,i){

  // ══════════════════════════════════════════════════════════════════════
  // TEAM CALIBRATION — blind inter-rater calibration for human auditors.
  // Distinct from the AI-vs-dispute "Calibration" tab above: this measures
  // auditor-vs-auditor agreement, not AI-vs-human agreement.
  // ══════════════════════════════════════════════════════════════════════

  function calibAssignmentId(week, ticketId, reviewerEmail) {
    return (week+"_"+ticketId+"_"+reviewerEmail).replace(/[^a-zA-Z0-9_.@-]/g,"_");
  }

  // Build a preview of the round: one ticket per active auditor who reviewed
  // at least one ticket that week. Auditors with zero reviewed tickets that
  // week are skipped from the POOL but still participate as reviewers.
  function generateCalibPreview(weekLabel) {
    if(!weekLabel) { addToast("Pick a week first","error"); return; }
    setCalibGenerating(true);
    try {
      var weekTickets = tickets.filter(function(t){return t.week===weekLabel;});
      var activeAuditors = assignableAuditors();
      if(!activeAuditors.length){ addToast("No active Edit/Full auditors found","error"); setCalibGenerating(false); return; }
      var pool=[], skipped=[];
      activeAuditors.forEach(function(u){
        var theirs = weekTickets.filter(function(t){return t.reviewer===u.name;});
        if(theirs.length){
          pool.push({
            ticketId: theirs[0].ticketId, agentName: theirs[0].agentName, contactReason: theirs[0].contactReason,
            originalReviewerName: u.name, originalReviewerEmail: u.email,
            candidateIds: theirs.map(function(t){return t.ticketId;}), candidateIdx: 0
          });
        } else { skipped.push(u.name); }
      });
      if(!pool.length){ addToast("No auditor reviewed any tickets for "+weekLabel,"error"); setCalibGenerating(false); return; }
      setCalibPreview({ week: weekLabel, pool: pool, participants: activeAuditors.map(function(u){return {name:u.name,email:u.email};}), skipped: skipped });
    } catch(e){ addToast("Failed to build preview: "+e.message,"error"); }
    setCalibGenerating(false);
  }

  // Swap a pool ticket for a different one from the same auditor's tickets that week
  function rerollCalibPick(poolIdx) {
    setCalibPreview(function(cp){
      if(!cp) return cp;
      var pool = cp.pool.map(function(p,i){
        if(i!==poolIdx || p.candidateIds.length<2) return p;
        var nextIdx = (p.candidateIdx+1) % p.candidateIds.length;
        var nextTicketId = p.candidateIds[nextIdx];
        var t = tickets.find(function(tk){return String(tk.ticketId)===String(nextTicketId);});
        return Object.assign({},p,{ candidateIdx: nextIdx, ticketId: nextTicketId, agentName: t?t.agentName:p.agentName, contactReason: t?t.contactReason:p.contactReason });
      });
      return Object.assign({},cp,{pool:pool});
    });
  }

  // Writes the Round record + one Review assignment per (pool ticket × participant),
  // skipping the ticket's own original reviewer (no self-review).
  async function confirmCalibRound() {
    if(!calibPreview) return;
    setCalibConfirming(true);
    try {
      var week = calibPreview.week;
      var nowIso = new Date().toISOString();
      // Strip candidateIds/candidateIdx before persisting — those are only needed for the
      // pre-confirm re-roll UI (calibPreview, client-side only) and would only bloat the stored JSON.
      var poolForStorage = calibPreview.pool.map(function(p){
        return { ticketId: p.ticketId, agentName: p.agentName, contactReason: p.contactReason, originalReviewerName: p.originalReviewerName, originalReviewerEmail: p.originalReviewerEmail };
      });
      // No size cap: participants and pool are JSONB columns (v2 refused rounds over 1,990 chars).
      await apiCall("/calib/rounds","POST",{
        week: week, status: "In Progress", participants: calibPreview.participants, pool: poolForStorage,
        createdAt: nowIso, createdBy: currentUser.name
      });

      var reviews=[];
      for(var pi=0; pi<calibPreview.pool.length; pi++){
        var p = calibPreview.pool[pi];
        for(var qi=0; qi<calibPreview.participants.length; qi++){
          var part = calibPreview.participants[qi];
          if(part.email===p.originalReviewerEmail) continue; // no self-review
          reviews.push({ assignmentId: calibAssignmentId(week, p.ticketId, part.email), week: week,
                         ticketId: String(p.ticketId), reviewerEmail: part.email, reviewerName: part.name, status: "Pending" });
        }
      }
      var rres = await apiCall("/calib/reviews","POST",{reviews: reviews});
      var created = rres.created||0, failed = rres.failed||0;
      addToast("Round created — "+created+" review"+(created!==1?"s":"")+" assigned"+(failed?" ("+failed+" failed — re-run setup to retry)":""));
      setCalibPreview(null); setCalibSetupWeek("");
      await loadTeamCalibRounds();
      await openTeamCalibRound(week);
    } catch(e){ addToast("Failed to create round: "+e.message,"error"); }
    setCalibConfirming(false);
  }

  async function loadTeamCalibRounds() {
    setTeamCalibRoundsLoading(true);
    try {
      var rres = await apiCall("/calib/rounds");
      var rounds = (rres.rounds||[]).map(function(r){
        var pool = Array.isArray(r.pool) ? r.pool : [];
        return {
          pageId: r.id, week: r.week||"", status: r.status||"Setup",
          participants: Array.isArray(r.participants) ? r.participants : [],
          pool: pool, poolCount: pool.length, createdAt: r.createdAt||"", createdBy: r.createdBy||"",
          insightsGeneratedAt: r.insightsGeneratedAt||""
        };
      });
      rounds.sort(function(a,b){return (b.createdAt||"").localeCompare(a.createdAt||"");});
      setTeamCalibRounds(rounds); setTeamCalibRoundsLoaded(true);
    } catch(e){ addToast("Failed to load calibration rounds: "+e.message,"error"); }
    setTeamCalibRoundsLoading(false);
  }

  async function openTeamCalibRound(week) {
    setActiveTeamCalibWeek(week); setTeamCalibDetail(null); setTeamCalibDetailLoading(true);
    try {
      var round = teamCalibRounds.find(function(r){return r.week===week;});
      if(!round){ addToast("Round not found — try Refresh","error"); setTeamCalibDetailLoading(false); return; }
      var detail = Object.assign({}, round, {insights:null});
      if(round.insightsGeneratedAt){
        var rfull = await apiCall("/calib/rounds/"+round.pageId);
        detail.insights = rfull.insights||null;
      }
      setTeamCalibDetail(detail);

      var myRes = await apiCall("/calib/reviews?week="+encodeURIComponent(week)+"&reviewerEmail="+encodeURIComponent(currentUser.email));
      var mine = (myRes.reviews||[]).map(function(rv){
        return { pageId: rv.id, ticketId: rv.ticketId||"", status: rv.status||"Pending",
                 scores: rv.scores||{}, notes: rv.notes||{}, autofail: !!rv.autofail };
      });
      setMyCalibAssignments(mine);

      if(isFullAccess){
        var allRes = await apiCall("/calib/reviews?week="+encodeURIComponent(week));
        var all = (allRes.reviews||[]).map(function(rv){
          return { ticketId: rv.ticketId||"", reviewerName: rv.reviewerName||"",
                   reviewerEmail: rv.reviewerEmail||"", status: rv.status||"Pending" };
        });
        setAllRoundAssignments(all);
      } else {
        setAllRoundAssignments([]);
      }
    } catch(e){ addToast("Failed to open round: "+e.message,"error"); }
    setTeamCalibDetailLoading(false);
  }

  // Blind snapshot — deliberately omits reviewer, reviewerNotes, scores, aiScores,
  // finalScore, disputes, justifications. The assigned auditor sees only what's
  // needed to score fresh: the transcript, agent, contact reason, ticket link.
  function startCalibScoring(assignment) {
    var t = tickets.find(function(tk){return String(tk.ticketId)===String(assignment.ticketId);});
    if(!t) { addToast("Could not find ticket #"+assignment.ticketId+" in the loaded ticket list — try Sync first","error"); return; }
    setCalibScoringTicket({ ticketId: t.ticketId, agentName: t.agentName, contactReason: t.contactReason, transcript: t.transcript, ticketUrl: t.ticketUrl });
    var draft={};
    matrix.forEach(function(c){ draft[c.id] = { level: (assignment.scores&&assignment.scores[c.id])||"", justification: (assignment.notes&&assignment.notes[c.id])||"" }; });
    draft._autofail = { flagged: assignment.autofail||false, condition: (assignment.notes&&assignment.notes._autofail)||"" };
    setCalibScoringDraft(draft);
    setCalibScoringAssignment(assignment);
  }

  function updateCalibDraft(catId, field, value) {
    setCalibScoringDraft(function(d){ return Object.assign({}, d, { [catId]: Object.assign({}, d[catId]||{}, { [field]: value }) }); });
  }

  async function submitCalibReview() {
    if(!calibScoringAssignment) return;
    var missing = matrix.filter(function(c){ return !(calibScoringDraft[c.id]&&calibScoringDraft[c.id].level); });
    if(missing.length) { addToast("Score every category before submitting ("+missing.map(function(c){return c.label;}).join(", ")+" missing)","error"); return; }
    var autofailDraft = calibScoringDraft._autofail||{flagged:false,condition:""};
    if(autofailDraft.flagged && !autofailDraft.condition) { addToast("Select which autofail condition applies","error"); return; }
    setCalibSubmitting(true);
    try {
      var scores={}, notes={};
      matrix.forEach(function(c){ scores[c.id]=calibScoringDraft[c.id].level; notes[c.id]=calibScoringDraft[c.id].justification||""; });
      notes._autofail = autofailDraft.flagged ? autofailDraft.condition : "";
      await apiCall("/calib/reviews/"+calibScoringAssignment.pageId,"PATCH",{
        status: "Complete", scores: scores, notes: notes, autofail: !!autofailDraft.flagged,
        submittedAt: new Date().toISOString()
      });
      setMyCalibAssignments(function(list){ return list.map(function(a){ return a.pageId===calibScoringAssignment.pageId ? Object.assign({},a,{status:"Complete",scores:scores,notes:notes,autofail:!!autofailDraft.flagged}) : a; }); });
      addToast("Review submitted");
      setCalibScoringAssignment(null); setCalibScoringTicket(null); setCalibScoringDraft({});
    } catch(e){ addToast("Failed to submit review: "+e.message,"error"); }
    setCalibSubmitting(false);
  }

  // Full-only. Pulls every reviewer's blind scores for every pool ticket in the round,
  // plus the original AI/human score as reference context (not shown to blind reviewers,
  // but useful for the analysis to compare the original scorer against the blind consensus).
  async function runTeamCalibration(week) {
    var round = teamCalibRounds.find(function(r){return r.week===week;});
    if(!round){ addToast("Round not found","error"); return; }
    setTeamCalibRunning(true); setTeamCalibStatus("Gathering reviews...");
    try {
      var arRes = await apiCall("/calib/reviews?week="+encodeURIComponent(week));
      var allReviews = (arRes.reviews||[]).map(function(rv){
        return { ticketId: rv.ticketId||"", reviewerName: rv.reviewerName||"", status: rv.status||"Pending",
                 scores: rv.scores||{}, notes: rv.notes||{}, autofail: !!rv.autofail };
      });
      var completed = allReviews.filter(function(r){return r.status==="Complete";});
      if(completed.length < 2) { addToast("Need at least 2 completed reviews to compare anything ("+completed.length+" of "+allReviews.length+" done)","error"); setTeamCalibRunning(false); setTeamCalibStatus(""); return; }

      setTeamCalibStatus("Building analysis...");
      var byTicket={};
      completed.forEach(function(r){ (byTicket[r.ticketId]=byTicket[r.ticketId]||[]).push(r); });
      var ticketData = Object.keys(byTicket).map(function(tid){
        var orig = tickets.find(function(t){return String(t.ticketId)===String(tid);});
        return {
          ticketId: tid, agentName: orig?orig.agentName:"", contactReason: orig?orig.contactReason:"",
          originalAiScores: orig?(orig.aiScores||{}):{}, originalHumanReviewer: orig?orig.reviewer:"", originalHumanScores: orig?(orig.scores||{}):{}, originalAutofail: orig?!!orig.autofail:false,
          blindReviews: byTicket[tid].map(function(r){ return {reviewer:r.reviewerName, scores:r.scores, notes:r.notes, autofailFlagged:!!r.autofail, autofailCondition:(r.notes&&r.notes._autofail)||""}; })
        };
      });
      var rubricText = matrix.map(function(c){return c.label+": "+c.levels.map(function(l){return l.level+(l.points!==null?" ("+l.points+")":"");}).join("/");}).join("\n");
      var prompt = "You are analyzing a QA team's inter-rater calibration exercise for Freedom Grooming customer support.\n\n"
        +"Each ticket below was independently, blindly re-scored by multiple auditors (they could not see each other's scores, the original AI score, or the original human reviewer's score while scoring). Each blind review also includes whether that auditor flagged the ticket as an autofail and which condition, if so. Find where auditors agree/disagree on category scores AND on autofail judgment, who trends lenient or strict, and what that implies for the rubric or scoring guidance.\n\n"
        +"RUBRIC:\n"+rubricText+"\n\n"
        +"TICKETS AND BLIND RE-SCORES (original AI/human scores included ONLY as reference, NOT as ground truth):\n"
        +JSON.stringify(ticketData,null,2).slice(0,12000)+"\n\n"
        +"Return ONLY valid JSON (no markdown, no preamble) matching this exact structure:\n"
        +'{"summary":{"agreementRating":"Strong/Moderate/Weak","overallAssessment":"2-3 sentence overview"},'
        +'"categoryAgreement":[{"category":"","agreementLevel":"High/Medium/Low","pattern":"description of where auditors align or split","finding":"specific observation with numbers"}],'
        +'"auditorLean":[{"reviewer":"","tendency":"Lenient/Strict/Consistent","evidence":"specific categories/tickets showing this pattern"}],'
        +'"autofailAgreement":[{"ticketId":"","agreement":"Unanimous/Split","details":"which auditors flagged it, which did not, and under what condition"}],'
        +'"highDivergenceTickets":[{"ticketId":"","category":"","scores":"e.g. Jean: YES, Marco: NO","note":"quote or paraphrase the differing justifications and why they diverged"}],'
        +'"recommendations":[{"area":"rubric wording/scoring context/training","category":"","issue":"","suggestedFix":""}]}';

      var result = await callClaudeInsights(prompt);
      var clean = result.replace(/```json|```/g,"").trim();
      var parsed=null;
      try { parsed=JSON.parse(clean); } catch(e){ var m=clean.match(/\{[\s\S]*\}/); if(m) try { parsed=JSON.parse(m[0]); } catch(e2){} }
      if(!parsed){ addToast("Could not parse calibration analysis — try again","error"); setTeamCalibRunning(false); setTeamCalibStatus(""); return; }
      parsed._participantCount = round.participants.length;
      parsed._ticketCount = Object.keys(byTicket).length;
      parsed._completedCount = completed.length;
      parsed._totalAssignments = allReviews.length;

      setTeamCalibStatus("Saving insights...");
      await apiCall("/calib/rounds/"+round.pageId,"PATCH",{
        status: "Complete", insightsGeneratedAt: new Date().toISOString(), insights: parsed
      });

      await loadTeamCalibRounds();
      await openTeamCalibRound(week);
      addToast("Team calibration analysis complete");
    } catch(e){ addToast(UI_LABELS.teamcal+" failed: "+e.message,"error"); }
    setTeamCalibRunning(false); setTeamCalibStatus("");
  }

  function buildTeamCalibDocHTML(week, data) {
    if(!data) return "";
    var s=data.summary||{};
    var agreeColor=s.agreementRating==="Strong"?"#166534":s.agreementRating==="Moderate"?"#92400e":"#991b1b";
    var agreeBg=s.agreementRating==="Strong"?"#f0fdf4":s.agreementRating==="Moderate"?"#fffbeb":"#fee2e2";
    function section(title,content){return "<div style=\'margin-bottom:28px;\'><h2 style=\'font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#6b7280;margin:0 0 12px;\'>"+title+"</h2>"+content+"</div>";}
    function card(content,border){return "<div style=\'border:1px solid "+(border||"#e5e7eb")+";border-radius:10px;padding:16px 20px;margin-bottom:10px;\'>"+content+"</div>";}
    function badge(txt,col,bg){return "<span style=\'font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:"+bg+";color:"+col+";border:1px solid "+col+"25;\'>"+txt+"</span>";}

    var catHTML=(data.categoryAgreement||[]).map(function(c){
      var lvlCol=c.agreementLevel==="High"?"#166534":c.agreementLevel==="Medium"?"#92400e":"#991b1b";
      var lvlBg=c.agreementLevel==="High"?"#f0fdf4":c.agreementLevel==="Medium"?"#fffbeb":"#fee2e2";
      return card(
        "<div style=\'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;\'><span style=\'font-size:13px;font-weight:700;\'>"+c.category+"</span>"+badge(c.agreementLevel+" agreement",lvlCol,lvlBg)+"</div>"
        +"<p style=\'font-size:12px;color:#374151;line-height:1.6;margin:0 0 8px;\'>"+c.pattern+"</p>"
        +"<div style=\'font-size:12px;background:#f9fafb;border-radius:6px;padding:8px 12px;border-left:3px solid #3b82f6;\'>"+c.finding+"</div>"
      );
    }).join("");
    var leanHTML=(data.auditorLean||[]).map(function(a){
      var col=a.tendency==="Lenient"?"#92400e":a.tendency==="Strict"?"#1d4ed8":"#166534";
      var bg=a.tendency==="Lenient"?"#fffbeb":a.tendency==="Strict"?"#eff6ff":"#f0fdf4";
      return card(
        "<div style=\'display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;\'><span style=\'font-size:13px;font-weight:700;\'>"+a.reviewer+"</span>"+badge(a.tendency,col,bg)+"</div>"
        +"<p style=\'font-size:12px;color:#374151;line-height:1.6;margin:0;\'>"+a.evidence+"</p>"
      );
    }).join("");
    var divHTML=(data.highDivergenceTickets||[]).map(function(d){
      return card(
        "<div style=\'font-size:13px;font-weight:600;margin-bottom:6px;\'>#"+d.ticketId+" &middot; "+d.category+"</div>"
        +"<p style=\'font-size:12px;color:#374151;margin:0 0 6px;\'><strong>Scores:</strong> "+d.scores+"</p>"
        +"<p style=\'font-size:12px;color:#6b7280;font-style:italic;margin:0;\'>"+d.note+"</p>"
      );
    }).join("");
    var autofailHTML=(data.autofailAgreement||[]).map(function(af){
      var col=af.agreement==="Unanimous"?"#166534":"#991b1b";
      var bg=af.agreement==="Unanimous"?"#f0fdf4":"#fee2e2";
      return card(
        "<div style=\'display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;\'><span style=\'font-size:13px;font-weight:700;\'>#"+af.ticketId+"</span>"+badge(af.agreement,col,bg)+"</div>"
        +"<p style=\'font-size:12px;color:#374151;line-height:1.6;margin:0;\'>"+af.details+"</p>"
      );
    }).join("");
    var recHTML=(data.recommendations||[]).map(function(r){
      return card(
        "<div style=\'font-size:13px;font-weight:600;margin-bottom:6px;\'>"+r.area+(r.category?" — "+r.category:"")+"</div>"
        +"<p style=\'font-size:12px;color:#374151;line-height:1.6;margin:0 0 8px;\'><strong>Issue:</strong> "+r.issue+"</p>"
        +"<div style=\'font-size:12px;background:#f0fdf4;border-radius:6px;padding:8px 12px;border-left:3px solid #16a34a;\'><span style=\'font-weight:600;color:#166534;\'>Suggested fix: </span>"+r.suggestedFix+"</div>"
      );
    }).join("");

    return "<!DOCTYPE html><html><head><meta charset=\'utf-8\'><style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:Arial,sans-serif;background:white;color:#111827;-webkit-print-color-adjust:exact;}.page{max-width:720px;margin:0 auto;padding:48px 40px 60px;}</style></head><body><div class=\'page\'>"
      +"<div style=\'padding-bottom:28px;border-bottom:1px solid #e5e7eb;margin-bottom:32px;\'>"
      +"<div style=\'font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#6b7280;margin-bottom:6px;\'>Wingman &middot; Team Calibration Report</div>"
      +"<h1 style=\'font-size:24px;font-weight:700;margin-bottom:4px;\'>"+week+"</h1>"
      +"<p style=\'font-size:12px;color:#6b7280;margin-bottom:16px;\'>"+(data._completedCount||0)+" of "+(data._totalAssignments||0)+" blind reviews completed &nbsp;&middot;&nbsp; "+(data._ticketCount||0)+" tickets &nbsp;&middot;&nbsp; "+(data._participantCount||0)+" auditors</p>"
      +"<div style=\'display:inline-flex;align-items:center;gap:10px;padding:10px 16px;background:"+agreeBg+";border-radius:8px;border:1px solid "+agreeColor+"40;\'>"
      +"<span style=\'font-size:11px;font-weight:700;text-transform:uppercase;color:"+agreeColor+";\'>Agreement: "+s.agreementRating+"</span>"
      +"<span style=\'font-size:12px;color:#374151;\'>"+s.overallAssessment+"</span></div></div>"
      +(catHTML?section("Category Agreement",catHTML):"")

      +(autofailHTML?section("Autofail Agreement",autofailHTML):"")
      +(divHTML?section("Highest-Divergence Tickets",divHTML):"")
      +(recHTML?section("Recommendations",recHTML):"")
      +"<hr style=\'border:none;border-top:1px solid #e5e7eb;margin:32px 0;\'>"
      +"<div style=\'font-size:11px;color:#9ca3af;text-align:center;\'>Wingman Team Calibration &nbsp;&middot;&nbsp; "+new Date().toLocaleDateString()+"</div>"
      +"</div></body></html>";
  }

  function downloadTeamCalibDoc(week, data) {
    var html = buildTeamCalibDocHTML(week, data);
    if(!html) { addToast("No insights to export","error"); return; }
    downloadBlob(html, "Wingman_TeamCalibration_"+week.replace(/[^a-zA-Z0-9]/g,"_")+".doc", "application/msword");
  }

  // Live CTF dropdown options (v3.2.0). Non-blocking; filters keep working on fallback lists meanwhile.
  async function loadCtfFieldOptions(){
    try {
      var d = await apiCall("/gorgias/fields");
      if(!d || !d.fields) return;
      setCtfFieldOpts(d);
      var cr = d.fields.contactReason||[], rs = d.fields.resolution||[], ad = d.fields.addResolution||[];
      var rebase = function(f){ return Object.assign({}, f, {
        crL1: selRebase(f.crL1, ctfL1List(cr)), crL2: selRebase(f.crL2, ctfL2List(cr)),
        resL1: selRebase(f.resL1, ctfL1List(rs)), resL2: selRebase(f.resL2, ctfL2List(rs)),
        addResL1: selRebase(f.addResL1, ctfL1List(ad)), addResL2: selRebase(f.addResL2, ctfL2List(ad)) }); };
      setFetchForm(rebase);
      setV2Filters(rebase);
      if(d.source!=="live") dbg("fields","CTF options from "+d.source+": "+(d.error||""));
    } catch(e){ dbg("fields","CTF options unavailable: "+e.message); }
  }

  async function loadAllData(setup) {
    setLoading(true);
    loadCtfFieldOptions();
    setSyncStatus("Loading tickets from database...");
    try {
      const t = await loadTicketsFromDb(setSyncStatus);
      // Filter out soft-deleted tickets from all views
      var activeTickets = Array.isArray(t) ? t.filter(function(tk){return !tk.deleted;}) : [];
      // For View users with an agent name — filter to their own tickets only
      var agentFilter = setup._agentFilter||"";
      if(agentFilter){
        activeTickets = activeTickets.filter(function(tk){return tk.agentName===agentFilter;});
      }
      setTickets(activeTickets);

      // Load deleted ticket IDs — used to skip in fetcher + batch QA
      setSyncStatus("Loading deleted ticket IDs...");
      var deletedIds = await loadDeletedTicketIds();
      setDeletedTicketIds(deletedIds);
      console.log("[QA] Loaded",deletedIds.size,"deleted ticket IDs");
      setSyncStatus("Loading users...");
      await loadUsersFromDb();
      setSyncStatus("Loading matrix...");
      var savedMatrix = await loadConfigFromDb("matrix");
      if(savedMatrix && Array.isArray(savedMatrix)) { setMatrix(savedMatrix); setMatrixVersion(CURRENT_MATRIX_VERSION); }
      var savedAutofails = await loadConfigFromDb("autofails");
      if(savedAutofails && Array.isArray(savedAutofails)) setAutofailList(savedAutofails);
      var savedScoringContext = await loadConfigFromDb("scoringContext");
      if(savedScoringContext && typeof savedScoringContext === "string") setScoringContext(savedScoringContext);
      setMatrixSnapPending(true);   // snapshot the loaded matrix once state has committed (see effect)
      var savedBaseline = await loadConfigFromDb("calibrationBaseline");
      if(savedBaseline && typeof savedBaseline === "string") setCalibrationBaseline(savedBaseline);
      setSyncStatus("");
      if (Array.isArray(t) && t.length > 0) {
        addToast("Loaded " + t.length + " tickets");
      } else {
        addToast("No tickets found in the database", "warning");
      }
    } catch(e) {
      console.error("[QA] load error:", e);

    } catch(e) {

  // ── AGENT DISPUTE (View users) ────────────────────────────────────────────────
  async function saveAgentDispute() {
    if(!reviewSelected||!currentUser){return;}
    if(isTicketLocked(reviewSelected)) { addToast("This ticket is locked ("+ticketLockDateLabel(reviewSelected)+") — disputes can no longer be filed","error"); return; }
    var pending=Object.entries(disputeState).filter(function(e){
      var d=e[1];return d.newScore&&d.justification&&d.justification.trim();
    });
    if(!pending.length){addToast("No disputes to submit","error");return;}
    setSavingDispute(true);
    try {
      var updatedDisputes=Object.assign({},reviewSelected.disputes||{});
      pending.forEach(function(e){
        var catId=e[0],d=e[1];
        // Only allow one dispute per category — skip if already exists
        if(!updatedDisputes[catId]){
          updatedDisputes[catId]={
            finalScore:d.newScore,
            justification:d.justification.trim(),
            disputer:currentUser.name,
            disputedAt:new Date().toISOString(),
            status:"pending",  // pending | approved | rejected
            rejectedReason:"",
            decidedBy:"",
            decidedAt:"",
          };
        }
      });
      var hasDisputes=Object.keys(updatedDisputes).length>0;
      dbg("dispute","submit "+Object.keys(updatedDisputes).length+" dispute(s) pageId="+reviewSelected.rowId);
      if(reviewSelected.rowId){
        await dbPatchTicketRetry(reviewSelected.rowId,{
          disputes:    updatedDisputes,
          hasDisputes: hasDisputes,
        });
        await verifyDisputesSaved(reviewSelected.rowId,Object.keys(updatedDisputes).length);
      }
      var updated=Object.assign({},reviewSelected,{disputes:updatedDisputes,hasDisputes});
      setTickets(function(ts){return ts.map(function(t){return ((t.rowId&&t.rowId===updated.rowId)||t.id===updated.id)?updated:t;});});
      setReviewSelected(updated);
      setDisputeState({});
      addToast("Dispute submitted — pending auditor review");
    } catch(e){addToast("Submit failed: "+e.message,"error");}
    setSavingDispute(false);
  }

  // ── DISPUTE APPROVAL (Edit+ users) ───────────────────────────────────────────
  async function saveDisputeApproval() {
    if(!reviewSelected||!isEditor)return;
    var decisions=Object.entries(approvalState).filter(function(e){return e[1].action;});
    if(!decisions.length){addToast("No decisions to save","error");return;}
    setSavingApproval(true);
    try {
      var updatedDisputes=Object.assign({},reviewSelected.disputes||{});
      var now=new Date().toISOString();
      decisions.forEach(function(e){
        var catId=e[0],dec=e[1];
        if(!updatedDisputes[catId])return;
        if(dec.action==="approve"){
          updatedDisputes[catId]=Object.assign({},updatedDisputes[catId],{
            status:"approved",decidedBy:currentUser.name,decidedAt:now,rejectedReason:""
          });
        } else {
          updatedDisputes[catId]=Object.assign({},updatedDisputes[catId],{
            status:"rejected",decidedBy:currentUser.name,decidedAt:now,
            rejectedReason:(dec.reason||"").trim(),
            // Revert score back to AI score on rejection
            finalScore:(reviewSelected.aiScores&&reviewSelected.aiScores[catId])||"",
          });
        }
      });
      // Recalculate final score using only approved disputes
      var merged={};
      matrix.forEach(function(c){
        var disp=updatedDisputes[c.id];
        var useDisp=disp&&disp.status==="approved";
        merged[c.id]=useDisp?disp.finalScore:((reviewSelected.aiScores&&reviewSelected.aiScores[c.id])||"");
      });
      var dispSc=calcScore(merged,matrix);
      var hasDisputes=Object.values(updatedDisputes).some(function(d){return d.status==="approved";});
      var updated=Object.assign({},reviewSelected,{
        disputes:updatedDisputes,hasDisputes,
        finalScore:dispSc?dispSc.pct:reviewSelected.finalScore,
        reviewed:true,reviewedBy:currentUser.name,reviewedAt:now,
      });
      dbg("dispute","approval save pageId="+reviewSelected.rowId+" approvedKeys="+Object.keys(updatedDisputes).length);
      if(reviewSelected.rowId){
        await updateTicketInDb(reviewSelected.rowId,updated);
        await dbPatchTicketRetry(reviewSelected.rowId,{
          disputes:    updatedDisputes,
          hasDisputes: hasDisputes,
          reviewed:    true,
          reviewedBy:  currentUser.name,
          reviewedAt:  now,
        });
        await verifyDisputesSaved(reviewSelected.rowId,Object.keys(updatedDisputes).length);
      }
      setTickets(function(ts){return ts.map(function(t){return ((t.rowId&&t.rowId===updated.rowId)||t.id===updated.id)?updated:t;});});
      setReviewSelected(updated);
      setApprovalState({});
      addToast("Dispute decisions saved");
    } catch(e){addToast("Save failed: "+e.message,"error");}
    setSavingApproval(false);
  }

  async function saveDispute() {
    if(!reviewSelected||!disputerName.trim()){addToast("Select your name first","error");return;}
    if(isTicketLocked(reviewSelected)) { addToast("This ticket is locked ("+ticketLockDateLabel(reviewSelected)+") — a Full-access user must unlock it first","error"); return; }
    var pending=Object.entries(disputeState).filter(function(e){
      var d=e[1];return (d.newScore&&d.justification&&d.justification.trim())||d.removed;
    });
    if(!pending.length){addToast("No changes to save","error");return;}
    setSavingDispute(true);
    try {
      var updatedDisputes=Object.assign({},reviewSelected.disputes||{});
      pending.forEach(function(e){
        var catId=e[0],d=e[1];
        if(d.removed){delete updatedDisputes[catId];}
        else{updatedDisputes[catId]={finalScore:d.newScore,justification:d.justification.trim(),disputer:disputerName,disputedAt:new Date().toISOString(),status:"approved",decidedBy:currentUser.name,decidedAt:new Date().toISOString()};}
      });
      var hasDisputes=Object.keys(updatedDisputes).length>0;
      var merged={};
      matrix.forEach(function(c){
        var disp=updatedDisputes[c.id];
        merged[c.id]=disp?disp.finalScore:((reviewSelected.aiScores&&reviewSelected.aiScores[c.id])||"");
      });
      var dispSc=calcScore(merged,matrix);
      var disputedPassed=dispSc?(!reviewSelected.autofail&&dispSc.pct>=85):reviewSelected.passed;
      var reviewerNotes=disputeState._reviewerNotes!==undefined?disputeState._reviewerNotes:(reviewSelected.reviewerNotes||"");
      var updated=Object.assign({},reviewSelected,{
        disputes:updatedDisputes,hasDisputes,
        finalScore:dispSc?dispSc.pct:reviewSelected.finalScore,
        disputedPassed,
        reviewed:true,
        reviewedBy:currentUser.name,
        reviewedAt:new Date().toISOString(),
        reviewerNotes:reviewerNotes,
      });
      dbg("dispute","save "+pending.length+" change(s) pageId="+updated.rowId);
      if(updated.rowId){
        await updateTicketInDb(updated.rowId,updated);
        // Also save reviewed status and reviewer notes
        await dbPatchTicketRetry(updated.rowId,{
          reviewed:      true,
          reviewedBy:    currentUser.name,
          reviewedAt:    updated.reviewedAt,
          reviewerNotes: reviewerNotes,
        });
        await verifyDisputesSaved(updated.rowId,Object.keys(updatedDisputes).length);
      }
      setTickets(function(ts){return ts.map(function(t){return ((t.rowId&&t.rowId===updated.rowId)||t.id===updated.id)?updated:t;});});
      setReviewSelected(updated);
      setDisputeState({});
      addToast(pending.length+" dispute"+(pending.length!==1?"s":"")+" saved");
    } catch(e){addToast("Save failed: "+e.message,"error");}
    setSavingDispute(false);
  }

  function myReviewQueue(){

    if (!isEditor || !currentUser) return out;

            <div style={{minWidth:0}}><b>{currentUser.name}</b><span>{currentUser.email}</span>
              <div><span style={{display:"inline-block",marginTop:"5px",fontSize:"10px",padding:"1px 6px",borderRadius:"3px",fontWeight:700,
                background: isFullAccess?"var(--color-background-info)":isEditor?"var(--color-background-success)":"var(--color-background-secondary)",
                color: isFullAccess?"var(--color-text-info)":isEditor?"var(--color-text-success)":"var(--color-text-secondary)",
                border: "0.5px solid "+(isFullAccess?"var(--color-border-info)":isEditor?"var(--color-border-success)":"var(--color-border-secondary)")}}>{roleLabel}</span></div>
            </div>
          </div>
          <button role="menuitem" onClick={function(){setUserMenuOpen(false);handleLogout();}}><NavIcon name="logout"/>Log out</button>
          <div className="ver">Wingman {APP_VERSION}</div>
        </div>
      )}

      <main className="wm-main">
        <div className="wm-canvas">
          <header className="wm-topbar">
            <button className="wm-menubtn" aria-label="Open menu" onClick={function(){setNavOpen(true);}}><NavIcon name="menu"/></button>
            <div className="wm-crumbs">
              {navGroupOf(view)&&<React.Fragment>{navGroupOf(view)}<NavIcon name="chev"/></React.Fragment>}
              <b>{UI_LABELS[view]||""}</b>
            </div>
            <div className="wm-week">{week}</div>
          </header>
          <div className="wm-content" ref={contentRef}>
            <div className="wm-page">

      {/* Migration banner (v3.0.0) — only Full users can be signed in during migration */}
      {migrationMode&&(
        <div style={{background:"var(--color-background-warning)",color:"var(--color-text-warning)",border:"0.5px solid var(--color-border-warning)",borderRadius:"var(--border-radius-md)",padding:"10px 14px",fontSize:"12px",marginBottom:"18px",display:"flex",justifyContent:"space-between",alignItems:"center",gap:"12px",flexWrap:"wrap"}}>
          <span><strong>Migration mode — read-only.</strong> Import from Notion, verify, then mark cutover complete. Other users can't sign in until then.</span>
          <button onClick={function(){navGo("settings");setSettingsTab("admin");}} style={{...ghost,fontSize:"11px"}}>Settings › Admin Tools</button>
        </div>
      )}

      {/* Page title — labels/ledes come from UI_LABELS / UI_LEDES */}
      <h1 className="wm-title">{pageTitle}</h1>
      {UI_LEDES[view]&&<p className="wm-lede">{UI_LEDES[view]}</p>}


      {/* ── BATCH QA ── */}
      {view==="batch" && (
        <div>
          {/* Import */}
          {!batchTickets.length && (
            <div style={{...card,borderStyle:"dashed",textAlign:"center",padding:"3rem 2rem"}}>
              <p style={{fontWeight:600,fontSize:"15px",margin:"0 0 6px",color:"var(--color-text-primary)"}}>Import Gorgias CSV</p>
              <p style={{fontSize:"13px",color:"var(--color-text-secondary)",margin:"0 0 20px",lineHeight:"1.6"}}>Upload the CSV generated by your Python script.<br/>Claude will automatically QA every ticket — no copy-paste needed.</p>
              <label style={{...btnInfo,cursor:"pointer",display:"inline-block",padding:"10px 24px"}}>
                Choose CSV file
                <input ref={batchFileRef} type="file" accept=".csv" style={{display:"none"}} onChange={handleBatchFile}/>
              </label>
              <p style={{fontSize:"11px",color:"var(--color-text-secondary)",marginTop:"12px"}}>Requires a <code>transcript</code> column from the Python script</p>
            </div>
          )}

          {/* Ready to run */}
          {batchTickets.length>0&&!batchRunning&&batchResults.length===0&&(
            <div>
              <div style={{...card,background:"var(--color-background-success)",border:"0.5px solid var(--color-border-success)"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"12px"}}>
                  <div>
                    <p style={{margin:"0 0 4px",fontWeight:600,fontSize:"15px",color:"var(--color-text-success)"}}>{batchTickets.length} tickets ready</p>
                    <p style={{margin:0,fontSize:"12px",color:"var(--color-text-success)",opacity:0.8}}>Est. time: ~{Math.ceil(batchTickets.length*1.5/60)} min</p>
                  </div>
                  <div style={{display:"flex",gap:"8px"}}>
                    <button onClick={function(){setBatchTickets([]);}} style={ghost}>Clear</button>
                    <button onClick={runBatchQA} style={{...btnSuccess,padding:"10px 24px",fontSize:"14px"}}>Run QA on all tickets</button>
                  </div>
                </div>
              </div>
              <div style={card}>
                <p style={{...sectionLabel,marginBottom:"10px"}}>Preview ({Math.min(5,batchTickets.length)} of {batchTickets.length})</p>
                <div style={{display:"grid",gridTemplateColumns:"32px 120px 1fr 1fr 80px",gap:"8px",padding:"5px 8px",marginBottom:"4px"}}>
                  {["#","Ticket","Agent","Subject","Chars"].map(function(h){return <span key={h} style={{fontSize:"11px",color:"var(--color-text-secondary)"}}>{h}</span>;})}
                </div>
                {batchTickets.slice(0,5).map(function(t,i){
                  return <div key={i} className="qa-row" style={{display:"grid",gridTemplateColumns:"32px 120px 1fr 1fr 80px",gap:"8px",padding:"7px 8px",borderRadius:"var(--border-radius-md)",marginBottom:"2px",alignItems:"center"}}>
                    <span style={{fontSize:"12px",color:"var(--color-text-secondary)"}}>{i+1}</span>
                    <span style={{fontSize:"12px",fontWeight:500,color:"var(--color-text-info)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.ticketId}</span>
                    <span style={{fontSize:"12px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.agentName||"—"}</span>
                    <span style={{fontSize:"12px",color:"var(--color-text-secondary)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.contactReason||"—"}</span>
                    <span style={{fontSize:"11px",color:"var(--color-text-secondary)"}}>{t.transcript.length}</span>
                  </div>;
                })}
                {batchTickets.length>5&&<p style={{fontSize:"12px",color:"var(--color-text-secondary)",margin:"8px 0 0",textAlign:"center"}}>+ {batchTickets.length-5} more</p>}
              </div>
            </div>
          )}

          {/* Running */}
          {batchRunning&&(
            <div style={card}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px",flexWrap:"wrap",gap:"8px"}}>
                <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
                  <div style={{width:"14px",height:"14px",border:"2px solid var(--color-border-info)",borderTop:"2px solid var(--color-text-info)",borderRadius:"50%",animation:"spin 0.8s linear infinite",flexShrink:0}}/>
                  <span style={{fontSize:"14px",fontWeight:500}}>{batchStatus}</span>
                </div>
                <div style={{display:"flex",gap:"8px"}}>
                  <button onClick={function(){batchPausedRef.current=!batchPausedRef.current;setBatchPaused(batchPausedRef.current);}} style={ghost}>{batchPaused?"Resume":"Pause"}</button>
                  <button onClick={function(){batchStopRef.current=true;}} style={{...ghost,color:"var(--color-text-danger)"}}>Stop</button>
                </div>
              </div>
              <div style={{height:"6px",background:"var(--color-background-secondary)",borderRadius:"3px",overflow:"hidden",marginBottom:"10px"}}>
                <div style={{height:"100%",width:(batchTickets.length>0?Math.round(batchResults.length/batchTickets.length*100):0)+"%",background:"var(--color-text-info)",borderRadius:"3px",transition:"width 0.4s"}}/>
              </div>
              <div style={{display:"flex",gap:"16px",fontSize:"12px",color:"var(--color-text-secondary)"}}>
                <span>{batchResults.length} / {batchTickets.length} done</span>
                <span style={{color:T.green.text}}>{batchResults.filter(function(r){return r.passed;}).length} pass</span>
                <span style={{color:T.red.text}}>{batchResults.filter(function(r){return !r.passed&&!r.error;}).length} fail</span>
                {batchErrors>0&&<span style={{color:T.amber.text}}>{batchErrors} errors</span>}
              </div>
            </div>
          )}

          {/* Results */}
          {batchResults.length>0&&(
            <div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:"10px",marginBottom:"14px"}}>
                {[{label:"Evaluated",val:batchDone},{label:"Pass rate",val:batchPassRate+"%",tone:batchPassRate},{label:"Autofails",val:batchResults.filter(function(r){return r.autofail;}).length},{label:"Errors",val:batchErrors}].map(function(m){
                  var tone=m.tone!==undefined?scoreTone(m.tone):null;
                  return <div key={m.label} style={{background:"var(--color-background-secondary)",borderRadius:"var(--border-radius-md)",padding:"12px 14px"}}>
                    <div style={{fontSize:"11px",color:"var(--color-text-secondary)",marginBottom:"4px",fontWeight:600,textTransform:"uppercase",letterSpacing:"0.06em"}}>{m.label}</div>
                    <div style={{fontSize:"24px",fontWeight:700,color:tone?tone.text:"var(--color-text-primary)"}}>{m.val}</div>
                  </div>;
                })}
              </div>
              {!batchRunning&&(
                <div style={{display:"flex",gap:"8px",marginBottom:"14px",flexWrap:"wrap"}}>
                  <button onClick={saveBatchToDatabase} style={btnSuccess}>Save all to database</button>
                  <button onClick={exportBatchCSV} style={ghost}>Export CSV</button>
                  <button onClick={function(){setBatchResults([]);setBatchStatus("");}} style={ghost}>Clear results</button>
                  {batchResults.length<batchTickets.length&&(
                    <button onClick={runBatchQA} style={btnInfo}>Resume ({batchTickets.length-batchResults.length} remaining)</button>
                  )}
                </div>
              )}
              <div style={card}>
                <p style={{...sectionLabel,marginBottom:"10px"}}>Results — {batchResults.length} tickets</p>
                <div style={{overflowX:"auto"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:"12px"}}>
                    <thead>
                      <tr style={{borderBottom:"0.5px solid var(--color-border-tertiary)"}}>
                        {["Ticket","Agent","Subject","Score","Result","Autofail","Comments"].map(function(h){
                          return <th key={h} style={{textAlign:"left",padding:"5px 8px",color:"var(--color-text-secondary)",fontWeight:400,whiteSpace:"nowrap"}}>{h}</th>;
                        })}
                      </tr>
                    </thead>
                    <tbody>
                      {batchResults.map(function(r,i){
                        if(r.error)return(
                          <tr key={i} style={{borderBottom:"0.5px solid var(--color-border-tertiary)"}}>
                            <td style={{padding:"6px 8px",color:"var(--color-text-info)"}}>{r.ticketId}</td>
                            <td style={{padding:"6px 8px"}}>{r.agentName}</td>
                            <td colSpan="5" style={{padding:"6px 8px",color:"var(--color-text-danger)",fontSize:"11px"}}>Error: {r.error}</td>
                          </tr>
                        );
                        var rb=resultBadge(r);
                        var comments=(r.comments||"").split("\n").filter(function(l){return l.trim();}).slice(0,2).join(" · ");
                        return(
                          <tr key={i} className="qa-row" style={{borderBottom:"0.5px solid var(--color-border-tertiary)",cursor:"pointer"}} onClick={function(){setSelectedResult(r);}}>
                            <td style={{padding:"6px 8px",color:"var(--color-text-info)",fontWeight:500,whiteSpace:"nowrap"}}>{r.ticketId}</td>
                            <td style={{padding:"6px 8px",whiteSpace:"nowrap"}}>{r.agentName||"—"}</td>
                            <td style={{padding:"6px 8px",color:"var(--color-text-secondary)",maxWidth:"180px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={r.contactReason||""}>{r.contactReason||"—"}</td>
                            <td style={{padding:"6px 8px",fontWeight:600,color:scoreColor(r.finalScore),whiteSpace:"nowrap"}}>{r.finalScore}%</td>
                            <td style={{padding:"6px 8px"}}><span style={{fontSize:"11px",fontWeight:700,padding:"2px 8px",borderRadius:"4px",background:rb.bg,color:rb.text,border:"1px solid "+rb.border,whiteSpace:"nowrap"}}>{rb.label}</span></td>
                            <td style={{padding:"6px 8px",color:r.autofail?T.red.text:"var(--color-text-secondary)"}}>{r.autofail?"YES":"—"}</td>
                            <td style={{padding:"6px 8px",color:"var(--color-text-secondary)",maxWidth:"200px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontSize:"11px"}}>{comments||"—"}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* Result detail modal */}
          {selectedResult&&(
            <div style={{minHeight:"600px",background:"rgba(0,0,0,0.45)",display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"2rem 1rem",marginTop:"1rem",borderRadius:"var(--border-radius-lg)"}}>
              <div style={{...card,width:"100%",maxWidth:"600px",marginBottom:0}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px"}}>
                  <div>
                    <p style={{margin:"0 0 2px",fontWeight:600,fontSize:"15px"}}>#{selectedResult.ticketId}</p>
                    <p style={{margin:0,fontSize:"12px",color:"var(--color-text-secondary)"}}>{selectedResult.agentName} · {selectedResult.contactReason}</p>
                  </div>
                  <div style={{display:"flex",gap:"10px",alignItems:"center"}}>
                    <span style={{fontSize:"22px",fontWeight:700,color:scoreColor(selectedResult.finalScore)}}>{selectedResult.finalScore}%</span>
                    <button onClick={function(){setSelectedResult(null);}} style={{background:"none",border:"none",cursor:"pointer",fontSize:"22px",color:"var(--color-text-secondary)",lineHeight:1}}>×</button>
                  </div>
                </div>
                {matrix.map(function(c){
                  var val=selectedResult.scores&&selectedResult.scores[c.id];
                  var lbl2=scoreLabel(val);
                  var j=selectedResult.justifications&&selectedResult.justifications[c.id];
                  return <div key={c.id} style={{display:"flex",flexDirection:"column",gap:"4px",padding:"8px 0",borderBottom:"0.5px solid var(--color-border-tertiary)"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <span style={{fontSize:"13px"}}>{c.label}</span>
                      <ScorePill label={lbl2}/>
                    </div>
                    {j&&j.reason&&<p style={{margin:0,fontSize:"12px",color:"var(--color-text-secondary)",lineHeight:"1.5"}}>{j.reason}{j.improve&&j.improve!=="null"&&<span style={{color:"var(--color-text-info)"}}> ↑ {j.improve}</span>}</p>}
                  </div>;
                })}
                {selectedResult.autofails&&selectedResult.autofails.length>0&&(
                  <div style={{marginTop:"10px",padding:"10px 12px",background:T.red.bg,borderRadius:"var(--border-radius-md)",border:"1px solid "+T.red.border}}>
                    <p style={{margin:"0 0 4px",fontSize:"11px",fontWeight:700,color:T.red.text,textTransform:"uppercase",letterSpacing:"0.06em"}}>Autofail</p>
                    {selectedResult.autofails.map(function(a,i){return <p key={i} style={{margin:"2px 0",fontSize:"12px",color:T.red.text}}>{a}</p>;})}
                  </div>
                )}
                {selectedResult.comments&&(
                  <div style={{marginTop:"10px"}}>
                    <p style={{...sectionLabel,marginBottom:"8px"}}>Comments</p>
                    {selectedResult.comments.split("\n").filter(function(l){return l.trim();}).map(function(line,i){
                      var isPos=line.trim().charAt(0)==='+';var isNeg=line.trim().charAt(0)==='-';
                      var col=isPos?T.green.text:isNeg?T.red.text:"var(--color-text-secondary)";
                      return <p key={i} style={{margin:"0 0 4px",fontSize:"12px",color:col,lineHeight:"1.6"}}>{line}</p>;
                    })}
                  </div>
                )}
                <button onClick={function(){setSelectedResult(null);}} style={{...ghost,marginTop:"16px",width:"100%",textAlign:"center"}}>Close</button>
              </div>
            </div>
          )}
        </div>
      )}

      {/* ── REVIEW ── */}
      {view==="review"&&(
        <div>
          {!reviewSelected?(
            <div>
              {/* Filters */}
              <div style={{...card,marginBottom:"12px"}}>
                <div style={{display:"flex",gap:"10px",flexWrap:"wrap",alignItems:"flex-end"}}>
                  <div>
                    <label style={lbl}>Week</label>
                    <select style={{fontSize:"13px",padding:"5px 8px"}} value={reviewFilters.week} onChange={function(e){setReviewFilters(function(f){return Object.assign({},f,{week:e.target.value});});}}>
                      <option value="">All weeks (ticket date)</option>
                      {[...new Set(tickets.map(function(t){return t.week;}).filter(Boolean))].sort(function(a,b){return weekSortKey(b)-weekSortKey(a);}).map(function(w){return <option key={w} value={w}>{w}</option>;})}
                    </select>
                  </div>
                  <div>
                    <label style={lbl}>Agent</label>
                    <select style={{fontSize:"13px",padding:"5px 8px"}} value={reviewFilters.agent} onChange={function(e){setReviewFilters(function(f){return Object.assign({},f,{agent:e.target.value});});}}>
                      <option value="">All agents</option>
                      {[...new Set(tickets.map(function(t){return t.agentName;}).filter(Boolean))].sort().map(function(a){return <option key={a} value={a}>{a}</option>;})}
                    </select>
                  </div>
                  {isEditor&&(
                  <div>
                    <label style={lbl}>Auditor</label>
                    <select style={{fontSize:"13px",padding:"5px 8px"}} value={reviewFilters.auditor} onChange={function(e){setReviewFilters(function(f){return Object.assign({},f,{auditor:e.target.value});});}}>
                      <option value="">All auditors</option>
                      {effectiveUsers.filter(function(u){return u.role==="full"||u.role==="edit";}).slice().sort(function(a,b){return a.name.localeCompare(b.name);}).map(function(u){return <option key={u.email} value={u.name}>{u.name}</option>;})}
                    </select>
                  </div>
                  )}
                  <label style={{display:"flex",alignItems:"center",gap:"6px",fontSize:"13px",cursor:"pointer",paddingBottom:"2px"}}>
                    <input type="checkbox" checked={reviewFilters.disputedOnly} onChange={function(e){setReviewFilters(function(f){return Object.assign({},f,{disputedOnly:e.target.checked});});}}/>
                    Disputed only
                  </label>
                  <div style={{display:"flex",flexDirection:"column",gap:"4px"}}>
                    <span style={sectionLabel}>REVIEW STATUS</span>
                    <select style={{fontSize:"13px",padding:"5px 8px"}} value={reviewFilters.reviewStatus} onChange={function(e){setReviewFilters(function(f){return Object.assign({},f,{reviewStatus:e.target.value});});}}>
                      <option value="all">All</option>
                      <option value="reviewed">Reviewed</option>
                      <option value="pending">Not reviewed yet</option>
                      {isEditor&&<option value="pending_disputes">Pending agent disputes</option>}
                    </select>
                  </div>
                  <button onClick={function(){setReviewFilters({week:"",agent:"",auditor:"",disputedOnly:false,reviewStatus:"all"});}} style={ghost}>Reset</button>
                </div>
              </div>

              {/* Ticket list */}
              {(function(){
                var filtered=tickets.filter(function(t){
                  if(reviewFilters.week&&t.week!==reviewFilters.week)return false;
                  if(reviewFilters.agent&&t.agentName!==reviewFilters.agent)return false;
                  if(reviewFilters.auditor&&t.reviewer!==reviewFilters.auditor)return false;
                  if(reviewFilters.disputedOnly&&!t.hasDisputes)return false;
                  var isReviewed=reviewedTickets[t.id||t.ticketId]||t.reviewed;
                  if(reviewFilters.reviewStatus==="reviewed"&&!isReviewed)return false;
                  if(reviewFilters.reviewStatus==="pending"&&isReviewed)return false;
                  if(reviewFilters.reviewStatus==="pending_disputes"){
                    var hasPending=t.disputes&&Object.values(t.disputes).some(function(d){return d.status==="pending";});
                    if(!hasPending)return false;
                  }
                  return true;
                }).slice().reverse();
                if(!filtered.length)return <div style={{...card,textAlign:"center",padding:"3rem",color:"var(--color-text-secondary)"}}>No tickets match your filters.</div>;
                return (
                  <div style={card}>
                    <p style={{margin:"0 0 10px",fontWeight:500,fontSize:"14px"}}>{filtered.length} tickets</p>
                    <div style={{display:"grid",gridTemplateColumns:(isEditor?"100px 1fr 1fr 80px 80px 80px 80px 80px":"100px 1fr 1fr 80px 80px 80px 80px"),gap:"6px",padding:"5px 8px",marginBottom:"4px"}}>
                      {(isEditor?["Ticket","Agent","Subject","Auditor","AI","Final","Status","Review"]:["Ticket","Agent","Subject","AI","Final","Status","Review"]).map(function(h){return <span key={h} style={{fontSize:"11px",color:"var(--color-text-secondary)"}}>{h}</span>;})}
                    </div>
                    {filtered.map(function(t){
                      var dispSc=calcDisputedScore(t,matrix);
                      var dispPassed=dispSc?(!t.autofail&&dispSc.pct>=85):t.passed;
                      var aiTone=scoreTone(t.aiScore||t.finalScore);
                      var dispTone=scoreTone(dispSc?dispSc.pct:(t.aiScore||t.finalScore));
                      var isReviewed=reviewedTickets[t.id||t.ticketId]||t.reviewed||t.hasDisputes||(t.disputes&&Object.keys(t.disputes).length>0);
                      var hasDisputes=t.hasDisputes||(t.disputes&&Object.keys(t.disputes).length>0);
                      return(
                        <div key={t.id} className="qa-row" style={{display:"grid",gridTemplateColumns:(isEditor?"100px 1fr 1fr 80px 80px 80px 80px 80px":"100px 1fr 1fr 80px 80px 80px 80px"),gap:"6px",padding:"8px",borderRadius:"var(--border-radius-md)",marginBottom:"2px",cursor:"pointer",alignItems:"center",background:isReviewed?"var(--color-background-secondary)":"transparent"}}
                          onClick={function(){setReviewSelected(t);setDisputeState({});}}>
                          <span style={{fontSize:"12px",fontWeight:500,color:"var(--color-text-info)"}}>{isTicketLocked(t)&&<span title={"Locked since "+ticketLockDateLabel(t)}>🔒 </span>}{t.ticketId}</span>
                          <span style={{fontSize:"12px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.agentName}</span>
                          <span style={{fontSize:"12px",color:"var(--color-text-secondary)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.contactReason||"—"}</span>
                          {isEditor&&<span style={{fontSize:"11px",color:"var(--color-text-secondary)"}}>{t.reviewer}</span>}
                          <span style={{fontSize:"12px",fontWeight:600,color:aiTone.text}}>{t.aiScore||t.finalScore}%</span>
                          <span style={{fontSize:"12px",fontWeight:600,color:dispTone.text}}>{dispSc?dispSc.pct:(t.aiScore||t.finalScore)}%</span>
                          <div style={{display:"flex",gap:"4px",flexWrap:"wrap"}}>
                            <span style={{fontSize:"10px",fontWeight:700,padding:"1px 6px",borderRadius:"3px",background:dispPassed?T.green.bg:T.red.bg,color:dispPassed?T.green.text:T.red.text,border:"1px solid "+(dispPassed?T.green.border:T.red.border)}}>{dispPassed?"P":"F"}</span>
                            {(function(){
                              if(!t.disputes||!Object.keys(t.disputes).length) return null;
                              var vals=Object.values(t.disputes);
                              var hasPending=vals.some(function(d){return d.status==="pending";});
                              var hasApproved=vals.some(function(d){return d.status==="approved";});
                              var hasRejected=vals.some(function(d){return d.status==="rejected";});
                              if(hasPending) return <span style={{fontSize:"10px",fontWeight:700,padding:"1px 6px",borderRadius:"3px",background:T.amber.bg,color:T.amber.text,border:"1px solid "+T.amber.border}}>D</span>;
                              if(hasApproved&&!hasRejected) return <span style={{fontSize:"10px",fontWeight:700,padding:"1px 6px",borderRadius:"3px",background:T.green.bg,color:T.green.text,border:"1px solid "+T.green.border}}>✓D</span>;
                              if(hasRejected&&!hasApproved) return <span style={{fontSize:"10px",fontWeight:700,padding:"1px 6px",borderRadius:"3px",background:T.red.bg,color:T.red.text,border:"1px solid "+T.red.border}}>✗D</span>;
                              if(hasApproved&&hasRejected) return <span style={{fontSize:"10px",fontWeight:700,padding:"1px 6px",borderRadius:"3px",background:T.amber.bg,color:T.amber.text,border:"1px solid "+T.amber.border}}>±D</span>;
                              return null;
                            })()}
                          </div>
                          <div>
                            {isReviewed

              </button>
              {showAdvancedFetch&&(

                    <div><FetchMultiSelect label="Resolution L2" options={ctfL2List(ctfFieldOpts.fields.resolution, selIsActive(fetchForm.resL1)?selChosen(fetchForm.resL1):null)} selected={fetchForm.resL2}

                    <div><FetchMultiSelect label="Add. Resolution L1" options={ctfL1List(ctfFieldOpts.fields.addResolution)} selected={fetchForm.addResL1}

                    {label:"Skipped — resolution",val:fetchSummary.skippedRes,color:fetchSummary.skippedRes>0?"var(--color-text-warning)":null},

                    {label:"Skipped — agent msg count",val:fetchSummary.skippedAgentMsgCount,color:fetchSummary.skippedAgentMsgCount>0?"var(--color-text-warning)":null},

                      <span style={{color:row.color||"var(--color-text-secondary)",fontWeight:row.bold?700:400}}>{row.label}</span>
                      <span style={{fontWeight:700,color:row.color||"var(--color-text-secondary)",marginLeft:"8px"}}>{row.val}</span>

                <input type="number" min="1" value={fetchForm.balanceTarget} placeholder="6"
                  onChange={function(e){setFetchForm(function(ff){return Object.assign({},ff,{balanceTarget:e.target.value});});}}
                  style={{width:"64px",boxSizing:"border-box",fontSize:"12px",padding:"6px 8px",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)"}}/>
                <button onClick={function(){fetchGorgiasTickets({balance:true});}} disabled={fetchLoading}

                </button>
              </div>
              {fetchLoading&&(
                <button onClick={function(){fetchCancelRef.current=true;}}

          {balanceReport&&(
            <div style={card}>

                <span style={{fontWeight:700,color:"var(--color-text-secondary)"}}>Agent</span>

                <span style={{fontWeight:700,color:"var(--color-text-secondary)",textAlign:"right"}}>Pulled</span>
                <span style={{fontWeight:700,color:"var(--color-text-secondary)",textAlign:"right"}}>Now</span>
                <span style={{fontWeight:700,color:"var(--color-text-secondary)",textAlign:"right"}}>Short</span>
                {balanceReport.rows.map(function(r){return <React.Fragment key={r.agent}>
                  <span>{r.agent}</span>
                  <span style={{textAlign:"right"}}>{r.had}</span>
                  <span style={{textAlign:"right"}}>{r.pulled}</span>
                  <span style={{textAlign:"right"}}>{r.total}</span>
                  <span style={{textAlign:"right",color:r.short>0?"var(--color-text-warning)":"var(--color-text-secondary)"}}>{r.short>0?r.short:"—"}</span>
                </React.Fragment>;})}
              </div>
              <p style={{margin:"10px 0 0",fontSize:"11px",color:"var(--color-text-secondary)"}}>The pulled tickets are below. Run QA (or CSV + Run QA) to score and save them — that's what brings each agent up to target in the database.{balanceReport.rateLimited?" Note: this run was rate-limited by Gorgias and may be incomplete.":""}</p>
            </div>

                  </tbody>
                </table>
                {fetchedTickets.length>100&&<p style={{fontSize:"11px",color:"var(--color-text-secondary)",textAlign:"center",marginTop:"10px"}}>Showing first 100 of {fetchedTickets.length} — all will be included in CSV / QA run</p>}
              </div>
            </div>
          )}
        </div>

      {/* ── FETCH V2 TAB (warehouse-selected) ── */}
      {view==="fetchv2"&&isEditor&&(
        <div>

          <div style={{...card,marginBottom:"16px"}}>
            <p style={{...sectionLabel,marginBottom:"10px"}}>Step 1 — Generate the query</p>
            <div style={{display:"flex",gap:"10px",alignItems:"flex-end",flexWrap:"wrap",marginBottom:"10px"}}>

                <label style={{...lbl,marginBottom:"4px"}}>Week (any day in it)</label>

                  style={{fontSize:"12px",padding:"6px 8px",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)"}}/>
              </div>
              <div>
                <label style={{...lbl,marginBottom:"4px"}}>Per agent</label>
                <input type="number" value={v2Target} onChange={function(e){setV2Target(e.target.value);}}
                  style={{width:"70px",fontSize:"12px",padding:"6px 8px",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)"}}/>
              </div>
              <div>
                <label style={{...lbl,marginBottom:"4px"}}>Preferred min</label>
                <input type="number" value={v2MinAgentMsg} onChange={function(e){setV2MinAgentMsg(e.target.value);}}
                  style={{width:"70px",fontSize:"12px",padding:"6px 8px",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)"}}/>
              </div>
              <div>
                <label style={{...lbl,marginBottom:"4px"}}>Floor</label>
                <input type="number" value={v2FloorAgentMsg} onChange={function(e){setV2FloorAgentMsg(e.target.value);}}
                  style={{width:"70px",fontSize:"12px",padding:"6px 8px",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)"}}/>
              </div>
              <button onClick={function(){
                var sql = buildV2SQL();
                if(!sql){ addToast("Pick a week first","error"); return; }

              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(170px,1fr))",gap:"10px"}}>
                {V2_FILTER_DEFS.map(function(d){
                  var choices = ctfFieldOpts.fields[d.opts]||[];
                  var l1Key = d.key.replace("L2","L1");

              style={{width:"100%",boxSizing:"border-box",height:"90px",fontFamily:"ui-monospace,Menlo,monospace",fontSize:"11.5px",

            <div style={{display:"flex",gap:"10px",alignItems:"center",flexWrap:"wrap"}}>
              <span style={{fontSize:"12px",fontWeight:600,color:parseV2Ids(v2IdInput).length?"var(--color-text-success)":"var(--color-text-secondary)"}}>

              <span style={{fontSize:"12px",color:"var(--color-text-secondary)"}}>From</span>

            {(function(){
              function localDateStr(d){
                // Format as YYYY-MM-DD in LOCAL time (not UTC)
                var y=d.getFullYear();
                var m=String(d.getMonth()+1).padStart(2,"0");
                var day=String(d.getDate()).padStart(2,"0");
                return y+"-"+m+"-"+day;

              var filters=[
                {label:"This week",fn:function(){

                  var sun=new Date(mon);sun.setDate(mon.getDate()+6);
                  setDashFrom(localDateStr(mon));setDashTo(localDateStr(sun));
                }},
                {label:"Last week",fn:function(){
                  var d=new Date();
                  var day=d.getDay()||7;
                  var mon=new Date(d);mon.setDate(d.getDate()-day+1-7);
                  var sun=new Date(mon);sun.setDate(mon.getDate()+6);
                  setDashFrom(localDateStr(mon));setDashTo(localDateStr(sun));
                }},
                {label:"This month",fn:function(){
                  var d=new Date();
                  setDashFrom(localDateStr(new Date(d.getFullYear(),d.getMonth(),1)));
                  setDashTo(localDateStr(new Date(d.getFullYear(),d.getMonth()+1,0)));
                }},

                  var d=new Date();
                  setDashFrom(localDateStr(new Date(d.getFullYear(),d.getMonth()-1,1)));

              ];

          {(function(){

              if(!cd||cd.length<10) return false;
              if(dashFrom&&cd<dashFrom) return false;
              if(dashTo&&cd>dashTo) return false;
              return true;

            var aiPassRate=filtered.length?Math.round(filtered.filter(function(t){return t.passed;}).length/filtered.length*100):null;
